name: Deploy to Cloudflare Pages (production)

# Production: electrighteous.com / www.electrighteous.com (Pages project "elect-righteous").
# The GitHub Pages leg (legacy) stays in deploy.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      # Custom-domain build: empty NEXT_PUBLIC_SITE_BASE_PATH, so no /elect-righteous basePath.
      - run: npm run build:cloudflare

      - name: Check build has no GitHub Pages basePath
        run: |
          test -f out/index.html
          if grep -q '/elect-righteous/_next/' out/index.html; then
            echo "out/index.html references /elect-righteous/_next/ - GitHub Pages build, refusing to deploy"
            exit 1
          fi

      - name: Deploy
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: af76b8aeaa433c3fd3c17ce77375062f
        run: npx wrangler@4.53.0 pages deploy ui/out --project-name elect-righteous --branch main

      - name: Verify live site
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' https://electrighteous.com/)
          echo "https://electrighteous.com/ -> $status"
          test "$status" = "200"
