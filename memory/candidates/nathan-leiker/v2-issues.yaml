    classification: donor-organization-signal
    text: 'narrative: "Nathan Leiker''s public messaging is grounded in county operations
      and agriculture, not in a large campaign-social presence. The official [Ellis
      County Commission page](https://www.ellisco.net/120/County-Commission) lists
      him as the Third District commissioner, gives the public meeting schedule, and
      points residents to agendas, minutes, and the county''s YouTube livestream.
      The county-controlled record is therefore one of the main ways his current public
      voice appears.\n\nHis 2022 campaign language presented him as a local farm-and-ranch
      operator with zoning, Extension, oil-field, and rural-fire experience. In his
      [campaign announcement](https://hayspost.com/posts/aedbf614-0ea1-4a7c-8932-156b271a4709),
      he credited his family and said he had worked in positions that took him throughout
      the county. He described himself as proud to be from Ellis County and ready
