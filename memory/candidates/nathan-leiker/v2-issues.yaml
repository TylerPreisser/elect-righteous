  - evidenceRowId: em-nathan-leiker-01797
    classification: faith-community-record
    text: Leiker is the agricultural voice on the commission -- a working farmer managing
      2,000+ acres across two counties. His TMP-Marian background places him squarely
      in the Catholic Volga German community that is the cultural bedrock of Ellis
      County. His 2022 primary win over the incumbent (who finished last in a four-way
      race) suggests the rural agricultural community wanted fresh representation.
      His budget discipline ("2 paychecks a year") translates directly to his government
      approach -- during the 2026 budget, he noted the commission spent "almost 13
      hours going through each department, item by item, justifying costs and adjustments."
