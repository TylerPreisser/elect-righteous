  evidenceItems:
  - evidenceRowId: em-nathan-leiker-00005
    classification: candidate-stated
    text: Infrastructure is the dominant through-line. After the 2022 canvass, he
      said he wanted increased focus on roads, bridges, and the infrastructure needed
      to grow the county, according to [Hays Post](https://hayspost.com/posts/6e260438-27db-4402-bf8e-e8df621996d4).
      In 2024, when Ellis County discussed rural road maintenance, he said the county
      had promoted subdivision growth without growing public works capacity to handle
      the added residents, as reported by [Hays Post](https://hayspost.com/posts/0ec5af1e-3acd-4f02-9842-bf61a57eae9a).
      In 2025, he suggested dividing the county into regions and using a project manager
      or team to prioritize right-of-way and road-maintenance issues, again in [Hays
      Post coverage](https://hayspost.com/posts/c7baa7e1-bdbb-4850-9c17-62b30660f9e0).
    sourceIds:
