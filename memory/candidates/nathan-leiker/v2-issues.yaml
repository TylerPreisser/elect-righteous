- issueNumber: 5
  title: Taxes / spending / debt
  summary: 'Taxes / spending / debt: 35 selected evidence items from 192 mapped rows.
    Public URL-backed rows: 32.'
  evidenceItems:
  - evidenceRowId: em-nathan-leiker-00007
    classification: candidate-stated
    text: On budgets and taxes, he speaks as a fiscal conservative who still accepts
      spending when tied to services, infrastructure, and risk management. In [October
      2024 budget coverage](https://hayspost.com/posts/d81583db-0414-44c6-8dac-7d4ad565ed13),
      he said commissioners try to limit their tax-dollar impact but warned against
      deferring bridge and road needs until they become failures or accidents. In
      [August 2025](https://hayspost.com/posts/7c57b3c8-1314-4bd7-8501-f559ff7c176d),
      he said a proposed mill increase would give the county a soft landing if state
      or federal grants were pulled. In [December 2025](https://hayspost.com/posts/0dc3bf76-bd9f-4190-a0c7-231ca8172d18),
      he complained that counties keep losing tools from their toolbox and then get
      told they are not doing the job right.
    sourceIds:
    - mem-memory-candidates-nathan-leiker-in-their-own-words-md-l13
    sourceUrl: https://hayspost.com/posts/d81583db-0414-44c6-8dac-7d4ad565ed13
    sourceFile: memory/candidates/nathan-leiker/in-their-own-words.md:13
    confidence: likely
    useDecision: use
  - evidenceRowId: em-nathan-leiker-00066
    classification: candidate-stated
    text: '> "Leiker asked County Administrator Darin Myers to speak on the RHID process.
      Myers discussed the RHID process. Eck spoke on if nothing is constructed there
      would be no taxes generated and the developer would not get reimbursed. Leiker
      asked Justin Craig to speak on the process of plating. ... Leiker asked if there
      was anything that would be required to do a water study. Craig said statutorily
      there is not, but it can be requested."'
    sourceIds:
    - mem-memory-candidates-nathan-leiker-raw-dump-v2-md-l89
    sourceUrl:
    sourceFile: memory/candidates/nathan-leiker/raw-dump-v2.md:89
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-nathan-leiker-00087
    classification: candidate-stated
    text: '> "Leiker said they have been working with this budget for over six months
      but we are also taking a forward look so we can be proactive. He said we have
      lowered the levy in the last two years. He asked Myers to explain the 1.9 mills
      increase. Myers said the .9 mills is just through budget adjustments, and the
      one mill increase is for the possibility of losing federal funding next year."'
    sourceIds:
    - mem-memory-candidates-nathan-leiker-raw-dump-v2-md-l129
    sourceUrl:
    sourceFile: memory/candidates/nathan-leiker/raw-dump-v2.md:129
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-nathan-leiker-00088
    classification: candidate-stated
    text: '> "Leiker said the Commissioners have spent over 13 hours going over line
      item by line item and said there are programs that most people partake in maybe
      could be cut and the County is trying to look forward to this and prepare if
      it does happen. Leiker said the commissioners see the numbers on a weekly and
      monthly basis to make sure the employees are spending the money correctly. He
      said he see departments doing so well in cutting their budgets that they end
      up hurting themselves."'
    sourceIds:
    - mem-memory-candidates-nathan-leiker-raw-dump-v2-md-l131
    sourceUrl:
    sourceFile: memory/candidates/nathan-leiker/raw-dump-v2.md:131
    confidence: unknown
    useDecision: background-only
