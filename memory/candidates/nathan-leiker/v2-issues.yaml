  - evidenceRowId: em-nathan-leiker-00008
    classification: documented-record
    text: His agriculture messaging predates county office and reinforces the same
      practical tone. In [Ingram's 2021 profile](https://ingrams.com/article/50-kansans-you-should-know-2021/),
      Leiker described L5 Farms as part of a fifth-generation farm in Ellis County
      and talked about direct producer-consumer relationships after COVID exposed
      the fragility of food-supply relationships. In a [2023 MyAnIML case study](https://myaniml.com/Kansas_Rancher_Installs_MyAnIML_to_Save.pdf),
      he framed cattle-health technology in terms of labor limits, earlier treatment,
      low-stress handling, and finding operational improvements through better monitoring.
