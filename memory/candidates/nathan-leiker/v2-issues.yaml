  - evidenceRowId: em-nathan-leiker-00002
    classification: documented-record
    text: Nathan Leiker's public messaging is grounded in county operations and agriculture,
      not in a large campaign-social presence. The official [Ellis County Commission
      page](https://www.ellisco.net/120/County-Commission) lists him as the Third
      District commissioner, gives the public meeting schedule, and points residents
      to agendas, minutes, and the county's YouTube livestream. The county-controlled
      record is therefore one of the main ways his current public voice appears.
    sourceIds:
    - mem-memory-candidates-nathan-leiker-in-their-own-words-md-l3
    sourceUrl: https://www.ellisco.net/120/County-Commission
    sourceFile: memory/candidates/nathan-leiker/in-their-own-words.md:3
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-nathan-leiker-00003
    classification: documented-record
    text: His 2022 campaign language presented him as a local farm-and-ranch operator
      with zoning, Extension, oil-field, and rural-fire experience. In his [campaign
      announcement](https://hayspost.com/posts/aedbf614-0ea1-4a7c-8932-156b271a4709),
      he credited his family and said he had worked in positions that took him throughout
      the county. He described himself as proud to be from Ellis County and ready
      to serve it.
    sourceIds:
    - mem-memory-candidates-nathan-leiker-in-their-own-words-md-l5
    sourceUrl: https://hayspost.com/posts/aedbf614-0ea1-4a7c-8932-156b271a4709
    sourceFile: memory/candidates/nathan-leiker/in-their-own-words.md:5
    confidence: likely
    useDecision: use
  - evidenceRowId: em-nathan-leiker-00004
    classification: documented-record
    text: The clearest platform document is his [Hays Post candidate Q&A](https://hayspost.com/posts/599cb8a3-fed5-4c96-bb58-7079dcedac17).
      There, Leiker argued for keeping the county sales tax and making it permanent
      before sunset, but tying those dollars to infrastructure and large capital improvements.
      He said county voters worry about where their money is going, and he connected
      transparency to visible evidence of roads, bridges, and public work actually
      getting done.
    sourceIds:
    - mem-memory-candidates-nathan-leiker-in-their-own-words-md-l7
    sourceUrl: https://hayspost.com/posts/599cb8a3-fed5-4c96-bb58-7079dcedac17
