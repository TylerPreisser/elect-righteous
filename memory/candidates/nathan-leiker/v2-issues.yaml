  - evidenceRowId: em-nathan-leiker-00006
    classification: documented-record
    text: Leiker's development message is pro-growth but bounded by planning and infrastructure
      capacity. In the candidate Q&A, he said the county should recruit business by
      keeping taxes stable and showing it can maintain infrastructure. At an August
      2024 joint city-county meeting, he called the Vineyard Road discussion a forward-looking
      project and said Hays was clearly developing north of I-70, according to [Hays
      Post](https://hayspost.com/posts/2584b551-eb90-4e5b-abbf-fd3ef6cab0bc). But
      he also opposed the Fairview Patch subdivision, saying in [May 2025](https://hayspost.com/posts/4f685bbb-15b3-4649-acc2-fae5a0efb0bd)
      that the location worked against the comprehensive plan and in [July 2025](https://hayspost.com/posts/fa81e374-6f44-4875-8984-b7869e10c11d)
      that it was getting far from localized subdivision patterns. In [March 2026](https://hayspost.com/posts/d4ad7eb6-4af1-419c-b0ec-e8786acdca3…
    sourceIds:
