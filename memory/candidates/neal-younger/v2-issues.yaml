inTheirOwnWords:
  narrative: |
    Younger's public messaging is sparse and practical. The clearest
    candidate-attributed source is his 2020 Hays Post questionnaire, where he
    presented himself as a tradesman focused on communication, spending review,
    roads, water, employee pay, and department-by-department familiarity. Later
    meeting coverage and official minutes show a governing record that is still
    practical but less purely spending-skeptical: he voted for the 2026 budget
    over revenue-neutral rates, supported employee COLA, backed mental-health
    funding as jail-cost avoidance, and repeatedly asked infrastructure and
    water-detail questions during housing and subdivision discussions.
  sourceIds:
    - s-hayspost-candidate-2020
    - s-minutes-09092025
    - s-hayspost-budget-approved-2025
    - s-hayspost-budget-tentative-2025
    - s-minutes-02102026

