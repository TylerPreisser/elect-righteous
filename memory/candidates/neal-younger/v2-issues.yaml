        date: "2025-06-10"
        type: "employee_pay_vote"
        description: "Younger seconded a motion to implement a 2.5% COLA for Ellis County employees, contract positions, and elected officials."
        outcome: "Motion passed 2-1, with Berges dissenting."
        sourceIds:
          - s-minutes-06102025
          - s-hayspost-cola-2025
      - id: action-secured-load-policy
        date: "2025-06-10"
        type: "public_safety_policy"
        description: "Younger moved Resolution 2025-10 implementing an Ellis County secured-load policy at the landfill."
        outcome: "Motion passed 3-0; policy created load-securement requirements and surcharge/enforcement procedures."
        sourceIds:
          - s-minutes-06102025
      - id: action-county-retreat
        date: "2026-04-08"
        type: "department_planning"
        description: "Chair Younger called a county retreat where staff discussed department challenges, short-term needs, capital planning, financial future, possible tax tools, and sheriff staffing."
        outcome: "No formal vote recorded; retreat built department and budget context."
        sourceIds:
          - s-minutes-04082026
