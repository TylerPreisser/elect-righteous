- issueNumber: 5
  title: Taxes / spending / debt
  summary: 'Taxes / spending / debt: 37 selected evidence items from 157 mapped rows.
    Public URL-backed rows: 14.'
  evidenceItems:
  - evidenceRowId: em-neal-younger-00004
    classification: candidate-stated
    text: The most consistent theme is county spending, but his record reads as fiscal
      pragmatism rather than simple budget cutting. In 2020, he identified "Ellis
      County spending too much money" as a top voter concern and said the county should
      keep people involved in meetings. By 2025, during debate over the 2026 budget,
      he defended high spending as tied to core county services including ambulance,
      road and bridge, noxious weeds, and mental health. In the coded harvest, county
      finances, taxes, and budget process are the largest topic area, with 8 counted
      items. ([source](https://hayspost.com/posts/70a84c66-2d84-4023-b4bb-df360cbe90dd),
      [source](https://hayspost.com/posts/0e698b7b-a28f-4a21-9b40-880346e893ec), [harvest](social-harvest.md#topic-counts))
