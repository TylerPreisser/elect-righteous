      and YouTube meeting records. Official minutes from January 13, 2026 show the
      commission appointed him chair for the year and appointed him to the Northwest
      Kansas Juvenile Board and Community Corrections. Later 2026 minutes show him
      calling meetings to order, participating in a road tour, and leading a county
      retreat with department and budget discussions. ([source](https://www.ellisco.net/120/County-Commission),
