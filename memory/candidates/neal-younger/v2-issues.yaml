  evidenceItems:
  - evidenceRowId: em-neal-younger-00004
    classification: candidate-stated
    text: The most consistent theme is county spending, but his record reads as fiscal
      pragmatism rather than simple budget cutting. In 2020, he identified "Ellis
      County spending too much money" as a top voter concern and said the county should
      keep people involved in meetings. By 2025, during debate over the 2026 budget,
      he defended high spending as tied to core county services including ambulance,
      road and bridge, noxious weeds, and mental health. In the coded harvest, county
      finances, taxes, and budget process are the largest topic area, with 8 counted
      items. ([source](https://hayspost.com/posts/70a84c66-2d84-4023-b4bb-df360cbe90dd),
      [source](https://hayspost.com/posts/0e698b7b-a28f-4a21-9b40-880346e893ec), [harvest](social-harvest.md#topic-counts))
    sourceIds:
    - mem-memory-candidates-neal-younger-in-their-own-words-md-l9
    sourceUrl: https://hayspost.com/posts/70a84c66-2d84-4023-b4bb-df360cbe90dd
    sourceFile: memory/candidates/neal-younger/in-their-own-words.md:9
    confidence: likely
    useDecision: use
  - evidenceRowId: em-neal-younger-00006
    classification: candidate-stated
    text: Roads, water, housing, and development form the second major pattern. In
      2020, Younger said the county should work with Hays on water and "higher-paying
      jobs." In 2024 joint city-county coverage, he supported Commerce Parkway access
      as a useful route to the new school, I-70, north Hays, and future development.
      In 2025 and 2026 housing and water discussions, he asked practical questions
      about traffic signals, rural water, county well access, and what would happen
      if planned private wells did not produce water. These infrastructure and development
      items account for 7 counted items in the harvest. ([source](https://hayspost.com/posts/70a84c66-2d84-4023-b4bb-df360cbe90dd),
      [source](https://hayspost.com/posts/2584b551-eb90-4e5b-abbf-fd3ef6cab0bc), [source](https://hayspost.com/posts/ee851b27-fd93-4943-b1ba-e924696a0982),
      [source](https://hayspost.com/posts/6ba197c2-04b6-4e73-8650-431120cea10…
    sourceIds:
    - mem-memory-candidates-neal-younger-in-their-own-words-md-l13
    sourceUrl: https://hayspost.com/posts/70a84c66-2d84-4023-b4bb-df360cbe90dd
    sourceFile: memory/candidates/neal-younger/in-their-own-words.md:13
    confidence: likely
    useDecision: use
  - evidenceRowId: em-neal-younger-00008
    classification: candidate-stated
    text: Communication and public involvement are also recurring. Younger said in
      2020 that city commissioners should attend county meetings and county commissioners
      should attend city meetings. He said he would talk with taxpayers and attend
      surrounding city, town, and fire meetings. At a 2024 Hays Middle School voter-education
      event, Hays Post reported that he told students listening to constituents and
      fellow leaders is important for staying connected, and he rooted that lesson
      in listening at home. ([source](https://hayspost.com/posts/70a84c66-2d84-4023-b4bb-df360cbe90dd),
      [source](https://hayspost.com/posts/fd6be90b-bcb4-49d7-bf9a-20194a876c3c))
    sourceIds:
    - mem-memory-candidates-neal-younger-in-their-own-words-md-l17
    sourceUrl: https://hayspost.com/posts/70a84c66-2d84-4023-b4bb-df360cbe90dd
    sourceFile: memory/candidates/neal-younger/in-their-own-words.md:17
    confidence: likely
    useDecision: use
