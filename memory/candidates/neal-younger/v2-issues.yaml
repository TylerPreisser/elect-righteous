  - id: county-budget-taxes-and-service-levels
    title: "County Budget, Taxes, and Service Levels"
    stated:
      text: "Younger ran in 2020 with county spending as a top concern and said Ellis County should maintain what it had until normal needs returned. In office, the clearest budget pattern is scrutiny plus service funding: he voted for the 2026 budgets exceeding revenue-neutral rates, and official minutes record him explaining that county spending is tied to many required services with large costs."
      sourceIds:
        - s-hayspost-candidate-2020
        - s-minutes-09092025
        - s-hayspost-budget-approved-2025
    actions:
      - id: action-2026-budget-rnr
        date: "2025-09-09"
        type: "budget_vote"
        description: "Younger voted yes by named roll call on 2026 General Fund and Fire District budgets exceeding the revenue-neutral rates and Resolution 2025-14."
        outcome: "Motion passed 3-0; resolution authorized levying property tax above the revenue-neutral rate."
        sourceIds:
          - s-minutes-09092025
          - s-hayspost-budget-approved-2025
      - id: action-health-ehr-purchase
        date: "2025-09-09"
        type: "purchase_order"
        description: "Younger moved approval of a Patagonia Health electronic health record purchase for the Ellis County Health Department."
        outcome: "Motion passed by 3-0 voice vote."
        sourceIds:
          - s-minutes-09092025
      - id: action-budget-outside-agency-adjustments
        date: "2025-08-07"
        type: "reported_budget_position"
        description: "Hays Post reported Younger supported reducing scholarship funding until the next budget and proposed shifting $5,000 from Grow Hays to the Ellis County Historical Society."
        outcome: "Shows budget-line scrutiny and reallocation preference in outside-agency discussion."
        sourceIds:
          - s-hayspost-budget-readjust-2025
    socialSignals: []
    gap:
      summary: "The record should not be reduced to either anti-tax or pro-spending. His 2020 spending concern and 2025 budget vote point to a service-justification frame that changed with governing context."
      sourceIds:
