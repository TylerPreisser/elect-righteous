      - id: action-big-creek-return
        date: "2026-01-06"
        type: "plat_review"
        description: "Younger seconded the motion sending Big Creek Estates preliminary plat back to zoning board for more recommendations after water, road, stormwater, lot-size, and variance issues were discussed."
