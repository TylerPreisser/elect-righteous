  - evidenceRowId: em-neal-younger-00007
    classification: documented-record
    text: Younger's governing style, as described in public sources, is hands-on and
      department-focused. In 2020, he said he would spend one to two hours in county
      offices and field operations to see whether staffing levels were right. He favored
      more meetings with department heads and communication with employees. In 2025,
      when the county approved a cost-of-living adjustment, he said the county did
      not want to be a training center. That cluster of statements makes employees,
      staffing, departments, and service delivery the third-largest topic area in
      the harvest, with 6 counted items. ([source](https://hayspost.com/posts/70a84c66-2d84-4023-b4bb-df360cbe90dd),
