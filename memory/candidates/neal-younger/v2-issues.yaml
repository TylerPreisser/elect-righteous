    classification: documented-record
    text: His clearest later budget message came in the mental-health funding debate.
      Hays Post reported in July 2025 that Younger supported the requested High Plains
      Mental Health increase because it was less expensive than building a new jail.
      That framing tied county spending to cost avoidance and public safety rather
      than to a standalone service expansion. The county's March 17, 2026 minutes
      also recorded that, as commission chair, Younger had attended a High Plains
      Mental Health fundraiser. ([source](https://hayspost.com/posts/fbac2993-56a7-4ebb-b494-5a194944d2c2),
