  - id: roads-water-housing-and-development
    title: "Roads, Water, Housing, and Development"
    stated:
      text: "Younger has repeatedly linked growth to physical infrastructure. In 2020 he said the county should work with Hays on water and higher-paying jobs. Later records show him asking practical water and road questions in Big Creek Estates, supporting Commerce Parkway as a route tied to schools, I-70 access and development, and leading/participating in county road-tour and CID discussions."
      sourceIds:
        - s-hayspost-candidate-2020
        - s-hayspost-commerce-parkway-2024
        - s-minutes-01062026
        - s-minutes-02102026
        - s-minutes-03312026
        - s-minutes-04142026
    actions:
      - id: action-commerce-parkway-statement
        date: "2024-08-16"
        type: "reported_public_statement"
        description: "Hays Post reported Younger supporting Commerce Parkway access as useful for school access, interstate access, north Hays traffic, and development."
        outcome: "Creates a public-statement anchor for road/infrastructure development priorities."
        sourceIds:
          - s-hayspost-commerce-parkway-2024
      - id: action-big-creek-return
        date: "2026-01-06"
        type: "plat_review"
        description: "Younger seconded the motion sending Big Creek Estates preliminary plat back to zoning board for more recommendations after water, road, stormwater, lot-size, and variance issues were discussed."
        outcome: "Motion passed 3-0; plat was neither approved nor denied at that stage."
        sourceIds:
          - s-minutes-01062026
          - s-hayspost-big-creek-return-2026
      - id: action-big-creek-approval
        date: "2026-02-10"
        type: "plat_review"
        description: "Big Creek Estates preliminary plat returned after planning review; Younger asked what would happen if a planned well had to be moved because no water was found."
        outcome: "Preliminary plat approval passed 3-0 with written sewer-system approval condition."
        sourceIds:
          - s-minutes-02102026
          - s-hayspost-big-creek-approve-2026
      - id: action-cid-parameters
        date: "2026-02-10"
        type: "policy_discussion"
        description: "Commission discussed CID parameters including two-thirds landowner support, 75% build-out, and road-improvement options; Berges and Younger affirmed adding asphalt road miles."
        outcome: "Created operating parameters for future subdivision road-improvement petitions."
        sourceIds:
          - s-minutes-02102026
      - id: action-road-tour-2026
        date: "2026-03-31"
        type: "road_tour"
        description: "Chair Younger called a special road-tour session covering right-of-way, solar-project road-use issues, culverts, bridges, subdivision roads, water lines in ditches, and transfer-station expansion ideas."
        outcome: "No formal action was taken."
        sourceIds:
          - s-minutes-03312026
      - id: action-stonewood-cid-resolution
        date: "2026-04-14"
        type: "cid_resolution"
        description: "Younger seconded Resolution 2026-08 calling a public hearing on Stonewood Estates CID road-improvement assessments."
        outcome: "Motion passed 2-0."
        sourceIds:
          - s-minutes-04142026
