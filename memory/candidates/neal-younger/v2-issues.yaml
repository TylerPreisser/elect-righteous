  - evidenceRowId: em-neal-younger-00003
    classification: documented-record
    text: 'Neal Younger''s public messaging footprint is unusually small for an incumbent
      elected official. No verified campaign website or candidate-controlled social
      account was found, and the strongest first-person source remains his July 30,
      2020 Hays Post candidate questionnaire. In that questionnaire, he presented
      himself as a tradesman and practical county-government candidate: an electrician
      and plumber with construction experience who works by listening, talking, and
      reaching "common sense." ([source](https://hayspost.com/posts/70a84c66-2d84-4023-b4bb-df360cbe90dd),
      [harvest](social-harvest.md#2020-candidate-questionnaire))'
    sourceIds:
