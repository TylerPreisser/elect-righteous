  - evidenceRowId: em-scott-braun-00008
    classification: documented-record
    text: Braun carried that issue into the Legislature. In [March 2026 coverage](https://hayspost.com/posts/69131eb8-04ac-4b1d-9561-e24c9309ad07)
      of his HB 2771 testimony, he framed ICE-detainer legislation as liability clarity,
      fiscal responsibility, county protection, and taxpayer protection. He said Ellis
      County signed the ICE agreement partly because of grant-funding risk, but also
      said community protection was the main reason for remaining in the program.
      The [public bill tracker](https://fastdemocracy.com/bill-search/ks/2025-2026/bills/KSB00012057/)
      lists Braun's February 25, 2026 testimony as an oral proponent item.
