- issueNumber: 13
  title: Local governance / transparency / ethics
  summary: 'Local governance / transparency / ethics: 40 selected evidence items from
    819 mapped rows. Public URL-backed rows: 146.'
  evidenceItems:
  - evidenceRowId: em-scott-braun-00006
    classification: candidate-stated
    text: On drugs and forfeiture, Braun speaks as both sheriff and statewide sheriffs'
      association figure. In [January 2024](https://hayspost.com/posts/5e9ec24b-53c4-40ff-9c9d-36bfbdf8808a),
      he defended local retention of drug-forfeiture funds, saying seized money supports
      equipment and controlled buys and warning that losing it would shift costs to
      taxpayers. He also tied forfeiture to cutting off drug operations' funding.
      In [April 2025](https://hayspost.com/posts/f373c9f4-8c84-4f33-8102-f67d7ce2927a),
      he sought opioid settlement money for local law-enforcement training on fentanyl
      and opioid-overdose death investigations.
    sourceIds:
    - mem-memory-candidates-scott-braun-in-their-own-words-md-l11
    sourceUrl: https://hayspost.com/posts/5e9ec24b-53c4-40ff-9c9d-36bfbdf8808a
    sourceFile: memory/candidates/scott-braun/in-their-own-words.md:11
    confidence: likely
    useDecision: use
  - evidenceRowId: em-scott-braun-00007
    classification: candidate-stated
    text: 'Immigration and border enforcement became a major public signal in 2025
      and 2026. After joining a Kansas law-enforcement visit to the Arizona-Mexico
      border, Braun said in a [Sen. Roger Marshall release](https://www.marshall.senate.gov/newsroom/press-releases/senator-marshall-visits-southern-border-alongside-kansas-law-enforcement-officials/)
      that border security is tied to stopping narcotics and human trafficking that
      affect Kansas. Later, in [Hays Post coverage of Ellis County''s ICE memorandum](https://hayspost.com/posts/3bc2ad3c-f94d-4a73-a42b-77f18e6317d6),
      he emphasized limits: Ellis County could honor a detainer only within the legal
      48-hour window and deputies were not stopping people in the street for immigration
      investigations.'
    sourceIds:
    - mem-memory-candidates-scott-braun-in-their-own-words-md-l13
    sourceUrl: https://www.marshall.senate.gov/newsroom/press-releases/senator-marshall-visits-southern-border-alongside-kansas-law-enforcement-officials/
    sourceFile: memory/candidates/scott-braun/in-their-own-words.md:13
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-scott-braun-00080
    classification: candidate-stated
    text: "| s-marshall-border-release-2025 | secondary/official | https://www.marshall.senate.gov/newsroom/press-releases/senator-marshall-visits-southern-border-alongside-kansas-law-enforcement-officials/
      | 2026-05-19 | Release lists Braun on border visit and includes attributed border/narcotics/human-trafficking
      statement | immigration, drugs |"
    sourceIds:
    - mem-memory-candidates-scott-braun-raw-dump-v2-md-l49
    sourceUrl: https://www.marshall.senate.gov/newsroom/press-releases/senator-marshall-visits-southern-border-alongside-kansas-law-enforcement-officials/
    sourceFile: memory/candidates/scott-braun/raw-dump-v2.md:49
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-scott-braun-02172
    classification: candidate-stated
    text: "| Federal official attribution | Yes | [Sen. Roger Marshall border visit
      release](https://www.marshall.senate.gov/newsroom/press-releases/senator-marshall-visits-southern-border-alongside-kansas-law-enforcement-officials/)
      | Includes a dated, attributed statement from Braun after a May 2025 Arizona
      border trip. |"
    sourceIds:
    - mem-memory-candidates-scott-braun-social-harvest-md-l25
    sourceUrl: https://www.marshall.senate.gov/newsroom/press-releases/senator-marshall-visits-southern-border-alongside-kansas-law-enforcement-officials/
    sourceFile: memory/candidates/scott-braun/social-harvest.md:25
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-scott-braun-00092
    classification: candidate-stated
    text: Hays Post's 2019 announcement says Braun graduated from Victoria High School,
      attended Barton County Community College and Fort Hays State University, began
      as a reserve deputy in 1995, worked for the Ellis Police Department, graduated
      from the Kansas Law Enforcement Training Center in 1996, joined the Ellis County
      Sheriff's Office in 1997, worked in the drug enforcement unit, spearheaded the
      county canine program in 1999, became narcotics detective in 2005, and was appointed
      undersheriff in 2018.
    sourceIds:
    - mem-memory-candidates-scott-braun-raw-dump-v2-md-l66
    sourceUrl:
    sourceFile: memory/candidates/scott-braun/raw-dump-v2.md:66
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-scott-braun-00110
    classification: candidate-stated
    text: Braun repeatedly frames jail capacity as a practical public-safety issue.
      In Dec. 2023 Hays Post coverage, he explained that the jail's nominal 72-bed
      capacity cannot always be fully used because of isolation, witness separation,
      inmate behavior, gender, offense levels, and COVID-era effects. In July 2024
      coverage, he said the county needed a jail even though he did not personally
      want one, and tied the issue to public safety, mental health, and long-range
      planning.
    sourceIds:
    - mem-memory-candidates-scott-braun-raw-dump-v2-md-l102
    sourceUrl:
    sourceFile: memory/candidates/scott-braun/raw-dump-v2.md:102
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-scott-braun-00112
    classification: candidate-stated
    text: In Nov. 2025 Hays Post coverage, Braun said Ellis County's ICE agreement
      applies to people already arrested and booked on local charges, that ICE has
      48 hours after local custody ends, and that the sheriff's office would not hold
      people beyond that window. He also said the office does not have the same 287(g)
      task-force authority as KBI and would not stop people in the street for immigration
      investigations.
    sourceIds:
    - mem-memory-candidates-scott-braun-raw-dump-v2-md-l106
    sourceUrl:
    sourceFile: memory/candidates/scott-braun/raw-dump-v2.md:106
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-scott-braun-00145
    classification: candidate-stated
    text: Braun's most consequential policy work in the current cycle is his push
      for a new jail and his explanation of the ICE memorandum. On jail space, he
      has argued the county is already stretched and that the new facility is not
      a luxury. On immigration enforcement, he said the county's holds are limited,
      tied to local custody, and not a license for street-level immigration policing.
      That distinction is important because it shows both a hardline public-safety
      posture and an effort to avoid overstating county authority.
    sourceIds:
    - mem-memory-candidates-scott-braun-raw-dump-md-l16
    sourceUrl:
    sourceFile: memory/candidates/scott-braun/raw-dump.md:16
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-scott-braun-00002
    classification: documented-record
    text: Scott Braun's public messaging is almost entirely the voice of an incumbent
      sheriff and law-enforcement administrator, not a conventional campaign brand.
      The clearest official source is the [Ellis County, Kansas sheriff page](https://ellisco.net/102/Sheriff),
      which describes patrol, jail, investigation, courthouse, and K-9 duties and
      links to office Facebook and X accounts. A separate apparent sheriff website,
      elliscountysheriff.com, is for Ellis County, Texas, and was excluded.
    sourceIds:
    - mem-memory-candidates-scott-braun-in-their-own-words-md-l3
    sourceUrl: https://ellisco.net/102/Sheriff
    sourceFile: memory/candidates/scott-braun/in-their-own-words.md:3
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-scott-braun-00008
    classification: documented-record
    text: Braun carried that issue into the Legislature. In [March 2026 coverage](https://hayspost.com/posts/69131eb8-04ac-4b1d-9561-e24c9309ad07)
      of his HB 2771 testimony, he framed ICE-detainer legislation as liability clarity,
      fiscal responsibility, county protection, and taxpayer protection. He said Ellis
      County signed the ICE agreement partly because of grant-funding risk, but also
      said community protection was the main reason for remaining in the program.
      The [public bill tracker](https://fastdemocracy.com/bill-search/ks/2025-2026/bills/KSB00012057/)
      lists Braun's February 25, 2026 testimony as an oral proponent item.
    sourceIds:
    - mem-memory-candidates-scott-braun-in-their-own-words-md-l15
    sourceUrl: https://hayspost.com/posts/69131eb8-04ac-4b1d-9561-e24c9309ad07
    sourceFile: memory/candidates/scott-braun/in-their-own-words.md:15
    confidence: likely
