- issueNumber: 11
  title: Public safety / law enforcement / criminal justice
  summary: 'Public safety / law enforcement / criminal justice: 36 selected evidence
    items from 420 mapped rows. Public URL-backed rows: 76.'
  evidenceItems:
  - evidenceRowId: em-scott-braun-00006
    classification: candidate-stated
    text: On drugs and forfeiture, Braun speaks as both sheriff and statewide sheriffs'
      association figure. In [January 2024](https://hayspost.com/posts/5e9ec24b-53c4-40ff-9c9d-36bfbdf8808a),
      he defended local retention of drug-forfeiture funds, saying seized money supports
      equipment and controlled buys and warning that losing it would shift costs to
      taxpayers. He also tied forfeiture to cutting off drug operations' funding.
      In [April 2025](https://hayspost.com/posts/f373c9f4-8c84-4f33-8102-f67d7ce2927a),
