  - evidenceRowId: em-scott-braun-00005
    classification: background-context
    text: Mental health is the second recurring operational issue. As Kansas Sheriffs'
      Association president, Braun told [Hays Post](https://hayspost.com/posts/5e9ec24b-53c4-40ff-9c9d-36bfbdf8808a)
      in January 2024 that sheriffs across Kansas were struggling with mental-health
      cases and questioned whether some people with serious mental illness should
      be in county jails at all. In [July 2025 budget coverage](https://hayspost.com/posts/fbac2993-56a7-4ebb-b494-5a194944d2c2),
      he supported High Plains Mental Health Center's crisis-intervention work as
      useful not just for the sheriff's office, but also Hays, Ellis, Victoria, and
      surrounding counties.
    sourceIds:
    - mem-memory-candidates-scott-braun-in-their-own-words-md-l9
    sourceUrl: https://hayspost.com/posts/5e9ec24b-53c4-40ff-9c9d-36bfbdf8808a
    sourceFile: memory/candidates/scott-braun/in-their-own-words.md:9
    confidence: likely
