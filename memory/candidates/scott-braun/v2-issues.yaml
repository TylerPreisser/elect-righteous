  - evidenceRowId: em-scott-braun-00003
    classification: faith-community-record
    text: 'Braun''s earliest profile-controlled campaign statement in the reviewed
      set came when he announced for sheriff in 2019. The [Hays Post archive](https://archive.hayspost.com/2019/10/31/undersheriff-braun-announces-run-for-ellis-county-sheriff-in-2020/)
      described his law-enforcement timeline from reserve deputy and Ellis police
      officer to deputy, drug-enforcement officer, K-9 handler, narcotics detective,
      and undersheriff. It also emphasized civic and faith ties: Hays Rotary, St.
      Nicholas of Myra Church Council, Knights of Columbus, First Call for Help, the
      Kansas Narcotics Officer Association, and the Ellis County Crisis Intervention
      Team Council. The campaign line was simple: "Dedication, Experience and Integrity."'
