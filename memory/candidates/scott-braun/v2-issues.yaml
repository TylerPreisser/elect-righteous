  - evidenceRowId: em-scott-braun-00112
    classification: candidate-stated
    text: In Nov. 2025 Hays Post coverage, Braun said Ellis County's ICE agreement
      applies to people already arrested and booked on local charges, that ICE has
      48 hours after local custody ends, and that the sheriff's office would not hold
      people beyond that window. He also said the office does not have the same 287(g)
      task-force authority as KBI and would not stop people in the street for immigration
      investigations.
    sourceIds:
