  - evidenceRowId: em-scott-braun-00004
    classification: candidate-stated
    text: 'The dominant theme since then is jail capacity. In [December 2023 coverage](https://hayspost.com/posts/bc5f6d5c-cc32-4e29-8666-c9d7f0edd70e),
      Braun argued that the 72-bed jail could not always function as a true 72-bed
      facility because of isolation needs, witness separation, inmate behavior, gender,
      offense levels, and COVID-era effects. In [July 2024](https://hayspost.com/posts/3f35aea3-a505-43de-a463-78d6976e129d),
      he said there was no quick fix and framed a new jail as a public-safety need
      rather than a personal wish: "We need a jail. I don''t want it. We need it."
      His jail argument repeatedly links capacity, taxpayer cost, officer transport
      time, liability, and mental-health placement.'
