  - evidenceRowId: em-scott-braun-00145
    classification: candidate-stated
    text: Braun's most consequential policy work in the current cycle is his push
      for a new jail and his explanation of the ICE memorandum. On jail space, he
      has argued the county is already stretched and that the new facility is not
      a luxury. On immigration enforcement, he said the county's holds are limited,
      tied to local custody, and not a license for street-level immigration policing.
      That distinction is important because it shows both a hardline public-safety
      posture and an effort to avoid overstating county authority.
    sourceIds:
    - mem-memory-candidates-scott-braun-raw-dump-md-l16
    sourceUrl:
