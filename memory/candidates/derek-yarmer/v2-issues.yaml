  - id: i-core-academics-school-scope
    title: "Core Academics, Special Education, And School Scope"
    summary: |
      Yarmer's accessible education-policy comments emphasize parental responsibility,
      leaner operations, student goal outcomes, and skepticism toward expansive
      social-emotional or mental-health framing in schools.
    stated:
      text: |
        His 2021 application framed education as a major parental responsibility and
        said his medical background could help keep students and staff safe while
        minimizing educational interruptions. In 2025 special-education coverage,
        Hays Post attributed to him comments questioning needs versus wants, saying
        the district could work leaner, and emphasizing core academics.
      sourceIds:
        - s-hayspost-yarmer-vacancy-2021
        - s-hayspost-sped-sel-2025
    actions:
      - id: a-feb20-2025-sped-efficiency-comments
        date: "2025-02-20"
        body: |
          During special-education and district-spending coverage, Hays Post reported
          Yarmer asking whether requested items were needs, questioning whether money
          was the core education problem, and asking about special-education goal
          progress.
        sourceIds:
          - s-hayspost-sped-sel-2025
      - id: a-feb20-2025-sel-comments
        date: "2025-02-20"
        body: |
