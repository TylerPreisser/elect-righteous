issues:
  - id: i-bond-capital-oversight
    title: "Bond and Capital Spending Oversight"
    summary: |
      Yarmer's clearest public lane is skepticism of bond execution, capital-outlay
      drift, and large purchases moving before he believes the board has enough
      information.
    stated:
      text: |
        As a 2023 candidate, Yarmer said he wanted Hays residents to receive the
        promised schools at the promised price and argued that the school board had
        ultimate responsibility to watch the $143.5 million bond budget. In a 2025
        written statement, he said capital-outlay funds were being used for items he
        believed should have been bond-covered and wrote that board oversight had
        failed.
      sourceIds:
        - s-hayspost-yarmer-qa-2023
        - s-hayspost-yarmer-bond-statement-2025
    actions:
      - id: a-mar24-2025-project-manager
        date: "2025-03-24"
        body: |
          Moved to look into hiring a project manager for the remaining bond work.
          Allen Park seconded. Official minutes show Yarmer, Park, and Curt Vajnar
          voting yes; Ken Brooks, Meagan Zampieri-Lillpopp, Jayme Goetz, and Ruth
          Ruder voting no; motion failed 3-4.
        sourceIds:
          - s-usd489-mar24-2025-minutes
          - s-hayspost-project-manager-2025
      - id: a-mar24-2025-athletics-and-equipment
        date: "2025-03-24"
        body: |
          Voted no on Hays High softball bleachers/press box, Hays Middle School
          athletic field bleachers, and Hays High weights/equipment, while voting yes
          on the Hays High Dell student-device purchase. This shows selective spending
          scrutiny rather than a blanket no-spending stance.
        sourceIds:
          - s-usd489-mar24-2025-minutes
      - id: a-sep22-2025-hhs-change-order
        date: "2025-09-22"
        body: |
          Voted no, with Allen Park, on Hays High PCCO 007 change orders for $88,347.
          The motion carried 5-2.
        sourceIds:
          - s-usd489-sep22-2025-minutes
      - id: a-oct13-2025-furniture-playground
        date: "2025-10-13"
        body: |
          Voted no, with Allen Park, on a $181,236.17 Hays Middle School furniture
          purchase and a $32,832 Lincoln Elementary playground-equipment removal,
          while voting yes on district staff desktop replacements.
        sourceIds:
          - s-usd489-oct13-2025-minutes
          - s-tigermedia-furniture-playground-2025
      - id: a-feb23-2026-felten-gmp
        date: "2026-02-23"
        body: |
          Voted no, with Allen Park, on the Felten Elementary GMP of $5,734,887.
          The motion carried 4-2.
        sourceIds:
          - s-usd489-feb23-2026-minutes
          - s-tigermedia-felten-gmp-2026
          - s-hayspost-felten-2026
    socialSignals:
      - id: ss-bond-no-candidate-social
        body: "No candidate-controlled social posts about bond spending were verified."
        sourceIds:
          - s-local-social-harvest
    gap:
      summary: |
        Strong evidence exists for spending/process skepticism, but no full alternative
        bond budget, capital-outlay plan, or project-management proposal document was
        found in candidate-controlled sources.
      evidenceIds:
