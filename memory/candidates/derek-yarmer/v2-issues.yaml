  - id: i-board-process-procurement-contracts
    title: "Board Process, Procurement, And Contracts"
    summary: |
      Yarmer repeatedly pushes for earlier information, less same-night voting, more
      precise contract language, and more review of administrator/director contracts.
    stated:
      text: |
        In the 2023 Q&A, Yarmer asked for board meetings to be broadcast, agendas
        released at least a week ahead, and easy board-member agenda additions. He
        said the board should oversee broad goals, spending, and what students are
        taught while not managing day-to-day district operations.
      sourceIds:
        - s-hayspost-yarmer-qa-2023
    actions:
      - id: a-jan22-2024-admin-contract-abstain
        date: "2024-01-22"
        body: |
          Abstained on the district-level administrator contract extension motion,
          which passed 5-1-1. Hays Post attributed the abstention to his objection
          that he was being asked to vote without enough information.
        sourceIds:
          - s-usd489-jan22-2024-agenda
          - s-hayspost-admin-contracts-2024
      - id: a-feb09-2026-hvac-table
        date: "2026-02-09"
        body: |
          Voted no on the Glassman HVAC update and moved to table the decision until
          more information could be provided. The no vote defeated the HVAC motion
          2-3, while his table motion failed 3-2.
        sourceIds:
          - s-usd489-feb09-2026-minutes
      - id: a-feb23-2026-hvac-rfp
        date: "2026-02-23"
        body: |
          Voted no on the annual Glassman HVAC update but seconded a narrower motion
          approving service through Dec. 31, 2026 with direction to bring back a
          districtwide preventive-maintenance RFP by November 2026. The narrower
          motion passed 5-0.
        sourceIds:
          - s-usd489-feb23-2026-minutes
          - s-hayspost-hvac-contracts-2026
      - id: a-feb23-2026-contract-delay
        date: "2026-02-23"
        body: |
          Seconded motions to postpone administrator contract extensions and moved to
          table district director contract extensions. One administrator-extension
          postponement motion ultimately carried 4-2; the director-extension table
          motion failed 3-3.
        sourceIds:
          - s-usd489-feb23-2026-minutes
          - s-hayspost-hvac-contracts-2026
      - id: a-mar09-2026-contract-language
        date: "2026-03-09"
        body: |
          Seconded tabling administrator/director contract language updates until a
          work session and later board meeting; motion carried 5-2.
        sourceIds:
          - s-usd489-mar09-2026-minutes
          - s-tigermedia-admin-contracts-2026
      - id: a-mar09-2026-contract-extensions
        date: "2026-03-09"
        body: |
          Voted no on district administrator contract extensions through 2027-28,
          which carried 5-2, but voted yes on district director contract extensions,
          which carried 7-0.
        sourceIds:
          - s-usd489-mar09-2026-minutes
          - s-tigermedia-admin-contracts-2026
    socialSignals:
      - id: ss-process-no-candidate-social
        body: "No candidate-controlled social posts about board process or contracts were verified."
