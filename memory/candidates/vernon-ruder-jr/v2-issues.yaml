    actions:
      - id: action-250-mv-fee
        date: "2023-11-20"
        type: "office_policy"
        description: "Hays Post reported Ruder implemented a $2.50 fee for walk-in customers for each title registration renewal transaction."
        outcome: "Fee became the most visible public change in treasurer-office operations."
        sourceIds:
          - s-hayspost-mv-fee-2023
      - id: action-fee-property-tax-framing
        date: "2023-11-20"
        type: "public_statement"
        description: "Ruder said the state allows facility fees to help fund motor-vehicle operations and that motor-vehicle work should be funded with motor-vehicle money."
        outcome: "Ruder framed the fee as service-user funding and property-tax burden management."
        sourceIds:
          - s-hayspost-mv-fee-2023
      - id: action-fee-budget-claim
        date: "2023-11-20"
        type: "reported_budget_claim"
        description: "Hays Post reported Ruder estimated the fee would probably generate more than $50,000 and said he reduced the treasury budget from $452,000 in 2022 to $367,000 in 2023."
        outcome: "Useful claimed outcome, but should be corroborated with county budget records before final UI treats it as independently verified."
        sourceIds:
          - s-hayspost-mv-fee-2023
    gap:
