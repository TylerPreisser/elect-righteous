issues:
  - id: i-life-abortion
    title: "Life / abortion"
    stated:
      text: |
        Marshall's campaign presents him as strongly pro-life and says his
        position is that abortion is wrong at any stage. The page ties that
        position to his OB-GYN background, delivery of more than 5,000 babies,
        and lifetime membership in the American Association of Pro-Life OB/GYNs.
      sourceIds:
        - s-campaign-life
        - s-senate-about
    actions:
      - id: a-born-alive-2025
        date: "2025-01-17"
        body: "Marshall introduced the Born-Alive Abortion Survivors Protection Act with Sen. James Lankford, according to his Senate office."
        sourceIds:
          - s-born-alive
      - id: a-unborn-child-support-2025
        date: "2025-01-25"
        body: "Marshall and Sen. Kevin Cramer reintroduced the Unborn Child Support Act, according to his Senate office."
        sourceIds:
          - s-unborn-child-support
    socialSignals: []

  - id: i-agriculture-food-rural-economy
    title: "Agriculture, food, and rural economy"
    stated:
      text: |
        Marshall's official record centers heavily on agriculture and rural
        Kansas. His Senate biography lists Agriculture Committee service and a
        subcommittee chairmanship. Recent official materials connect his work to
        school milk, fertilizer input costs, year-round E15, farmers, ranchers,
        and rural mental-health access.
      sourceIds:
        - s-senate-about
        - s-congress-s222
        - s-fertilizer-bill
        - s-cost-living-interview
    actions:
      - id: a-whole-milk-law-2026
        date: "2026-01-14"
        body: "S.222, the Whole Milk for Healthy Kids Act of 2025, introduced by Marshall, became Public Law 119-69."
        sourceIds:
          - s-congress-s222
          - s-whitehouse-s222
      - id: a-fertilizer-bill-2026
        date: "2026-04-28"
        body: "Marshall introduced the Lowering Input Costs for American Farmers Act to remove tariffs and countervailing duties on phosphate fertilizer imports from Morocco."
