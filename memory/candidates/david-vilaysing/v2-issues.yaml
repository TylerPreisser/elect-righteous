issues:
  - id: i-water-r9-long-term-supply
    title: "Water security and the R9 long-term supply"
    stated:
      text: |
        Vilaysing's public water position is direct: in the 2025 candidate Q&A,
        he named water and housing as the city's most pressing issues, called
        for a secure source of water, and said R9 was a great start but not the
        permanent answer by itself. He also asked for clearer public visibility
        into R9 progress. City records independently show R9 as an official
        long-term water-security project for Hays.
      sourceIds:
        - s-hayspost-qa
        - s-hays-r9-ranch
        - s-hays-r9-property
    actions:
      - id: a-r9-forum-game-plan-2025-10-08
        date: "2025-10-08"
        body: |
          At the city commission forum, Vilaysing said that if elected he would
          meet with all parties involved in R9, figure out the current status,
          and develop a game plan to push forward within four years. This is a
          candidate commitment, not an official vote.
        sourceIds:
          - s-hayspost-forum
      - id: a-washington-briefing-trip-2026-04-23
        date: "2026-04-23"
        body: |
          April 23 minutes, embedded in the May 14 city packet, state that
          Vilaysing joined Mayor Mason Ruder and city staff in Washington, DC,
          for a Western Kansas Congressional Staff Briefing and Reception to
          update Kansas federal offices on Hays priorities. The minutes do not
          name R9 in that sentence, so this is recorded as city-priority
          advocacy context rather than a Vilaysing-specific R9 vote.
        sourceIds:
          - s-hays-agenda-05142026
    socialSignals:
      - id: ss-water-no-campaign-feed
        platform: "Public web / social search"
        observation: "No verified campaign social feed was found for water/R9 messaging; the strongest evidence is candidate-attributed Q&A/forum material plus official city R9 pages."
        observedAt: "2026-05-19"
        sourceIds:
          - s-hayspost-qa
          - s-hayspost-forum
        mappedToIssueId: i-water-r9-long-term-supply
    gap:
      summary: |
        No Vilaysing-specific R9 roll-call vote was found after he took office.
        The available record shows a strong stated position and city-priority
        advocacy context, but not yet a completed R9 action unique to him.
      sourceIds:
        - s-hays-agenda-center
        - s-hays-agenda-05142026

  - id: i-housing-workforce-development
    title: "Housing, workforce growth, and development incentives"
    stated:
      text: |
        Vilaysing ties housing to working residents and future workforce
        retention. He has said low- and medium-income residents struggle to
        afford homes, supported looking at city land or discounted land for
        qualifying housing if available, suggested RHID conditions that would
        require qualifying homes, and proposed connecting the city, employers,
        Hays High, and Fort Hays State through a workforce council.
      sourceIds:
        - s-hayspost-qa
        - s-hayspost-forum
        - s-tigermedia-forum
    actions:
      - id: a-lihtc-fee-waiver-support-2026-04-23
        date: "2026-04-23"
        body: |
          Voted aye on the April 23 consent agenda that included letters of
          support to waive development fees for eligible 2026 Low-Income Housing
          Tax Credit projects.
        sourceIds:
          - s-hays-agenda-05142026
      - id: a-pioneer-run-irb-intent-2026-04-23
        date: "2026-04-23"
        body: |
          Voted aye on Resolution No. 2026-005, an intent to issue Industrial
          Revenue Bonds for Overland Property Group's Pioneer Run affordable
          multifamily project. The packet says the IRB would enable a sales-tax
          exemption and provide LIHTC application points; no property-tax
          abatement was requested.
        sourceIds:
          - s-hays-agenda-05142026
      - id: a-exit157-tif-cid-2026-04-09
        date: "2026-04-09"
        body: |
          Voted aye on Ordinance No. 4097 adopting the Exit 157 24-7 TIF
          project plan and development agreement, and on Ordinance No. 4098
          creating the related CID with a 2.0 percent CID sales tax. During the
          discussion he asked whether the TIF had an incentive matrix like other
          incentives and asked for transparency to customers about the special
          tax districts.
        sourceIds:
          - s-hays-agenda-04232026
      - id: a-willow-wheatland-irb-secondary-2026-05-14
        date: "2026-05-14"
        body: |
          Tiger Media reported that the commission unanimously approved IRB
          intent resolutions for Willow Grove and Wheatland Commons, two
          affordable-housing projects seeking Low-Income Housing Tax Credits.
          Because official May 14 minutes were not yet published in this pass,
          this item is secondary-source action evidence.
        sourceIds:
          - s-hays-agenda-05142026
          - s-tigermedia-affordable-housing-2026
    socialSignals:
      - id: ss-goodparty-unclaimed-housing
        platform: "GoodParty.org"
        observation: "GoodParty lists Vilaysing as a nonpartisan Hays City Commission candidate, but the page is explicitly unclaimed; do not treat pledge language as candidate-controlled housing or funding evidence."
        observedAt: "2026-05-19"
        sourceIds:
          - s-goodparty-unclaimed
        mappedToIssueId: i-housing-workforce-development

  - id: i-budget-taxes-operations
    title: "Budget, taxes, transparency, and city operations"
    stated:
      text: |
        Vilaysing's budget language is cost-discipline and operations-oriented.
        Before taking office he opposed a mill levy increase, asked the city to
        stay revenue neutral if possible, and said residents were heavily taxed
        and burdened. His governing comments continue the same pattern: talk to
        frontline workers, find what the city does not need to do, maintain what
        the city already owns, and review whether existing ordinances still make
        operational sense.
      sourceIds:
        - s-hayspost-qa
        - s-tigermedia-budget-2025
        - s-hayspost-budget-prep
        - s-hayspost-chickfila-worksession
    actions:
      - id: a-pet-tag-review-request-2026-02-12
        date: "2026-02-12"
        body: |
          Asked for the Pet Tag Ordinance to be discussed at a future work
          session. Hays Post reported that he connected the review to a small
          fee stream, existing owner tags/microchips, and time spent by the
          city clerk, police, and dispatch.
        sourceIds:
          - s-hays-agenda-02262026
          - s-hayspost-pet-tags
      - id: a-frontline-budget-input-2026-04-06
        date: "2026-04-06"
        body: |
          During 2027 budget preparation, challenged department heads to ask
          frontline staff for budget input because those workers know what the
