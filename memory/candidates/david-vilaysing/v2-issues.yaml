  - evidenceRowId: em-david-vilaysing-00004
    classification: documented-record
    text: 'His preferred governing style is bottom-up and operational. In the candidate
      Q&A, he said the city should talk to "the people actually doing the jobs" before
      deciding what is needed or not needed. After taking office, he repeated that
      approach during 2026 budget discussions, challenging department heads to ask
      frontline staff what the city can stop doing, according to [Hays Post](https://hayspost.com/posts/87cea43b-4017-4065-a707-e19a1389beeb).
      His February 2026 request to review pet licensing fits the same pattern: small
      fee, staff time, police time, dispatch time, and whether an existing ordinance
      still makes sense when owners use tags and microchips.'
    sourceIds:
    - mem-memory-candidates-david-vilaysing-in-their-own-words-md-l7
    sourceUrl: https://hayspost.com/posts/87cea43b-4017-4065-a707-e19a1389beeb
    sourceFile: memory/candidates/david-vilaysing/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-david-vilaysing-00006
    classification: documented-record
    text: That conflict-management language also shows up in politics. At the October
      2025 candidate forum, [Tiger Media Network](https://tigermedianet.com/?p=90544)
      quoted him saying commissioners have to lead by example when conflict arises,
      or they have no business sitting in those seats. He proposed workforce collaboration
      among the city, local businesses, Hays High, and Fort Hays State University,
      and his early swearing-in comments praised department leaders, educators, health
      care professionals, civic groups, and the chamber as part of the city's backbone.
    sourceIds:
    - mem-memory-candidates-david-vilaysing-in-their-own-words-md-l11
    sourceUrl: https://tigermedianet.com/?p=90544
    sourceFile: memory/candidates/david-vilaysing/in-their-own-words.md:11
    confidence: likely
