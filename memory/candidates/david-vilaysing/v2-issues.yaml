  - evidenceRowId: em-david-vilaysing-00860
    classification: documented-record
    text: Vilaysing is the wild card on the commission. A 19-year police veteran with
      military police background, he's the only commissioner with law enforcement
      experience. His DXI Training business shows he's focused on de-escalation and
      communication -- not the stereotypical "tough cop" persona. The Alzheimer's
      fundraiser and BYOB self-defense classes show community engagement. His Laotian
      surname suggests an interesting personal story (likely refugee family background
      given the Laotian community in Kansas), though no details were found in public
      records. His pet licensing initiative is a small but telling first move -- he's
      looking to cut bureaucratic friction. He replaced the most progressive commissioner
      (Barrick, the No Kings protester), which shifts the commission's ideological
      center.
    sourceIds:
    - mem-memory-candidates-david-vilaysing-raw-dump-md-l1228
