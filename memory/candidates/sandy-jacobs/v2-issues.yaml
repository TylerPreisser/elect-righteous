    useDecision: use
  - evidenceRowId: em-sandy-jacobs-00004
    classification: documented-record
    text: Water is the clearest policy through-line. Jacobs repeatedly treats it as
      a generational duty rather than a short-term campaign issue. In the [Oct. 22,
      2025 Hays Post Q&A](https://hayspost.com/posts/c0016433-275d-4af3-aabe-af7379f8c56f),
      she said R9 is among the unfinished projects she wants to see through, defended
      the city's legal posture, and said Hays has asked for less water than state
      rules allow. At a July 2025 statewide water task force event, she said Hays
      understands how vital water is to "our communities, our economy and our future,"
      and pointed to Hays' reduced use, rebate programs, conservation staffing, and
      youth education efforts ([Lawrence Times/Kansas Reflector](https://lawrencekstimes.com/2025/07/15/ksleg-water-crisis-solutions/)).
    sourceIds:
    - mem-memory-candidates-sandy-jacobs-in-their-own-words-md-l7
    sourceUrl: https://hayspost.com/posts/c0016433-275d-4af3-aabe-af7379f8c56f
    sourceFile: memory/candidates/sandy-jacobs/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-sandy-jacobs-00005
    classification: documented-record
    text: Her economic-development message is practical and city-budget centered.
      Jacobs talks about retail not as culture-war identity or partisan branding,
      but as a sales-tax base and quality-of-life issue. In the 2025 Q&A, she said
      her first goal beyond maintaining taxes would be retail development and that
      Grow Hays was focused on it because the general fund depends on sales tax. After
      winning re-election, she told Hays Post, "Retail is really high on my list,
      and the workforce needs some attention" ([Hays Post](https://hayspost.com/posts/b7a4b7ea-3e19-4919-a7fa-1de6db7bed8c)).
      Her older public record also points to Vine Street reconstruction, roundabouts,
      and business development along that corridor ([Hays Post](https://hayspost.com/posts/64dd8115-641e-489a-970e-22ef124e2781)).
    sourceIds:
    - mem-memory-candidates-sandy-jacobs-in-their-own-words-md-l9
    sourceUrl: https://hayspost.com/posts/b7a4b7ea-3e19-4919-a7fa-1de6db7bed8c
    sourceFile: memory/candidates/sandy-jacobs/in-their-own-words.md:9
    confidence: likely
    useDecision: use
  - evidenceRowId: em-sandy-jacobs-00007
    classification: documented-record
    text: 'Housing, parks, and quality of life fill out the local frame. Jacobs credits
      the commission''s prior four-year focus on housing, including economic-development
      policy changes and moderate-income housing tools. She also says low-income housing
      is difficult without incentives and may require mill-levy decisions the community
      may not be ready to make. On parks, she points to the ARC Park as a model but
      says broader park investment may require hard cost discussions. Her older campaign
      and foundation language uses the same frame: leave Hays better than she found
      it, pursue sustainable planned growth, protect quality of life, and keep looking
      10, 25, and 50 years ahead ([Hays Post](https://hayspost.com/posts/c0016433-275d-4af3-aabe-af7379f8c56f)).'
    sourceIds:
