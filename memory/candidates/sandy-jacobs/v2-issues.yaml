  - id: i-budget-taxes-services
    title: "City budget, taxes, and service tradeoffs"
    stated:
      text: |
        Jacobs' budget language emphasizes revenue neutrality, conservative
        budgeting, and tradeoffs. She said the city should first try to remain
        revenue neutral and avoid unsustainable budgeting. Official minutes show
        the city found a path to a 24.382-mill revenue-neutral 2026 budget that
        would not affect operations or capital projects, and Jacobs voted aye.
      sourceIds:
        - s-hayspost-qa-2025
        - s-hays-agenda-09252025
        - s-hayspost-budget-prep-2026
    actions:
      - id: a-2026-city-budget-revenue-neutral-2025-09-11
        date: "2025-09-11"
        body: |
          As mayor, Jacobs voted aye on the 2026 City of Hays budget action after
          city staff identified a path to remain revenue neutral at 24.382 mills.
          The minutes say maintaining revenue neutral would not affect city
          operations or capital projects.
        sourceIds:
          - s-hays-agenda-09252025
      - id: a-budget-tradeoff-statement-2026-04-06
        date: "2026-04-06"
        body: |
          In budget-prep coverage, Jacobs asked where money would come from and
          what residents would be willing to give up under budget constraints.
          This is a public tradeoff statement, not a completed tax vote.
        sourceIds:
          - s-hayspost-budget-prep-2026
      - id: a-nuisance-abatement-votes-2025-09-11
        date: "2025-09-11"
        body: |
          Jacobs voted aye on nuisance-abatement resolutions at the same meeting
          as the 2026 budget hearings, including actions tied to nuisance items
          and an inoperable vehicle. These are routine city operations actions,
          not broad code-enforcement ideology by themselves.
        sourceIds:
          - s-hays-agenda-09252025
