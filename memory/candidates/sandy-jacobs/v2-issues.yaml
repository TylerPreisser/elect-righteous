issues:
  - id: i-water-r9
    title: "Water security and the R9 Ranch project"
    stated:
      text: |
        Jacobs' clearest long-term issue is Hays' water supply and the R9 Ranch
        project. In her 2025 candidate Q&A, she said R9 was unfinished work she
        wanted to help finish and said Hays had asked for less water than state
        rules allowed. The City of Hays official R9 page anchors the project as
        a long-term sustainable water-supply investment, but issue language
        should distinguish city institutional claims from Jacobs' direct quotes.
      sourceIds:
        - s-hayspost-qa-2025
        - s-hays-r9-ranch
    actions:
      - id: a-r9-public-priority-2025-10-22
        date: "2025-10-22"
        body: |
          In the Hays Post candidate Q&A, Jacobs named R9 among the projects she
          wanted to stay around to finish and defended the city's posture by
          saying Hays had asked for less water than state rules allowed. This is
          a candidate-attributed statement rather than a roll-call vote.
        sourceIds:
          - s-hayspost-qa-2025
      - id: a-mayor-transition-r9-summary-2026-01-08
        date: "2026-01-08"
        body: |
          During the January 2026 governing-body transition, Hays Post reported
          Jacobs saying the commission had made major strides on R9, housing,
          economic growth, a police facility commitment, parks, and the airport.
          Official minutes anchor the meeting and reorganization.
        sourceIds:
          - s-hays-minutes-01082026
          - s-hayspost-reorg-2026
