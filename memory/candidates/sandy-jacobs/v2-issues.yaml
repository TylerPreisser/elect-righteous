  - id: i-economic-development-retail
    title: "Retail growth and economic development"
    stated:
      text: |
        Jacobs repeatedly frames retail development as important to Hays' tax
        base and quality of life. Her visible 2026 record includes support for
        the I-70 travel-plaza concept, tying Vine Street roundabouts to retail
        development access, and seconding the Chick-fil-A IRB resolution. The
        record should note support without overstating every incentive as a
        Jacobs-authored policy.
      sourceIds:
        - s-hayspost-qa-2025
        - s-hayspost-election-2025-issues
        - s-hays-minutes-02192026
        - s-hayspost-travel-plaza
        - s-hayspost-chickfila-worksession
        - s-hays-minutes-03262026
    actions:
      - id: a-travel-plaza-work-session-support-2026-02-19
        date: "2026-02-19"
        body: |
          Jacobs was present for the work session discussing the Exit 157 24-7
          Travel Plaza TIF, CID, and IRB request. Hays Post quoted her calling
          it an exciting project and saying she was ready to see what it did to
          the interchange. Do not list Jacobs as voting on the final April 9
          TIF/CID ordinances; city minutes list her absent for that meeting.
        sourceIds:
          - s-hays-minutes-02192026
          - s-hayspost-travel-plaza
          - s-hays-agenda-04232026
      - id: a-chickfila-irb-2026-03-26
        date: "2026-03-26"
        body: |
          Jacobs seconded and voted aye on Resolution 2026-004 evidencing intent
          to issue Industrial Revenue Bonds for the Chick-fil-A project. The
          minutes say the developer sought a construction sales-tax exemption and
          did not request property-tax abatement.
        sourceIds:
          - s-hays-minutes-03262026
          - s-hayspost-chickfila-worksession
      - id: a-roundabouts-retail-access-2026-03-21
        date: "2026-03-21"
        body: |
          In Chick-fil-A work-session coverage, Jacobs said the city's Vine
          Street roundabouts were installed for development like this, allowing
          people to get in and out without stop signs or red lights. This is a
          public infrastructure/economic-development statement rather than a
          separate vote.
        sourceIds:
          - s-hayspost-chickfila-worksession
    socialSignals: []
    gap:
      summary: |
        Final April 9, 2026 travel-plaza TIF/CID votes should not be attributed
        to Jacobs because city minutes in the April 23 packet list her absent.
      sourceIds:
        - s-hays-agenda-04232026

  - id: i-infrastructure-codes-operations
    title: "Infrastructure maintenance, codes, and city operations"
    stated:
      text: |
        Jacobs' operational record includes routine but concrete votes on sewer
        maintenance, water-reclamation equipment, fire/property/electrical codes,
        property maintenance, and street design. These fit her public emphasis on
        maintaining city assets and planning for long-term quality of life.
      sourceIds:
        - s-hays-minutes-03262026
        - s-hays-agenda-05142026
        - s-hayspost-low-income-housing-05182026
        - s-hayspost-2021-profile
    actions:
      - id: a-sewer-cleaning-contract-2026-03-26
        date: "2026-03-26"
        body: |
          Jacobs voted aye to authorize sanitary sewer cleaning and video
          inspection of 118,198.53 linear feet at a price of $133,028.65, with
          additional authority up to $150,000 for heavier cleaning, tap intrusion
          and root removal, and patching as needed.
        sourceIds:
          - s-hays-minutes-03262026
      - id: a-centrifuge-maintenance-2026-03-26
        date: "2026-03-26"
        body: |
          Jacobs moved to authorize a Water Reclamation and Reuse Facility
          centrifuge maintenance contract at $48,572.28.
        sourceIds:
          - s-hays-minutes-03262026
      - id: a-code-adoptions-2026-03-26
        date: "2026-03-26"
        body: |
          Jacobs seconded adoption of the 2024 International Fire Code, moved
          adoption of the 2024 International Property Maintenance Code, and
          seconded adoption of the 2023 National Electrical Code, each with local
          amendments and unanimous aye votes recorded.
        sourceIds:
          - s-hays-minutes-03262026
      - id: a-street-design-contract-2026-05-14
        date: "2026-05-14"
        body: |
          Hays Post reported commissioners approved a $94,400 design contract
          with Driggs Design Group for reconstruction design work on portions of
          22nd Street, General Hays Road, and Oak Street. The May 14 agenda
          packet anchors the contract item; approved minutes were not yet visible.
        sourceIds:
          - s-hays-agenda-05142026
          - s-hayspost-low-income-housing-05182026
    socialSignals: []

  - id: i-civic-style-public-presence
    title: "Civic style and public presence"
    stated:
      text: |
        Jacobs' public style is collaborative and institution-focused. She
        describes leadership as listening, bringing people together, and keeping
        the community at the center of decisions. Her online footprint is thin:
        a Facebook page and LinkedIn preview exist, but no reliable public
        post-level feed was available, and GoodParty's profile is unclaimed.
