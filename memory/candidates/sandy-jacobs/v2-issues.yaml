  - id: i-housing-affordability-incentives
    title: "Housing, affordability, and development incentives"
    stated:
      text: |
        Jacobs identifies housing as one of the commission's most impactful
        areas of work, including changes to economic-development policy,
        incentive districts, and moderate-income housing. In 2026, the record
        shows support for Low-Income Housing Tax Credit-adjacent fee waivers and
        IRB sales-tax exemptions intended to help affordable-housing projects
        compete for state tax credits.
      sourceIds:
        - s-hayspost-qa-2025
        - s-hays-agenda-04232026
        - s-tigermedia-pioneer-run
        - s-hays-agenda-05142026
        - s-hayspost-low-income-housing-05182026
    actions:
      - id: a-pioneer-run-irb-2026-04-23
        date: "2026-04-23"
        body: |
          Tiger Media reported the commission approved a 5-0 IRB resolution for
          Overland Property Group's Pioneer Run affordable-housing project, with
          an estimated $147,962.50 construction sales-tax exemption benefit.
          Jacobs said low-income housing is difficult to make financially
          feasible without LIHTC assistance. The city agenda packet anchors the
          fee-waiver and Resolution 2026-005 context.
        sourceIds:
          - s-hays-agenda-04232026
          - s-tigermedia-pioneer-run
      - id: a-lihtc-fee-waiver-support-2026-04-23
        date: "2026-04-23"
        body: |
          The April 23 agenda packet included letters supporting fee waivers for
          eligible LIHTC projects, including a Pioneer Run letter citing a city
          housing study that identified 189 low-income units needed by 2030 and
          committing to waive the lesser of $80,000 or all combined impact,
          utility, and other fees if tax credits were awarded.
        sourceIds:
          - s-hays-agenda-04232026
      - id: a-willow-wheatland-irb-2026-05-14
        date: "2026-05-14"
        body: |
          Hays Post reported commissioners unanimously agreed to two more IRB
          resolutions for low-income housing projects: Willow Grove and
          Wheatland Commons. The May 14 agenda packet listed Resolution 2026-006
          for Willow Grove and Resolution 2026-007 for Wheatland Commons.
          Approved minutes were not visible in this pass, so use this as
          agenda-plus-secondary evidence until city minutes post.
        sourceIds:
          - s-hays-agenda-05142026
          - s-hayspost-low-income-housing-05182026
    socialSignals:
      - id: ss-housing-no-post-feed
        platform: "Facebook / GoodParty"
        observation: "GoodParty links a Facebook page but the profile is unclaimed and Facebook did not expose a usable public post feed; housing issue evidence is from official agenda records and local reporting."
        observedAt: "2026-05-19"
        sourceIds:
          - s-goodparty-jacobs
          - s-facebook-local-harvest
        mappedToIssueId: i-housing-affordability-incentives
    gap:
      summary: |
        May 14, 2026 approved minutes were not available during this pass. The
        May 14 housing action should be upgraded to primary vote evidence once
        minutes are posted.
      sourceIds:
        - s-hays-agenda-05142026
        - s-hayspost-low-income-housing-05182026

  - id: i-economic-development-retail
    title: "Retail growth and economic development"
    stated:
      text: |
        Jacobs repeatedly frames retail development as important to Hays' tax
        base and quality of life. Her visible 2026 record includes support for
        the I-70 travel-plaza concept, tying Vine Street roundabouts to retail
        development access, and seconding the Chick-fil-A IRB resolution. The
        record should note support without overstating every incentive as a
        Jacobs-authored policy.
      sourceIds:
        - s-hayspost-qa-2025
        - s-hayspost-election-2025-issues
        - s-hays-minutes-02192026
        - s-hayspost-travel-plaza
        - s-hayspost-chickfila-worksession
        - s-hays-minutes-03262026
    actions:
      - id: a-travel-plaza-work-session-support-2026-02-19
        date: "2026-02-19"
        body: |
          Jacobs was present for the work session discussing the Exit 157 24-7
          Travel Plaza TIF, CID, and IRB request. Hays Post quoted her calling
          it an exciting project and saying she was ready to see what it did to
          the interchange. Do not list Jacobs as voting on the final April 9
          TIF/CID ordinances; city minutes list her absent for that meeting.
        sourceIds:
          - s-hays-minutes-02192026
          - s-hayspost-travel-plaza
          - s-hays-agenda-04232026
      - id: a-chickfila-irb-2026-03-26
        date: "2026-03-26"
        body: |
          Jacobs seconded and voted aye on Resolution 2026-004 evidencing intent
          to issue Industrial Revenue Bonds for the Chick-fil-A project. The
          minutes say the developer sought a construction sales-tax exemption and
          did not request property-tax abatement.
        sourceIds:
          - s-hays-minutes-03262026
          - s-hayspost-chickfila-worksession
      - id: a-roundabouts-retail-access-2026-03-21
        date: "2026-03-21"
        body: |
          In Chick-fil-A work-session coverage, Jacobs said the city's Vine
          Street roundabouts were installed for development like this, allowing
          people to get in and out without stop signs or red lights. This is a
          public infrastructure/economic-development statement rather than a
          separate vote.
        sourceIds:
          - s-hayspost-chickfila-worksession
    socialSignals: []
    gap:
      summary: |
        Final April 9, 2026 travel-plaza TIF/CID votes should not be attributed
        to Jacobs because city minutes in the April 23 packet list her absent.
      sourceIds:
        - s-hays-agenda-04232026

  - id: i-infrastructure-codes-operations
    title: "Infrastructure maintenance, codes, and city operations"
    stated:
      text: |
        Jacobs' operational record includes routine but concrete votes on sewer
        maintenance, water-reclamation equipment, fire/property/electrical codes,
        property maintenance, and street design. These fit her public emphasis on
        maintaining city assets and planning for long-term quality of life.
      sourceIds:
        - s-hays-minutes-03262026
        - s-hays-agenda-05142026
        - s-hayspost-low-income-housing-05182026
        - s-hayspost-2021-profile
    actions:
      - id: a-sewer-cleaning-contract-2026-03-26
        date: "2026-03-26"
        body: |
          Jacobs voted aye to authorize sanitary sewer cleaning and video
          inspection of 118,198.53 linear feet at a price of $133,028.65, with
          additional authority up to $150,000 for heavier cleaning, tap intrusion
          and root removal, and patching as needed.
        sourceIds:
          - s-hays-minutes-03262026
      - id: a-centrifuge-maintenance-2026-03-26
        date: "2026-03-26"
        body: |
          Jacobs moved to authorize a Water Reclamation and Reuse Facility
          centrifuge maintenance contract at $48,572.28.
        sourceIds:
          - s-hays-minutes-03262026
      - id: a-code-adoptions-2026-03-26
        date: "2026-03-26"
        body: |
          Jacobs seconded adoption of the 2024 International Fire Code, moved
          adoption of the 2024 International Property Maintenance Code, and
          seconded adoption of the 2023 National Electrical Code, each with local
          amendments and unanimous aye votes recorded.
        sourceIds:
          - s-hays-minutes-03262026
      - id: a-street-design-contract-2026-05-14
        date: "2026-05-14"
        body: |
          Hays Post reported commissioners approved a $94,400 design contract
          with Driggs Design Group for reconstruction design work on portions of
          22nd Street, General Hays Road, and Oak Street. The May 14 agenda
          packet anchors the contract item; approved minutes were not yet visible.
        sourceIds:
          - s-hays-agenda-05142026
          - s-hayspost-low-income-housing-05182026
    socialSignals: []

  - id: i-civic-style-public-presence
    title: "Civic style and public presence"
    stated:
      text: |
        Jacobs' public style is collaborative and institution-focused. She
        describes leadership as listening, bringing people together, and keeping
        the community at the center of decisions. Her online footprint is thin:
        a Facebook page and LinkedIn preview exist, but no reliable public
        post-level feed was available, and GoodParty's profile is unclaimed.
      sourceIds:
        - s-hayspost-qa-2025
        - s-hayspost-reorg-2026
        - s-tigermedia-reorg-2026
        - s-goodparty-jacobs
        - s-facebook-local-harvest
        - s-linkedin-local-harvest
    actions:
      - id: a-sworn-in-commissioner-2026-01-08
        date: "2026-01-08"
        body: |
          Official minutes show Jacobs was sworn in again as commissioner after
          the 2025 election, voted aye for Mason Ruder as mayor and Alaina
          Cunningham as vice mayor, and moved approval of the commission rules
          consent agenda.
        sourceIds:
          - s-hays-minutes-01082026
      - id: a-reelected-2025-four-year-term
        date: "2025-11-04"
        body: |
          Jacobs was re-elected to the Hays City Commission in 2025. Hays Post
          reported Jacobs and Shaun Musil would receive four-year terms; the
          official Ellis County results PDF is the primary result path, though it
          is image-based and local text extraction was blank.
        sourceIds:
          - s-ellis-election-results
          - s-ellis-2025-official-results
          - s-hayspost-election-2025-story
    socialSignals:
      - id: ss-facebook-page-presence
        platform: "Facebook"
        observation: "Prior logged-out harvest found a Sandy Jacobs - Hays City Commission page with 257 visible likes, but no usable post feed, post dates, reactions, comments, shares, follows, or issue-bearing content."
        observedAt: "2026-05-11"
        sourceIds:
          - s-facebook-local-harvest
        mappedToIssueId: i-civic-style-public-presence
      - id: ss-linkedin-preview
        platform: "LinkedIn"
        observation: "Prior public preview showed a likely Sandy Jacobs profile in Hays with City of Hays experience and 246 followers/244 connections; full profile and activity were not accessible and liked content was not treated as campaign messaging."
        observedAt: "2026-05-11"
        sourceIds:
          - s-linkedin-local-harvest
        mappedToIssueId: i-civic-style-public-presence
      - id: ss-goodparty-unclaimed
        platform: "GoodParty"
        observation: "GoodParty marks the profile unclaimed and shows no candidate-filled occupation or top issues; platform pledge text should not be attributed to Jacobs."
        observedAt: "2026-05-19"
        sourceIds:
          - s-goodparty-jacobs
        mappedToIssueId: i-civic-style-public-presence

  - id: i-covid-era-public-health
    title: "COVID-era public health ordinance"
    stated:
      text: |
        The COVID-era mask evidence should be kept narrow. Hays Post reported
        that Jacobs voted yes on the October 2020 Hays mask-ordinance extension.
        This supports a specific local ordinance vote, not a broader inference
        about later health mandates, vaccines, state/federal policy, or private
        health beliefs.
      sourceIds:
        - s-hayspost-mask-oct-2020
    actions:
      - id: a-mask-extension-yes-2020-10-02
        date: "2020-10-02"
        body: |
          Hays Post reported the October 2020 mask-ordinance extension passed
          3-1, with Jacobs, Shaun Musil, and Michael Berges voting yes, Mason
          Ruder voting no, and Lance Mellick absent.
        sourceIds:
          - s-hayspost-mask-oct-2020
    socialSignals: []
    gap:
      summary: |
        Underlying 2020 city minutes were not pulled in this pass. The vote is
        supported by Hays Post secondary coverage and should be upgraded if a
        primary minute record is later attached.
      sourceIds:
        - s-hayspost-mask-oct-2020

