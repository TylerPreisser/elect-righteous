- issueNumber: 5
  title: Taxes / spending / debt
  summary: 'Taxes / spending / debt: 34 selected evidence items from 139 mapped rows.
    Public URL-backed rows: 14.'
  evidenceItems:
  - evidenceRowId: em-sandy-jacobs-00006
    classification: candidate-stated
    text: Fiscal responsibility is another recurring signal. Jacobs emphasizes revenue-neutral
      budgeting, line-item review, maintaining the mill levy, and asking residents
      what they are willing to trade off. In the 2025 Q&A, she said Hays was not overtaxing
      from her perspective and praised a conservative budget that remained revenue
      neutral. In April 2026 budget coverage, she questioned where money would come
      from under proposed property-tax constraints, then said budget mindfulness was
      "everybody's job" and encouraged residents and businesses to interact with city
      officials because "We can't think of everything" ([Hays Post](https://hayspost.com/posts/87cea43b-4017-4065-a707-e19a1389beeb)).
    sourceIds:
    - mem-memory-candidates-sandy-jacobs-in-their-own-words-md-l11
    sourceUrl: https://hayspost.com/posts/87cea43b-4017-4065-a707-e19a1389beeb
    sourceFile: memory/candidates/sandy-jacobs/in-their-own-words.md:11
    confidence: likely
    useDecision: use
  - evidenceRowId: em-sandy-jacobs-00146
    classification: candidate-stated
    text: She said the first goal is to remain revenue neutral and noted the city
      had kept the mill levy at 25 mills for 16 years.
    sourceIds:
    - mem-memory-candidates-sandy-jacobs-raw-dump-v2-md-l225
    sourceUrl:
    sourceFile: memory/candidates/sandy-jacobs/raw-dump-v2.md:225
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-sandy-jacobs-00817
    classification: candidate-stated
    text: 'Fiscal restraint: During 2026 budget discussions, said: "You (staff) brought
      us a constrained budget which is what we asked for."'
    sourceIds:
    - mem-memory-candidates-sandy-jacobs-raw-dump-md-l1030
    sourceUrl:
    sourceFile: memory/candidates/sandy-jacobs/raw-dump.md:1030
    confidence: unknown
    useDecision: background-only
