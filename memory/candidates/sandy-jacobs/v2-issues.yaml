  - evidenceRowId: em-sandy-jacobs-00004
    classification: documented-record
    text: Water is the clearest policy through-line. Jacobs repeatedly treats it as
      a generational duty rather than a short-term campaign issue. In the [Oct. 22,
      2025 Hays Post Q&A](https://hayspost.com/posts/c0016433-275d-4af3-aabe-af7379f8c56f),
      she said R9 is among the unfinished projects she wants to see through, defended
      the city's legal posture, and said Hays has asked for less water than state
      rules allow. At a July 2025 statewide water task force event, she said Hays
      understands how vital water is to "our communities, our economy and our future,"
      and pointed to Hays' reduced use, rebate programs, conservation staffing, and
      youth education efforts ([Lawrence Times/Kansas Reflector](https://lawrencekstimes.com/2025/07/15/ksleg-water-crisis-solutions/)).
