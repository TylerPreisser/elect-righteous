  - evidenceRowId: em-sandy-jacobs-00910
    classification: documented-record
    text: Jacobs is the elder statesperson of the commission. At 75, she's a retired
      banker and nonprofit executive who has served three stints as mayor. Her Vine
      Street roundabout campaign is her most tangible infrastructure legacy -- and
      she's not shy about citing the economic impact data. Her retail development
      focus aligns with a business-oriented worldview shaped by decades in banking
      and economic development. She voted with the mask mandate majority. Her re-election
      in November 2025 to another four-year term (through 2029, when she'd be 79)
      shows she isn't slowing down.
