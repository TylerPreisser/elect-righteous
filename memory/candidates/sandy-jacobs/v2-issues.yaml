  - evidenceRowId: em-sandy-jacobs-00005
    classification: documented-record
    text: Her economic-development message is practical and city-budget centered.
      Jacobs talks about retail not as culture-war identity or partisan branding,
      but as a sales-tax base and quality-of-life issue. In the 2025 Q&A, she said
      her first goal beyond maintaining taxes would be retail development and that
      Grow Hays was focused on it because the general fund depends on sales tax. After
      winning re-election, she told Hays Post, "Retail is really high on my list,
      and the workforce needs some attention" ([Hays Post](https://hayspost.com/posts/b7a4b7ea-3e19-4919-a7fa-1de6db7bed8c)).
      Her older public record also points to Vine Street reconstruction, roundabouts,
      and business development along that corridor ([Hays Post](https://hayspost.com/posts/64dd8115-641e-489a-970e-22ef124e2781)).
