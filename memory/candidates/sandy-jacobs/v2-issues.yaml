  - evidenceRowId: em-sandy-jacobs-00002
    classification: documented-record
    text: 'Sandy Jacobs'' accessible public messaging is local, civic, and operational.
      The strongest public record is not a modern social feed; it is a trail of candidate
      letters, Hays Post Q&As, city-meeting coverage, official city pages, and civic
      appearances. Her verified social footprint is thin: a Facebook page exists with
      257 visible likes, and a LinkedIn profile preview shows 246 followers, but neither
      exposed a reliable public post feed in logged-out capture. [GoodParty lists](https://goodparty.org/candidate/sandy-jacobs/hays-city-commission)
      her profile as unclaimed and links only Facebook and the city page, with no
      candidate-filled issues.'
    sourceIds:
    - mem-memory-candidates-sandy-jacobs-in-their-own-words-md-l3
    sourceUrl: https://goodparty.org/candidate/sandy-jacobs/hays-city-commission
    sourceFile: memory/candidates/sandy-jacobs/in-their-own-words.md:3
