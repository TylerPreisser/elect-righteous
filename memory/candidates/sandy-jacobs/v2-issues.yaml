  evidenceItems:
  - evidenceRowId: em-sandy-jacobs-00006
    classification: candidate-stated
    text: Fiscal responsibility is another recurring signal. Jacobs emphasizes revenue-neutral
      budgeting, line-item review, maintaining the mill levy, and asking residents
      what they are willing to trade off. In the 2025 Q&A, she said Hays was not overtaxing
      from her perspective and praised a conservative budget that remained revenue
      neutral. In April 2026 budget coverage, she questioned where money would come
      from under proposed property-tax constraints, then said budget mindfulness was
      "everybody's job" and encouraged residents and businesses to interact with city
      officials because "We can't think of everything" ([Hays Post](https://hayspost.com/posts/87cea43b-4017-4065-a707-e19a1389beeb)).
    sourceIds:
    - mem-memory-candidates-sandy-jacobs-in-their-own-words-md-l11
    sourceUrl: https://hayspost.com/posts/87cea43b-4017-4065-a707-e19a1389beeb
    sourceFile: memory/candidates/sandy-jacobs/in-their-own-words.md:11
    confidence: likely
    useDecision: use
  - evidenceRowId: em-sandy-jacobs-00008
    classification: candidate-stated
    text: Jacobs' style is collaborative and institution-minded. When she stepped
      down as mayor in January 2026 and continued as commissioner, she said, "Titles
      may change, but values don't," and described servant leadership as listening,
      bringing people together, and keeping the community at the center of decisions
      ([Tiger Media Network](https://tigermedianet.com/?p=93385)). That same theme
      appears in her Q&A, where she calls herself a collaborator and says she believes
      in bringing everyone to the table. Her visible public comments rarely try to
      nationalize local issues.
    sourceIds:
    - mem-memory-candidates-sandy-jacobs-in-their-own-words-md-l15
    sourceUrl: https://tigermedianet.com/?p=93385
    sourceFile: memory/candidates/sandy-jacobs/in-their-own-words.md:15
    confidence: likely
    useDecision: use
  - evidenceRowId: em-sandy-jacobs-00108
    classification: candidate-stated
    text: The city letter for Pioneer Run said the project would fill a substantial
      housing need and cited a housing study identifying 189 low-income units needed
      by 2030.
