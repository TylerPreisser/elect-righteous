donor_funding_info:
  summary: |
    No public donor ledger, donation page, or candidate-controlled campaign
    finance page surfaced. KPDC guidance indicates state coverage of local
    offices includes county and first-class city offices, not all city offices.
    Since Hays is not a first-class city, absence from KPDC scanned state
    repositories should be treated as a structural limitation rather than a
    claim that no local finance filings or spending existed.
  sourceIds:
    - s-kpdc-campaign-finance
    - s-ks-sos-campaign-finance
    - s-goodparty
  gaps:
    - "Check Ellis County Clerk/Election Office directly for any local appointment-of-treasurer, exemption, or local filing retained outside KPDC online scans."
    - "Do not treat GoodParty boilerplate pledge text as a candidate-filled donor pledge because the profile is unclaimed."

