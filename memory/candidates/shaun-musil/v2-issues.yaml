    useDecision: use
  - evidenceRowId: em-shaun-musil-00009
    classification: documented-record
    text: 'The visible social footprint is limited. GoodParty lists Facebook, LinkedIn,
      and city links for Musil, but says the profile is unclaimed and issue fields
      are not filled out. The Facebook page at facebook.com/musilcomish was not publicly
      accessible in this environment, and LinkedIn activity was visible only through
      public search previews. No clear X/Twitter, Instagram, Threads, Bluesky, TikTok,
      Substack, or candidate-controlled YouTube channel surfaced. The highest visible
      engagement signal found was electoral rather than social: Hays Post reported
      Musil won re-election in 2025 with 1,772 votes, the top total among city commission
      candidates. Sources: [GoodParty](https://goodparty.org/candidate/shaun-musil/hays-city-commission),
      [Hays Post, Nov. 6, 2025](https://hayspost.com/posts/b7a4b7ea-3e19-4919-a7fa-1de6db7bed8c).'
