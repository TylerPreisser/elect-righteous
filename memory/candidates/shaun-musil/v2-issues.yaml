  - evidenceRowId: em-shaun-musil-00007
    classification: documented-record
    text: 'His COVID-era comments are the sharpest example of his governing style
      under pressure. As mayor in 2020, Musil backed mask rules and enforcement while
      saying his goal was to keep schools and businesses open. After his mayoral year
      ended, he said the commission disagreed, worked it out, and acted for the community,
      adding that he had been scared by some decisions but felt the commission did
      the right thing. The public record also notes threats and vandalism against
      his family vehicles after mask-ordinance conflict. Sources: [Hays Post, Aug.
      28, 2020](https://hayspost.com/posts/71b2e036-1db2-45b6-86a9-c9d86520f000),
