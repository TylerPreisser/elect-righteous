  - evidenceRowId: em-shaun-musil-00003
    classification: documented-record
    text: 'The strongest recurring theme is water. In his 2025 candidate Q&A, Musil
      said he was running again because Hays had "unfinished business," mainly the
      water project, and said water should always be the city''s No. 1 issue. At the
      2025 forum, he said he believed R9 would happen, defended Hays'' conservation
      record, and argued that the city was not taking water from Kinsley. Earlier,
      after a favorable 2024 ruling, he called R9 a huge win for Hays, Russell, and
      the region, said conservation would continue, and stressed being good neighbors
      to Kinsley. Sources: [Hays Post, Oct. 24, 2025](https://hayspost.com/posts/49060a66-e8fc-4755-a296-382a14c00a3d),
      [Hays Post, Oct. 8, 2025](https://hayspost.com/posts/1afb725b-f6c4-4d09-93de-94b9008ba5ae),
      [Hays Post, Feb. 8, 2024](https://hayspost.com/posts/8d8e87f6-e3c9-4950-bcea-9cac40e269bd).'
    sourceIds:
    - mem-memory-candidates-shaun-musil-in-their-own-words-md-l5
    sourceUrl: https://hayspost.com/posts/49060a66-e8fc-4755-a296-382a14c00a3d
