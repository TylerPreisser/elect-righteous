  evidenceItems:
  - evidenceRowId: em-shaun-musil-00004
    classification: candidate-stated
    text: 'Musil pairs that water message with a pro-growth, pro-retail view of Hays.
      He repeatedly says Hays needs more retail, more housing, and a stronger sales-tax
      base. In 2024, he said city-owned land north of I-70 showed Hays was serious
      about development and that retail was a priority. In 2026, after discussion
      of Chick-fil-A incentives, he credited Grow Hays and city staff and asked, "Chick-fil-A
      now; what''s next?" Sources: [Hays Post, Dec. 7, 2024](https://hayspost.com/posts/93368d50-a4df-410c-93b2-0ea148af9b4b),
      [Hays Post, Mar. 21, 2026](https://hayspost.com/posts/fd894259-fd52-4ccb-92c6-945bd172e875).'
    sourceIds:
    - mem-memory-candidates-shaun-musil-in-their-own-words-md-l7
    sourceUrl: https://hayspost.com/posts/93368d50-a4df-410c-93b2-0ea148af9b4b
    sourceFile: memory/candidates/shaun-musil/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-shaun-musil-00005
    classification: candidate-stated
    text: 'Housing is a constant companion issue, but his language is practical rather
      than slogan-driven. He credits relaxed RHID policy with getting more houses
      built, says the city has supported low-income housing grant applications, and
      argues that simply giving land away does not overcome the cost of building low-cost
      homes. His 2025 forum answer framed the goal as building more houses so that
      some existing housing becomes more affordable, while acknowledging that the
      work is harder than it looks. Sources: [Hays Post, Oct. 24, 2025](https://hayspost.com/posts/49060a66-e8fc-4755-a296-382a14c00a3d),
      [Hays Post, Oct. 8, 2025](https://hayspost.com/posts/1afb725b-f6c4-4d09-93de-94b9008ba5ae).'
    sourceIds:
    - mem-memory-candidates-shaun-musil-in-their-own-words-md-l9
    sourceUrl: https://hayspost.com/posts/49060a66-e8fc-4755-a296-382a14c00a3d
    sourceFile: memory/candidates/shaun-musil/in-their-own-words.md:9
    confidence: likely
    useDecision: use
  - evidenceRowId: em-shaun-musil-00006
    classification: candidate-stated
    text: 'On budgets and taxes, Musil''s message is cautious. He says he does not
      want to raise the mill levy in the next few years, but also says costs change
      and "you never want to say never." In 2023 budget coverage, he acknowledged
      that residents and business owners were feeling cost pressure and said he wanted
      efficiencies without putting future commissioners in a dire position. In 2026
      budget discussions, his concern turned to outside nonprofit services: if agencies
      ask for more money and the city cannot provide it, he asked what happens if
      those services disappear. Sources: [Hays Post, Oct. 24, 2025](https://hayspost.com/posts/49060a66-e8fc-4755-a296-382a14c00a3d),
      [Hays Post, Sep. 16, 2023](https://hayspost.com/posts/0013a2b9-05a4-4aae-9794-ed48359742f0),
      [Hays Post, Apr. 6, 2026](https://hayspost.com/posts/87cea43b-4017-4065-a707-e19a1389beeb).'
    sourceIds:
    - mem-memory-candidates-shaun-musil-in-their-own-words-md-l11
    sourceUrl: https://hayspost.com/posts/49060a66-e8fc-4755-a296-382a14c00a3d
    sourceFile: memory/candidates/shaun-musil/in-their-own-words.md:11
