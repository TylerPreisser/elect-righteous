    classification: candidate-stated
    text: 'Musil pairs that water message with a pro-growth, pro-retail view of Hays.
      He repeatedly says Hays needs more retail, more housing, and a stronger sales-tax
      base. In 2024, he said city-owned land north of I-70 showed Hays was serious
      about development and that retail was a priority. In 2026, after discussion
      of Chick-fil-A incentives, he credited Grow Hays and city staff and asked, "Chick-fil-A
      now; what''s next?" Sources: [Hays Post, Dec. 7, 2024](https://hayspost.com/posts/93368d50-a4df-410c-93b2-0ea148af9b4b),
