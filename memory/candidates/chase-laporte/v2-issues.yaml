  - evidenceRowId: em-chase-laporte-00907
    classification: documented-record
    text: Kansas is not as red as it looks on paper. The 2022 abortion referendum
      (Value Them Both Amendment) was defeated 59%-41%, proving that Kansas voters
      will cross party lines on specific issues. Gov. Laura Kelly, a Democrat, won
      two terms. The question is whether any of these Democrats can replicate that
      crossover appeal at the federal level.
