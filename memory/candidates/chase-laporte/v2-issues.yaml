  - id: i-term-limits-transparency
    title: "Term limits and government transparency"
    stated:
      text: |
        The clearest current-cycle federal issue item is the U.S. Term Limits
        pledge published May 28, 2025. U.S. Term Limits said LaPorte, described
        there as a 2026 U.S. House candidate for Kansas District 3, signed a
        pledge to "cosponsor and vote for" a constitutional amendment limiting
        House members to three terms and senators to two terms. In archived
        2022 campaign-site material, OnTheIssues recorded LaPorte's government
        reform line as: "Transparency in government keep officials
        accountable."
      sourceIds:
        - s-term-limits
        - s-oti-summary
    actions:
