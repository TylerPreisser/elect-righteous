issues:
  - id: i-official-status-campaign-footprint
    title: "Official filing status and campaign footprint"
    stated:
      text: |
        LaPorte's current office status is conflicted across official records.
        FEC shows a September 12, 2025 Statement of Candidacy for U.S. Senate,
        Kansas, but Johnson County Election Office currently lists him as a
        Republican, non-incumbent candidate for U.S. Representative, Kansas
        3rd District. FEC also has House KS-03 filings from January 23, 2025
        and October 7, 2025, making the October House filing later than the
        Senate filing. Johnson County GOP and May 11, 2026 news coverage also
        place him in the KS-03 House race.
      sourceIds:
        - s-joco-laporte
        - s-joco-candidates
        - s-fec-senate
        - s-fec-senate-f2
        - s-fec-house-jan
        - s-fec-house-jan-f2
        - s-fec-house-oct
        - s-fec-house-oct-f2
        - s-joco-gop
        - s-kansas-reflector-davids-2026
        - s-wibw-davids-2026
    actions:
      - id: a-house-filing-jan2025
        date: "2025-01-23"
        body: |
          Filed FEC Form 2 as a Republican candidate for U.S. House, Kansas
          District 03, candidate ID H6KS03258, with LaPorte for a Brighter
          America listed as principal campaign committee.
        sourceIds:
          - s-fec-house-jan
          - s-fec-house-jan-f2
      - id: a-senate-filing-sep2025
        date: "2025-09-12"
        body: |
          Filed FEC Form 2 as a Republican candidate for U.S. Senate, Kansas,
          candidate ID S6KS00254, with LaPorte for a Brighter America listed
