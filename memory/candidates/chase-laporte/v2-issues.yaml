  - evidenceRowId: em-chase-laporte-01172
    classification: documented-record
    text: 'Weaknesses: The SB 360 debacle is a gift to his opponent. Being overruled
      104-17 by your own caucus is humiliating. The "Pro-Trump" branding may help
      in a primary but could limit crossover appeal in a general election -- especially
      after the 2022 abortion referendum showed Kansas voters will cross party lines.
      The term-limit motivation for running (he''s being forced out as Speaker) makes
      this look like a fallback rather than a calling.'
