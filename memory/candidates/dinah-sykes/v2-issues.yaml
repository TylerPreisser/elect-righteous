  - evidenceRowId: em-dinah-sykes-00003
    classification: documented-record
    text: Sykes's current insurance-commissioner campaign is built around affordability,
      consumer protection, transparency, and fairness. Her verified campaign site
      says she is "Fighting for Affordable Insurance and Protecting Kansas Families"
      and that Kansas deserves an insurance commissioner "who puts people first."
      The same page says she is tired of seeing the insurance industry deny payment
      or block treatment, and describes the race as a fight to hold insurers accountable.
      ([source](https://www.dinahsykes.com/))
    sourceIds:
    - mem-memory-candidates-dinah-sykes-in-their-own-words-md-l5
    sourceUrl: https://www.dinahsykes.com/
    sourceFile: memory/candidates/dinah-sykes/in-their-own-words.md:5
    confidence: likely
    useDecision: use
  - evidenceRowId: em-dinah-sykes-00004
    classification: documented-record
    text: Her launch message sharpened that frame. In January 2026 coverage, Sykes
      said the cost of Kansas health insurance was "simply out of control" and that
      families cannot keep up with rising premiums for health, auto, property, and
      other insurance. She also pledged not to "take a single dime from the insurance
      industry," making independence from regulated companies part of her public case.
      ([source](https://kansasreflector.com/briefs/kansas-senate-minority-leader-challenges-gop-house-speaker-for-state-insurance-commissioner/))
    sourceIds:
    - mem-memory-candidates-dinah-sykes-in-their-own-words-md-l7
    sourceUrl: https://kansasreflector.com/briefs/kansas-senate-minority-leader-challenges-gop-house-speaker-for-state-insurance-commissioner/
    sourceFile: memory/candidates/dinah-sykes/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-dinah-sykes-00010
    classification: documented-record
    text: Health care and family economics overlap in her legislative messaging. The
      official Kansas Legislature profile shows sponsored bills on paid sick time,
      the Kansas minimum wage, child income tax credits, property-tax relief, Social
      Security and homestead eligibility, and breast-cancer screening coverage. A
      2024 tax-cut event quoted her calling a child-care tax credit a "win-win" that
      would help families, employers, and workforce participation. ([Legislature](https://www.kslegislature.gov/li/b2025_26/members/sen_sykes_dinah_1/),
      [WIBW](https://www.wibw.com/2024/01/08/gov-kelly-state-lawmakers-unveil-tax-cut-proposal-first-day-session/))
    sourceIds:
    - mem-memory-candidates-dinah-sykes-in-their-own-words-md-l19
    sourceUrl: https://www.kslegislature.gov/li/b2025_26/members/sen_sykes_dinah_1/
    sourceFile: memory/candidates/dinah-sykes/in-their-own-words.md:19
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-dinah-sykes-00011
    classification: documented-record
    text: On civil rights and social issues, the visible record is sharper and more
      confrontational. In 2024, Sykes told The Advocate that anti-trans legislation
      was "filled with hate" and said decisions about gender-affirming care involve
      children, families, mental-health counseling, and physicians. At an April 2024
      reproductive-rights rally, Kansas Reflector quoted her vowing to knock on doors
      and break the Republican supermajority after abortion-related veto override
      efforts. ([Advocate](https://www.advocate.com/politics/kansas-lgbtq-laws), [Kansas
      Reflector](https://kansasreflector.com/2024/04/29/with-veto-override-attempt-underway-kansas-abortion-rights-supporters-sound-alarm/))
    sourceIds:
    - mem-memory-candidates-dinah-sykes-in-their-own-words-md-l21
    sourceUrl: https://www.advocate.com/politics/kansas-lgbtq-laws
    sourceFile: memory/candidates/dinah-sykes/in-their-own-words.md:21
    confidence: likely
    useDecision: use
