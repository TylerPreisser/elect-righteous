  - evidenceRowId: em-allen-park-01099
    classification: candidate-stated
    text: Park is one of the clearest supporters of the bond-buildout phase and the
      district's effort to lower student fees. He told Hays Post that the bond is
      replacing and repairing facilities, more teachers have been hired, and reduced
      fees help families in tight times. He also repeatedly says communication and
      transparency are what build trust with stakeholders.
    sourceIds:
