  - evidenceRowId: em-allen-park-00003
    classification: documented-record
    text: Allen Park's public messaging is rooted in his long history inside USD 489.
      In 2023, he described himself as a retired elementary principal, licensed insurance
      agent, part-time UPS worker, and incumbent board member. He said he came from
      a family of educators, that his wife Patti had also spent decades in education,
      and that his own USD 489 work included paraprofessional, teacher, coach, migrant
      director, transition coordinator, and 25 years as Washington Elementary principal.
      [Source](https://hayspost.com/posts/ba82fc30-cb69-4a6d-8f09-c3ec5d9d51a7)
    sourceIds:
    - mem-memory-candidates-allen-park-in-their-own-words-md-l7
    sourceUrl: https://hayspost.com/posts/ba82fc30-cb69-4a6d-8f09-c3ec5d9d51a7
    sourceFile: memory/candidates/allen-park/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-allen-park-00004
    classification: documented-record
    text: The core phrase in Park's campaign record is "kids and families first."
      He used that framing in 2019 when he told KLC Journal he wanted to be part of
      a school-board team with that priority, and he returned to it in 2023 when he
      said he would use it as a reference point for decisions. His related test for
      school decisions was whether they are best for kids. [Source](https://klcjournal.com/local2019hays/)
      [Source](https://hayspost.com/posts/ba82fc30-cb69-4a6d-8f09-c3ec5d9d51a7)
    sourceIds:
    - mem-memory-candidates-allen-park-in-their-own-words-md-l9
    sourceUrl: https://klcjournal.com/local2019hays/
    sourceFile: memory/candidates/allen-park/in-their-own-words.md:9
    confidence: likely
    useDecision: use
  - evidenceRowId: em-allen-park-00005
    classification: documented-record
    text: Park's most consistent theme is trust through communication. In 2019, he
      said USD 489 needed to reconnect with the Hays community by rebuilding trust,
      encouraging involvement, increasing communication, and genuinely listening.
      In his 2023 Q&A, he again identified communication as the main thing he would
      change, saying minority opinions should be heard and board meetings should be
      inclusive and transparent. [Source](https://klcjournal.com/local2019hays/) [Source](https://hayspost.com/posts/7acb9e0e-4c56-4e6f-a618-4312a49cd922)
    sourceIds:
    - mem-memory-candidates-allen-park-in-their-own-words-md-l11
    sourceUrl: https://klcjournal.com/local2019hays/
    sourceFile: memory/candidates/allen-park/in-their-own-words.md:11
    confidence: likely
    useDecision: use
  - evidenceRowId: em-allen-park-00006
    classification: documented-record
    text: 'Facilities and bond oversight are another major throughline. Before joining
      the board, Park said he had supported prior bond issues and wanted community,
      teacher, and staff input in planning. After the $143.5 million bond passed,
      he framed the work as unfinished: residents needed information, answers, and
      chances to give input on how their investment was being spent. He said the board
      had to ensure the bond process was done correctly, on time, and fiscally responsibly.
      [Source](https://archive.hayspost.com/2019/06/page/37/) [Source](https://hayspost.com/posts/7acb9e0e-4c56-4e6f-a618-4312a49cd922)'
    sourceIds:
    - mem-memory-candidates-allen-park-in-their-own-words-md-l13
    sourceUrl: https://archive.hayspost.com/2019/06/page/37/
    sourceFile: memory/candidates/allen-park/in-their-own-words.md:13
    confidence: likely
    useDecision: use
  - evidenceRowId: em-allen-park-00008
    classification: documented-record
    text: Park also presents fiscal responsibility as a board duty tied to student
      outcomes. In 2023, he said he would keep asking budget questions and connect
      spending decisions to academic achievement. He also said he would look for local
      purchasing, appropriate cuts, grant writing, community partnerships, and efficient
      use of district facilities. In 2019, his published goals included fiscal soundness,
      safe facilities, local businesses, and data-informed decisions. [Source](https://hayspost.com/posts/ba82fc30-cb69-4a6d-8f09-c3ec5d9d51a7)
      [Source](https://archive.hayspost.com/2019/06/page/37/)
    sourceIds:
    - mem-memory-candidates-allen-park-in-their-own-words-md-l17
    sourceUrl: https://hayspost.com/posts/ba82fc30-cb69-4a6d-8f09-c3ec5d9d51a7
    sourceFile: memory/candidates/allen-park/in-their-own-words.md:17
    confidence: likely
    useDecision: use
  - evidenceRowId: em-allen-park-00009
    classification: documented-record
    text: On board role and administration, Park's stated position is policy governance
      rather than day-to-day management. In the 2023 Q&A, he said the board writes
      policy, should make sure policy follows state law, and should clearly communicate
      expectations, but daily management is not the board's job. He also said administrators
      need tools, guidance, and expectations from the board. [Source](https://hayspost.com/posts/7acb9e0e-4c56-4e6f-a618-4312a49cd922)
    sourceIds:
