  - evidenceRowId: em-allen-park-01641
    classification: documented-record
    text: On the March 2026 reconsideration of the proposed sale of 7.3 acres north
      of Felten Elementary, Ruder said, "If we sit on the land, we get nothing," and
      "I don't think we can just say no," urging the board to invite bidders to a
      meeting to discuss their projects further and referencing community-housing
      demand and potential residential-tax revenue ([source](https://hayspost.com/posts/13cbc154-8d45-445c-8557-acc25fb643e5)).
      Across the captured Hays Post coverage, board-coverage articles consistently
      describe her vote alignment with the administration majority, alongside Ken
      Brooks and Jayme Goetz, contrasted with the fiscal-oversight bloc of Allen Park
