  - evidenceRowId: em-allen-park-01236
    classification: candidate-stated
    text: In the 2023 Hays Post Q&A, Park said he had not received money outside the
      school district; the few donations he received came from family, friends, and
      community members who care about kids and education in Hays; additional expenses
      were paid personally.
