    classification: documented-record
    text: Kansas SOS confirms the filing framework and that all four U.S. Representative
      seats are up in 2026. The SOS candidate-information page says Democratic and
      Republican candidates run in the primary, national candidates file with the
      Secretary of State, and a candidate is not considered filed until the declaration
      or petition and fee are received. The primary filing deadline is noon Monday,
      June 1, 2026. The SOS important-dates page lists the 2026 primary on August
      4 and general election on November 3. The live SOS candidate-list endpoint returned
      a CloudFront 403 / JavaScript access barrier in this environment, so final state
      filing-row readback remains unresolved.
    sourceIds:
