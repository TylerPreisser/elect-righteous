      committee assignment possible. He has spent his time fighting for Farm Bill
      provisions: strengthening crop insurance, raising reference prices for ARC and
      PLC programs (which protect farmers when commodity prices drop), increasing
      funding for agricultural export programs (MAP and FMD), and pushing to set the
      estate tax exemption at $30 million per couple so family farms can pass to the
      next generation without being sold to pay taxes. He was named a "Friend of Farm
      Bureau" by the American Farm Bureau Federation.'
