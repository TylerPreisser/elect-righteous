    text: The campaign priorities page lists "Supporting Agriculture and Rural Economies,"
      with emphasis on producers, family operations, small businesses, and opposition
      to corporate monopolies. Road to Prosperity calls for making small and mid-sized
      farming profitable again, reforming subsidies toward family operations, supporting
      next-generation farmers, rural broadband, ag-tech, clean energy, rural grid
      modernization, and a one-stop shop for federal rural grants.
