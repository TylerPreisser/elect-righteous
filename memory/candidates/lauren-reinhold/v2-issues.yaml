  - evidenceRowId: em-lauren-reinhold-00623
    classification: donor-organization-signal
    text: 'Reinhold has a compelling personal story -- a federal worker displaced
      by DOGE who channeled her anger into a congressional run. Her 28 years of legal
      experience and time as a federal union officer give her deep institutional knowledge.
      However, she entered later than McRoberts, has less apparent fundraising infrastructure,
      less visible social media presence, and faces the same fundamental math problem:
      KS-01 is R+16. In the Democratic primary, her worker-advocate, DOGE-survivor
      message may resonate with primary voters who are energized by anti-Trump sentiment.
      Whether that''s enough to beat McRoberts in the primary depends heavily on fundraising
      and ground game.'
    sourceIds:
