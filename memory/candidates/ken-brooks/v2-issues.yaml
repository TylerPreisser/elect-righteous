    text: A mother of three USD 489 students and member of the Satanic Temple (Mary
      Turner) complained that the school dress code specifically banned satanism-related
      clothing while allowing other religious expression. The board initially expanded
      the satanism ban district-wide on a 5-2 vote. The Freedom From Religion Foundation
      (FFRF) intervened, and the board's own attorney (Bill Jeter) warned of First
      Amendment liability. The board subsequently revoked the satanism-specific dress
      code language.
