  - evidenceRowId: em-ken-brooks-00003
    classification: documented-record
    text: Brooks' public message is local, board-centered, and mostly candidate-attributed
      through Hays Post rather than through campaign social media. The densest source
      is his October 2025 Hays Post Q&A, where he described himself as someone with
      "a love for our community" and "a love for kids," said he listens to people
      and studies board materials, and framed school-board service as a way to improve
      Hays and USD 489. ([Hays Post](https://hayspost.com/posts/8ce0d386-aba6-4c42-b880-1307752c8220))
    sourceIds:
    - mem-memory-candidates-ken-brooks-in-their-own-words-md-l5
    sourceUrl: https://hayspost.com/posts/8ce0d386-aba6-4c42-b880-1307752c8220
    sourceFile: memory/candidates/ken-brooks/in-their-own-words.md:5
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ken-brooks-00004
    classification: documented-record
    text: Facilities and the bond program are central to his own account of why he
      ran again. Brooks said that when he first ran, he did not have an agenda "so
      much," but he did want the bond passed. By 2025, he pointed to the new high
      school opening, remaining bond projects, O'Loughlin work, and the five-year
      capital outlay plan as evidence that the district was staying on track. He said
      the capital outlay plan helps the board budget and plan for the future. ([Hays
      Post](https://hayspost.com/posts/8ce0d386-aba6-4c42-b880-1307752c8220))
    sourceIds:
    - mem-memory-candidates-ken-brooks-in-their-own-words-md-l7
    sourceUrl: https://hayspost.com/posts/8ce0d386-aba6-4c42-b880-1307752c8220
    sourceFile: memory/candidates/ken-brooks/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ken-brooks-00005
    classification: documented-record
    text: He also repeatedly talks about direct family costs. In 2021, he called high
      enrollment costs the most negative thing about USD 489 and said they put hardship
      on many families. In 2025, he returned to the same issue, saying it cost him
      $1,000 to enroll three children when his oldest was a senior and that the board
      had lowered fees in most years since he joined. ([Hays Post 2021](https://hayspost.com/posts/2613aaa8-8055-4feb-9a79-d1b5479babca),
      [Hays Post 2025](https://hayspost.com/posts/8ce0d386-aba6-4c42-b880-1307752c8220))
    sourceIds:
    - mem-memory-candidates-ken-brooks-in-their-own-words-md-l9
    sourceUrl: https://hayspost.com/posts/2613aaa8-8055-4feb-9a79-d1b5479babca
    sourceFile: memory/candidates/ken-brooks/in-their-own-words.md:9
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ken-brooks-00008
    classification: documented-record
    text: On budget, he argues the district has been responsible while acknowledging
      uncertain outside funding. Brooks said he believed USD 489 was adequately managing
      its budget and that critics had not shown the district to be irresponsible.
      He also said national and state conditions were uncertain, that the board needed
      proven leadership, and that special education had never been fully funded by
      the state. ([Hays Post](https://hayspost.com/posts/8ce0d386-aba6-4c42-b880-1307752c8220))
    sourceIds:
    - mem-memory-candidates-ken-brooks-in-their-own-words-md-l15
    sourceUrl: https://hayspost.com/posts/8ce0d386-aba6-4c42-b880-1307752c8220
    sourceFile: memory/candidates/ken-brooks/in-their-own-words.md:15
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ken-brooks-00009
    classification: documented-record
    text: His older 2021 profile shows the same mix of facilities, costs, and community
      relations. Brooks said he opposed the 2016 bond but supported the 2017 version
      because he thought it better matched district needs. He said future facilities
      work should include classroom updates, new administrative offices, and a new
      auditorium, and that maintenance outside a bond would require community involvement
      and information. He also said board unity mattered and that good decisions require
      listening to other points of view. ([Hays Post](https://hayspost.com/posts/2613aaa8-8055-4feb-9a79-d1b5479babca))
    sourceIds:
    - mem-memory-candidates-ken-brooks-in-their-own-words-md-l17
    sourceUrl: https://hayspost.com/posts/2613aaa8-8055-4feb-9a79-d1b5479babca
    sourceFile: memory/candidates/ken-brooks/in-their-own-words.md:17
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ken-brooks-00012
