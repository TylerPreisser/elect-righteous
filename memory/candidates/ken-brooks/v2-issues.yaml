  - evidenceRowId: em-ken-brooks-01108
    classification: candidate-stated
    text: The new $115M Hays High School features private bathroom stalls usable by
      both genders -- floor-to-ceiling locking stalls with common-use sinks. Principal
      Shawn Henderson said the design would reduce bullying and protect students from
      being recorded on mobile devices. Parents complained about the potential for
      opposite-sex students being "intimate" in stalls, and about vaping. Wilson as
      superintendent oversees the facility design decisions.
    sourceIds:
    - mem-memory-candidates-ken-brooks-raw-dump-md-l1529
    sourceUrl:
    sourceFile: memory/candidates/ken-brooks/raw-dump.md:1529
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-ken-brooks-01216
    classification: candidate-stated
    text: Brooks' public record is centered on facilities, fees, and budget stewardship.
      He supported the 2017 bond, later ran on keeping the current bond work on pace,
      and said the district has done a good job finding ways to fund immediate facility
      concerns. In 2025 he said he wanted to keep lowering student enrollment fees,
      and he defended district budgeting as responsible and trustworthy.
    sourceIds:
    - mem-memory-candidates-ken-brooks-raw-dump-md-l1677
    sourceUrl:
    sourceFile: memory/candidates/ken-brooks/raw-dump.md:1677
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-ken-brooks-01616
    classification: candidate-stated
    text: '"Brooks said the bank did not have ''any ill intentions'' and was ''trying
      to help our community and help our school district''"'
    sourceIds:
    - mem-memory-candidates-ken-brooks-v2-issues-yaml-l222
