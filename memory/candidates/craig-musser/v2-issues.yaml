    text: 'Undated; captured 2026-05-11 — "Taxes and the IRS: The tax code and the
      way funds are directed need to be simplified, and at the same time, the IRS
      needs to function primarily as a service. That means making well-trained IRS
      staff available to the public for guidance. So, citizens can voluntarily take
      care of documentation or filing errors and pay small self-reported shortage
      amounts without incurring fines or penalties, regardless of the amount of time
      that’s passed. The intent is to reduce costs associated with issuing, negotiating
      payments for, and collecting money based on past and present rules violations
      when tax obligations were fully or mostly met before penalties began accruing.
      Enforcement and investigation need to focus on complex tax returns and accounting
      for large tax obligations that have not been received, which directly affects
      the government’s budget."'
