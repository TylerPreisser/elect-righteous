  - evidenceRowId: em-ethan-corson-00773
    classification: faith-community-record
    text: 'Corson is the strongest Democratic candidate by every measurable metric:
      money, endorsements, and institutional support. His "common sense, common ground"
      messaging is designed to appeal to moderate Republicans and independents in
      a red state. His Jewish faith is notable in a heavily Christian state -- he
      does not appear to foreground it. His labor law background and union representation
      work will be a double-edged sword: appeals to working families but provides
      ammunition for Republican attacks. His time at the Kansas Democratic Party gives
      him deep institutional knowledge of the state''s political machinery. The 8,000-mile
      crisscross of Kansas shows a serious effort to compete in rural areas, which
      is the Democratic Party''s greatest weakness in the state.'
    sourceIds:
    - mem-memory-candidates-ethan-corson-raw-dump-md-l1152
    - mem-reports-governor-2026-all-remaining-candidates-complete-md-l127
    sourceUrl:
    sourceFile: memory/candidates/ethan-corson/raw-dump.md:1152
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-ethan-corson-00837
    classification: faith-community-record
    text: Holscher has the most compelling personal narrative in the Democratic field
      -- granddaughter of tenant farmers, daughter of a construction worker and school
      custodian, first-generation college graduate, single mom who worked her way
      up through Sprint. Her legislative record is genuinely bipartisan, and her 9
      years in the statehouse give her more governing experience than Corson. But
      the Kelly-endorsed Corson has outflanked her on money and endorsements. Her
      school voucher critique is razor-sharp and resonates in rural Kansas where there
      simply are no private schools. Her silence on faith is notable -- in Kansas
      politics, that is a gap that opponents will exploit. The pressure campaign story
      is politically damaging to the Democratic establishment more than to Holscher
      herself.
    sourceIds:
