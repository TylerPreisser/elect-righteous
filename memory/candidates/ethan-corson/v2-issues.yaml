  - evidenceRowId: em-ethan-corson-00007
    classification: documented-record
    text: Public schools are both a policy message and a personal biography signal.
      His campaign site leads with "Better Schools," and indexed campaign snippets
      refer to mental health services in schools and special education funding ([harvest](social-harvest.md#campaign-website-issue-language)).
      In a 2019 campaign quote that remains part of his public record, Corson said,
      "Every opportunity I've had in my life is due to the education I received from
      attending Shawnee Mission public schools" ([source](https://kcjc.com/section-blog/1819-news/archived-news/5736-ethan-corson-announces-candidacy-for-kansas-senate-district-7)).
      LinkedIn's public preview also showed him posting about returning to Shawnee
      Mission South, his old high school, and talking with students ([harvest](social-harvest.md#linkedin-public-preview)).
    sourceIds:
    - mem-memory-candidates-ethan-corson-in-their-own-words-md-l15
    sourceUrl: https://kcjc.com/section-blog/1819-news/archived-news/5736-ethan-corson-announces-candidacy-for-kansas-senate-district-7
    sourceFile: memory/candidates/ethan-corson/in-their-own-words.md:15
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ethan-corson-00008
    classification: documented-record
    text: On health care, the visible 2026 gubernatorial material emphasizes access
      and rural distance rather than a detailed program. At a March 8, 2026 Democratic
      debate, Corson said, "Kansans should be able to get the care that they need
      without going broke and without driving for hours to see a doctor" ([source](https://kansasreflector.com/2026/03/08/democrats-in-governors-race-use-debate-stage-to-spotlight-affordability-health-care-rural-kansas/)).
      The campaign site also surfaced mental-health language, including snippets about
      school mental-health services and mental health as a concern for "parents to
      first responders and farmers" ([source](https://ethanforkansas.com/about)).
      In the captured harvest, health care and mental health appear in 2 of 21 coded
