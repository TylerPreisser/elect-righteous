    text: On health care, the visible 2026 gubernatorial material emphasizes access
      and rural distance rather than a detailed program. At a March 8, 2026 Democratic
      debate, Corson said, "Kansans should be able to get the care that they need
      without going broke and without driving for hours to see a doctor" ([source](https://kansasreflector.com/2026/03/08/democrats-in-governors-race-use-debate-stage-to-spotlight-affordability-health-care-rural-kansas/)).
      The campaign site also surfaced mental-health language, including snippets about
      school mental-health services and mental health as a concern for "parents to
      first responders and farmers" ([source](https://ethanforkansas.com/about)).
      In the captured harvest, health care and mental health appear in 2 of 21 coded
      artifacts ([harvest](social-harvest.md#topic-share-analysis)).
