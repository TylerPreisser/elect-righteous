  - evidenceRowId: em-mason-ruder-00069
    classification: candidate-stated
    text: 'CORRECTION 2: Obs M-2 (sleuth-pass) said "On the 2025 budget, mill levy
      held flat." That is directionally correct but the precise framing in the contemporaneous
      Hays Post coverage is "2025 draft budget is at 25 mills for 15th year" (post
      0926fb34-ad11-48b6-9d78-25f06b7a4468) — i.e., 25 mills was the 15-consecutive-year
      stable rate, not a one-off flat hold. Together with the 2026 budget (24.382
      mills, 17th consecutive year), this is a clean 17-year flat-or-falling city
      mill levy pattern, not a 2-year pattern. Narrative-writer can frame as long-run
      stability.'
