  - evidenceRowId: em-jayme-goetz-00008
    classification: candidate-stated
    text: Facilities and the bond are a major part of her message, but she frames
      them through students, staff, and accountability. She said the bond would give
      staff and students improved facilities that foster growth and safety. She also
      said the buildings are for what staff and students need, not what she needs,
      and that accountability and fiscal responsibility around the money are priorities.
      ([Hays Post profile](https://hayspost.com/posts/8c99812c-9463-4172-9aef-4df43a05b5d9),
      [Hays Post Q&A](https://hayspost.com/posts/74087102-4ca2-4d13-89e0-5ddd64e94d6f))
    sourceIds:
    - mem-memory-candidates-jayme-goetz-in-their-own-words-md-l15
    sourceUrl: https://hayspost.com/posts/8c99812c-9463-4172-9aef-4df43a05b5d9
    sourceFile: memory/candidates/jayme-goetz/in-their-own-words.md:15
    confidence: likely
    useDecision: use
  - evidenceRowId: em-jayme-goetz-00039
    classification: candidate-stated
    text: 'Notes: Says calendars include one Monday off per month for teacher professional
      development. Attributes to Goetz, a former district teacher, that early-release
      days made it difficult to transition between teaching and PD; she acknowledged
      child-care difficulty but said full days benefit staff and students.'
    sourceIds:
