  - evidenceRowId: em-jayme-goetz-00010
    classification: candidate-stated
    text: On professional development calendars, she used her classroom experience
      to support full in-service days over early release. USD 489's reposted article
      says she found it hard to transition between teaching and professional development
      during early-release days and believed full in-service days were better for
      staff and ultimately students, while acknowledging child-care issues for families.
      ([USD 489](https://www.usd489.com/article/1447496))
    sourceIds:
    - mem-memory-candidates-jayme-goetz-in-their-own-words-md-l19
    sourceUrl: https://www.usd489.com/article/1447496
    sourceFile: memory/candidates/jayme-goetz/in-their-own-words.md:19
