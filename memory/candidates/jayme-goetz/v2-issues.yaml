  - evidenceRowId: em-jayme-goetz-00103
    classification: candidate-stated
    text: 'Notes: Reports Goetz and Allen Park asked whether Hays High tracks bathroom
      messes/vandalism. Goetz said intentional destruction of property costing the
      district money needs documentation and that students should be accountable in
      community-paid spaces.'
    sourceIds:
