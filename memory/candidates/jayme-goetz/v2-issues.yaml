  - evidenceRowId: em-jayme-goetz-01183
    classification: candidate-stated
    text: On calendars and professional development, Goetz's teacher experience is
      central. USD 489's reposted article says she found it difficult to transition
      between teaching and professional development on early-release days, understood
      family child-care challenges, and believed full in-service days were better
      for staff and ultimately students. ([USD 489, Feb. 2024](https://www.usd489.com/article/1447496))
