  - evidenceRowId: em-jayme-goetz-00005
    classification: candidate-stated
    text: She links education quality to her own path through USD 489 and FHSU. Goetz
      said she and her husband were products of USD 489 and benefited from a system
      that emphasized relationships, rigor, and relevance. She said teaching at different
      levels of education showed her that quality instruction benefits students and
      the community. ([Hays Post](https://hayspost.com/posts/8c99812c-9463-4172-9aef-4df43a05b5d9),
      [Tiger Media Network](https://tigermedianet.com/?p=75249))
    sourceIds:
