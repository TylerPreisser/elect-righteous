  - evidenceRowId: em-jayme-goetz-01010
    classification: candidate-stated
    text: Goetz's public identity is teacher-first. She is not a career administrator;
      she is a classroom educator who also has children in the district, which makes
      her comments feel like they come from the middle of the school ecosystem. Her
      2023 profile says her husband works for Glassman Corporation and that their
      two daughters were already in USD 489 preschool and Roosevelt kindergarten.
