  - evidenceRowId: em-jayme-goetz-00905
    classification: candidate-stated
    text: The new $115M Hays High School features private bathroom stalls usable by
      both genders -- floor-to-ceiling locking stalls with common-use sinks. Principal
      Shawn Henderson said the design would reduce bullying and protect students from
      being recorded on mobile devices. Parents complained about the potential for
      opposite-sex students being "intimate" in stalls, and about vaping. Wilson as
      superintendent oversees the facility design decisions.
    sourceIds:
    - mem-memory-candidates-jayme-goetz-raw-dump-md-l1529
    sourceUrl:
    sourceFile: memory/candidates/jayme-goetz/raw-dump.md:1529
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-jayme-goetz-01010
    classification: candidate-stated
    text: Goetz's public identity is teacher-first. She is not a career administrator;
      she is a classroom educator who also has children in the district, which makes
      her comments feel like they come from the middle of the school ecosystem. Her
      2023 profile says her husband works for Glassman Corporation and that their
      two daughters were already in USD 489 preschool and Roosevelt kindergarten.
    sourceIds:
