  - evidenceRowId: em-jayme-goetz-00003
    classification: documented-record
    text: Goetz's public message is local, educator-centered, and mostly candidate-attributed
      through Hays Post and Tiger Media Network rather than through campaign social
      media. She presents herself as a lifelong Hays resident, USD 489 graduate, former
      Hays High teacher, FHSU math instructor, wife, mother of two, and supporter
      of public education. FHSU's faculty page confirms her current professional role
      as a mathematics instructor active in Algebra. ([Hays Post](https://hayspost.com/posts/8c99812c-9463-4172-9aef-4df43a05b5d9),
      [Tiger Media Network](https://tigermedianet.com/?p=75249), [FHSU](https://www.fhsu.edu/macs/faculty-and-staff/))
    sourceIds:
    - mem-memory-candidates-jayme-goetz-in-their-own-words-md-l5
    sourceUrl: https://hayspost.com/posts/8c99812c-9463-4172-9aef-4df43a05b5d9
    sourceFile: memory/candidates/jayme-goetz/in-their-own-words.md:5
    confidence: likely
    useDecision: use
  - evidenceRowId: em-jayme-goetz-00004
    classification: documented-record
    text: Her main self-selected improvement area is transparency. In her October
      2023 Hays Post Q&A, when asked what one thing she would change about USD 489,
      she answered "the transparency of the district." In the same campaign cycle,
      she said she believed in clear communication with community members who entrust
      the district with their children and tax dollars, and that board decisions affect
      someone in the community. ([Hays Post Q&A](https://hayspost.com/posts/74087102-4ca2-4d13-89e0-5ddd64e94d6f),
      [Hays Post profile](https://hayspost.com/posts/8c99812c-9463-4172-9aef-4df43a05b5d9))
    sourceIds:
    - mem-memory-candidates-jayme-goetz-in-their-own-words-md-l7
    sourceUrl: https://hayspost.com/posts/74087102-4ca2-4d13-89e0-5ddd64e94d6f
    sourceFile: memory/candidates/jayme-goetz/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-jayme-goetz-00006
    classification: documented-record
    text: Her board message is collaborative but not passive. As a candidate, she
      said she wanted to strengthen and unify the board, improve relations with stakeholders,
      and ensure a positive work environment for educators. At the same time, she
      said board members have a responsibility to research, ask questions, and understand
      options before selecting the best one. ([Hays Post](https://hayspost.com/posts/8c99812c-9463-4172-9aef-4df43a05b5d9),
      [Tiger Media Network](https://tigermedianet.com/?p=75249))
    sourceIds:
    - mem-memory-candidates-jayme-goetz-in-their-own-words-md-l11
    sourceUrl: https://hayspost.com/posts/8c99812c-9463-4172-9aef-4df43a05b5d9
    sourceFile: memory/candidates/jayme-goetz/in-their-own-words.md:11
    confidence: likely
    useDecision: use
  - evidenceRowId: em-jayme-goetz-00007
    classification: documented-record
    text: On board role, she says day-to-day operations belong to hired professionals
      while policy and accountability remain board work. In the October 2023 Q&A,
      she said the board oversees policy and that day-to-day operations are left to
      professionals hired for those positions. In 2025 handbook debates, she treated
      discipline language as policy, arguing that operational definitions help teachers
      and students know whether consequences will be consistent. ([Hays Post Q&A](https://hayspost.com/posts/74087102-4ca2-4d13-89e0-5ddd64e94d6f),
      [Tiger Media Network](https://tigermedianet.com/?p=87800), [Hays Post](https://hayspost.com/posts/bc933c79-2f23-4279-8171-bc6dcf391cf0))
    sourceIds:
    - mem-memory-candidates-jayme-goetz-in-their-own-words-md-l13
    sourceUrl: https://hayspost.com/posts/74087102-4ca2-4d13-89e0-5ddd64e94d6f
    sourceFile: memory/candidates/jayme-goetz/in-their-own-words.md:13
    confidence: likely
    useDecision: use
  - evidenceRowId: em-jayme-goetz-00009
    classification: documented-record
    text: On private bathrooms at the new Hays High, Goetz's visible position is supportive.
      During the October 2023 candidate forum, Hays Post reported that she favored
      the new bathroom design because students were avoiding bathrooms due to privacy
      and bullying issues. In April 2024 board coverage, she questioned why bathrooms
      were the focus and said she did not think the bathrooms would change who children
      are, putting responsibility on parents to talk with their children. ([Hays Post
      forum](https://hayspost.com/posts/19aa6807-369c-4e64-9c1c-8af9d88c84df), [Tiger
      Media Network](https://tigermedianet.com/?p=78383))
    sourceIds:
    - mem-memory-candidates-jayme-goetz-in-their-own-words-md-l17
    sourceUrl: https://hayspost.com/posts/19aa6807-369c-4e64-9c1c-8af9d88c84df
    sourceFile: memory/candidates/jayme-goetz/in-their-own-words.md:17
    confidence: likely
    useDecision: use
  - evidenceRowId: em-jayme-goetz-00013
    classification: documented-record
    text: On mascot issues, Goetz brought the Hays Middle School mascot discussion
      back to the board after receiving emails and having questions about keeping
      the middle school mascot as Falcons. Tiger Media reported that she pointed to
      the Kansas Board of Education recommendation to phase out Indian mascots and
      asked the board to consider future costs if that recommendation became a mandate.
      Later Hays Post coverage reported she supported changing the middle school mascot
      to Indians after reviewing survey responses. ([Tiger Media Network](https://tigermedianet.com/?p=78383),
      [USD 489](https://www.usd489.com/article/1542245), [Hays Post](https://hayspost.com/posts/5b2cf14f-06bc-4086-9693-c33581fe6a7c))
    sourceIds:
    - mem-memory-candidates-jayme-goetz-in-their-own-words-md-l25
    sourceUrl: https://tigermedianet.com/?p=78383
    sourceFile: memory/candidates/jayme-goetz/in-their-own-words.md:25
    confidence: likely
    useDecision: use
  - evidenceRowId: em-jayme-goetz-00016
    classification: documented-record
    text: Role records are straightforward as of this capture. The USD 489 Diligent/HighBond
      member page lists Jayme Goetz as Board Member, and public meeting pages list
      her among members for 2025-2026 meetings. A June 2025 Hays Post story reported
      she was then vice president and willing to serve another term if elected, but
      the current official portal listing reviewed here identifies her as Board Member.
      ([USD 489 member page](https://usd489.community.highbond.com/portal/members.aspx?id=18),
      [USD 489 meeting page](https://usd489.community.highbond.com/Portal/MeetingInformation.aspx?Id=217),
      [Hays Post](https://hayspost.com/posts/17bd928c-22c6-4be8-980e-34e878be6c58))
    sourceIds:
