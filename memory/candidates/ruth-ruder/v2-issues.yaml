  - evidenceRowId: em-ruth-ruder-00140
    classification: donor-organization-signal
    text: 'CORRECTION vs. sleuth R-6: Sleuth R-6 framed this as "Ruth Ruder voted
      with Ken Brooks and Meagan Zampieri-Lillpopp in favor of accepting the Golden
      Belt Bank $200,000 naming-rights donation." The primary-record reality is: (a)
      there was no formal board vote on accepting the offer; (b) the 3-3 procedural
      vote was on whether to add the item to the upcoming Monday agenda, which Ruder,
      Brooks, and Zampieri-Lillpopp supported in the affirmative but which failed
      for lack of a fourth vote; (c) Vajnar then pulled the item entirely. Ruder''s
      "It belongs to the town and the school" and "You can only sell your soul so
      many times" remarks are best understood as floor commentary at the retreat /
      on the procedural dispute, not as reservations registered alongside a yes vote
      on an actual accept-the-deal motion. This is a meaningful correction for narrative-writer.'
