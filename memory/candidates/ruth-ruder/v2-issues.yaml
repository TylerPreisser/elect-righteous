  - evidenceRowId: em-ruth-ruder-02884
    classification: candidate-stated
    text: '"theirRecord": "Ruder''s most visible office action has been the decision
      to add a $2.50 walk-in fee for motor-vehicle transactions. He defended the fee
      as a state-authorized way to make the motor-vehicle side of the office pay more
      of its own costs instead of shifting those expenses onto property taxpayers.
      That decision gave voters a clear example of how he approaches county administration:
      user-fee based, budget-minded, and focused on office operations. He has also
      pointed to budget reductions and customer-flow improvements as evidence that
      the treasury office became more efficient under his watch. In local coverage,
      he said the fee generated more than $50,000 a year and helped reduce the office
      budget substantially. That is not flashy politics, but it is the kind of concrete
      administrative record county treasurers are usually judged on.",'
    sourceIds:
