  evidenceItems:
  - evidenceRowId: em-curt-vajnar-00007
    classification: candidate-stated
    text: 'Vajnar''s fiscal message is a tradeoff message, not a simple anti-tax line.
      In 2025, he said the district was doing well financially but acknowledged that
      mill-levy increases are hard on residents whose incomes are not rising as fast
      as costs. He paired that with the teacher-pay problem: if the district does
      not stay competitive, it risks losing good teachers or failing to recruit them.
      Source: [Hays Post, Oct. 14, 2025](https://hayspost.com/posts/199257e6-fc97-4089-8a4c-67a87d3422f8).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l13
    sourceUrl: https://hayspost.com/posts/199257e6-fc97-4089-8a4c-67a87d3422f8
