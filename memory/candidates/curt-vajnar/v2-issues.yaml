    text: He also has a very direct family stake in the schools. In 2025 he said three
      of his children had already gone through USD 489, two more were still in the
      district, and he had a grandchild on the way. That helps explain why his comments
      repeatedly sound like a long-range facilities manager rather than a short-term
      campaigner.
