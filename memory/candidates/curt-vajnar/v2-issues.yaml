  evidenceItems:
  - evidenceRowId: em-curt-vajnar-00005
    classification: candidate-stated
    text: 'Facilities have been a defining theme. Before the 2022 bond vote, he argued
      facilities badly needed improvement and said passing a bond was critical after
      decades without a successful bond issue. By 2025, his message had shifted from
      passing the bond to finishing it well. In his reelection Q&A, he said he wanted
      the district to finish the new and renovated facilities, finish strong, and
      plan beyond a five-year capital cycle because turf and major facility components
      will come due in waves. Sources: [Hays Post, Oct. 5, 2021](https://hayspost.com/posts/23c8a445-672d-44c2-be79-5d6dc47a2b3a),
      [Hays Post, Oct. 14, 2025](https://hayspost.com/posts/199257e6-fc97-4089-8a4c-67a87d3422f8).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l9
    sourceUrl: https://hayspost.com/posts/23c8a445-672d-44c2-be79-5d6dc47a2b3a
    sourceFile: memory/candidates/curt-vajnar/in-their-own-words.md:9
    confidence: likely
    useDecision: use
  - evidenceRowId: em-curt-vajnar-00781
    classification: candidate-stated
    text: Moderate. Willing to buck the majority on cultural issues (mascot vote).
      Generally supports administration decisions. Insurance industry background.
    sourceIds:
    - mem-memory-candidates-curt-vajnar-raw-dump-md-l1290
    sourceUrl:
    sourceFile: memory/candidates/curt-vajnar/raw-dump.md:1290
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-curt-vajnar-00006
    classification: documented-record
    text: 'That support for facilities does not mean he treats construction decisions
      as automatic. In 2023, he voted against the guaranteed maximum price contract
      for Hays High and Roosevelt, saying he did not believe he had enough chance
      to study the contract. In 2025, he joined the losing side of a vote to explore
      a separate bond-project manager, while also being quoted as thinking the idea
      came late in the process. His pattern is pro-facility but review-heavy: the
      board should finish the bond, but contracts and oversight should not be rushed.
      Sources: [Hays Post, Oct. 5, 2023](https://hayspost.com/posts/6942435f-2284-422c-9ed9-5bf7d68c4984),
      [Hays Post, Mar. 28, 2025](https://hayspost.com/posts/e4ec7011-734d-4c18-ab28-c5b38d236126).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l11
    sourceUrl: https://hayspost.com/posts/6942435f-2284-422c-9ed9-5bf7d68c4984
    sourceFile: memory/candidates/curt-vajnar/in-their-own-words.md:11
    confidence: likely
    useDecision: use
  - evidenceRowId: em-curt-vajnar-00010
    classification: documented-record
    text: 'The same process instinct shows up in ethics and hiring. Hays Post reported
      that Vajnar and Allen Park objected in 2023 to hiring the superintendent''s
      wife through the consent-agenda personnel process, leading to another debate
      over the district''s nepotism policy. In his 2025 Q&A, Vajnar said one policy
      area he had questioned was how the district hires people, including interviews,
      background checks, and selection steps. Sources: [Hays Post, Apr. 26, 2023](https://hayspost.com/posts/9fb91da0-f9e5-4d80-a065-c5c2727c6fb8),
      [Hays Post, Oct. 14, 2025](https://hayspost.com/posts/199257e6-fc97-4089-8a4c-67a87d3422f8).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l19
    sourceUrl: https://hayspost.com/posts/9fb91da0-f9e5-4d80-a065-c5c2727c6fb8
    sourceFile: memory/candidates/curt-vajnar/in-their-own-words.md:19
    confidence: likely
    useDecision: use
  - evidenceRowId: em-curt-vajnar-00015
    classification: documented-record
    text: 'His reelection result reinforces the local profile. Hays Post reported
      that Vajnar, the current board president, was re-elected in 2025 with 2,531
      votes, the highest total in the USD 489 race, and that all three winning candidates
      focused on completing bond projects. Vajnar''s election-night comment was that
      he wanted to complete the bond work on budget. Source: [Hays Post, Nov. 5, 2025](https://hayspost.com/posts/ff929dc5-f4f5-433c-876e-59fc19df6a2d).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l29
    sourceUrl: https://hayspost.com/posts/ff929dc5-f4f5-433c-876e-59fc19df6a2d
