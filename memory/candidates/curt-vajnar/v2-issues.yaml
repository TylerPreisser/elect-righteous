  - evidenceRowId: em-curt-vajnar-00079
    classification: donor-organization-signal
    text: KPDC's campaign-finance overview says the Commission administers the Campaign
      Finance Act for state offices and specified local offices, including county,
      first-class city, Wichita school board, and Kansas City Board of Public Utilities.
      Kansas SOS Election Standards say local-office reports are filed with the county
      election officer, with a sub-$1,000 exemption available for candidates who anticipate
      receiving or spending less than $1,000. Ellis County's public election pages
      did not surface a Vajnar finance filing in targeted searches.
