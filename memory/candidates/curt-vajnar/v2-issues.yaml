      in agriculture education, biology, drivers education, and administration, and
      had been Kansas Teacher of the Year. Emporia State''s public Kansas Master Teacher
      archive also lists Curt Vajnar of USD 489 Hays among the 1999 Kansas Master
      Teachers. Sources: [Hays Post, Oct. 5, 2021](https://hayspost.com/posts/23c8a445-672d-44c2-be79-5d6dc47a2b3a),
      [Emporia State 1999 award winners](https://www.emporia.edu/teachers-college/about-college/honors-awards/kansas-master-teacher-award-home/previous-winners/kansas-master-teacher-award-1999/).'
