  evidenceItems:
  - evidenceRowId: em-curt-vajnar-00005
    classification: candidate-stated
    text: 'Facilities have been a defining theme. Before the 2022 bond vote, he argued
      facilities badly needed improvement and said passing a bond was critical after
      decades without a successful bond issue. By 2025, his message had shifted from
      passing the bond to finishing it well. In his reelection Q&A, he said he wanted
      the district to finish the new and renovated facilities, finish strong, and
      plan beyond a five-year capital cycle because turf and major facility components
      will come due in waves. Sources: [Hays Post, Oct. 5, 2021](https://hayspost.com/posts/23c8a445-672d-44c2-be79-5d6dc47a2b3a),
      [Hays Post, Oct. 14, 2025](https://hayspost.com/posts/199257e6-fc97-4089-8a4c-67a87d3422f8).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l9
    sourceUrl: https://hayspost.com/posts/23c8a445-672d-44c2-be79-5d6dc47a2b3a
    sourceFile: memory/candidates/curt-vajnar/in-their-own-words.md:9
    confidence: likely
    useDecision: use
  - evidenceRowId: em-curt-vajnar-00007
    classification: candidate-stated
    text: 'Vajnar''s fiscal message is a tradeoff message, not a simple anti-tax line.
      In 2025, he said the district was doing well financially but acknowledged that
      mill-levy increases are hard on residents whose incomes are not rising as fast
      as costs. He paired that with the teacher-pay problem: if the district does
      not stay competitive, it risks losing good teachers or failing to recruit them.
      Source: [Hays Post, Oct. 14, 2025](https://hayspost.com/posts/199257e6-fc97-4089-8a4c-67a87d3422f8).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l13
    sourceUrl: https://hayspost.com/posts/199257e6-fc97-4089-8a4c-67a87d3422f8
    sourceFile: memory/candidates/curt-vajnar/in-their-own-words.md:13
    confidence: likely
    useDecision: use
  - evidenceRowId: em-curt-vajnar-00011
    classification: candidate-stated
    text: 'The Golden Belt Bank naming-rights debate is the clearest example of his
      sponsorship philosophy. Vajnar delayed action on the $200,000 offer for the
      Hays High football field, arguing the district should decide what is named,
      set contract terms, avoid merely reacting to the first offer, and give other
      supporting businesses an opportunity. Later, he said facility names belong to
      Hays citizens, not a business, and that any naming-rights money should be tied
      to field maintenance. Sources: [Hays Post, Aug. 19, 2025](https://hayspost.com/posts/a90fb672-f7e5-4826-b5f3-1decd214e83c),
      [Tiger Media Network, Aug. 19, 2025](https://tigermedianet.com/?p=88429), [Hays
      Post, Sept. 11, 2025](https://hayspost.com/posts/aefb9f40-2e86-4bb2-976e-2f731e7ce14f).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l21
    sourceUrl: https://hayspost.com/posts/a90fb672-f7e5-4826-b5f3-1decd214e83c
    sourceFile: memory/candidates/curt-vajnar/in-their-own-words.md:21
    confidence: likely
    useDecision: use
