    confidence: likely
    useDecision: use
  - evidenceRowId: em-curt-vajnar-00012
    classification: candidate-stated
    text: 'On safety, Vajnar has a specific ask: more school resource officer coverage.
      In the 2025 Q&A, he said he was proud of helping push the first resource officer
      for the 2023-24 year and would continue pushing for a second one. He framed
      it as student and staff safety in a more dangerous world, while acknowledging
      the budget cost. Source: [Hays Post, Oct. 14, 2025](https://hayspost.com/posts/199257e6-fc97-4089-8a4c-67a87d3422f8).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l23
    sourceUrl: https://hayspost.com/posts/199257e6-fc97-4089-8a4c-67a87d3422f8
