  - evidenceRowId: em-curt-vajnar-00002
    classification: documented-record
    text: 'Curt Vajnar''s public voice is local, school-specific, and governance-focused.
      I found no verified campaign website or campaign social feed for him. The strongest
      source set is Hays Post candidate Q&As and forum coverage, USD 489 public board
      infrastructure, local news coverage of board meetings, and student/local media
      coverage. The official USD 489 public portal lists Vajnar as Board President
      and connects him to board retreat, regular, special, and work-study sessions.
      Source: [USD 489 public portal](https://usd489.community.highbond.com/portal/members.aspx?id=18).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l3
    sourceUrl: https://usd489.community.highbond.com/portal/members.aspx?id=18
    sourceFile: memory/candidates/curt-vajnar/in-their-own-words.md:3
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-curt-vajnar-00003
    classification: documented-record
    text: 'His core credential is his long USD 489 teaching record. In the 2021 Hays
      NEA candidate profile published by Hays Post, Vajnar said he taught 31 years
      in USD 489, held National Board Certification, had Kansas teaching endorsements
      in agriculture education, biology, drivers education, and administration, and
      had been Kansas Teacher of the Year. Emporia State''s public Kansas Master Teacher
      archive also lists Curt Vajnar of USD 489 Hays among the 1999 Kansas Master
      Teachers. Sources: [Hays Post, Oct. 5, 2021](https://hayspost.com/posts/23c8a445-672d-44c2-be79-5d6dc47a2b3a),
      [Emporia State 1999 award winners](https://www.emporia.edu/teachers-college/about-college/honors-awards/kansas-master-teacher-award-home/previous-winners/kansas-master-teacher-award-1999/).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l5
    sourceUrl: https://hayspost.com/posts/23c8a445-672d-44c2-be79-5d6dc47a2b3a
    sourceFile: memory/candidates/curt-vajnar/in-their-own-words.md:5
    confidence: likely
    useDecision: use
  - evidenceRowId: em-curt-vajnar-00004
    classification: documented-record
    text: 'His basic decision rule is student-centered. In 2021, he said his reason
      for seeking the board was to secure the best possible education for all USD
      489 students, including his own children. Asked for the philosophy behind his
      decisions, he framed the test as whether the decision is best for USD 489 students.
      He also said the board''s accountability role includes appropriate use of funds
      and facilities, superintendent oversight, and creating the best daily environment
      for teachers and students. Source: [Hays Post, Oct. 5, 2021](https://hayspost.com/posts/23c8a445-672d-44c2-be79-5d6dc47a2b3a).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l7
    sourceUrl: https://hayspost.com/posts/23c8a445-672d-44c2-be79-5d6dc47a2b3a
    sourceFile: memory/candidates/curt-vajnar/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-curt-vajnar-00013
    classification: documented-record
    text: 'On technology and operations, Vajnar sounds practical rather than ideological.
      In 2021, he called technology essential but wanted better staff availability,
      repairs, replacements, and individual help for educators. In 2025, he supported
      vehicle leasing because of safety and long road trips, and he praised the board''s
      laptop decision for high-school students because it was researched rather than
      simply accepting the first recommendation. Sources: [Hays Post, Oct. 5, 2021](https://hayspost.com/posts/23c8a445-672d-44c2-be79-5d6dc47a2b3a),
      [Hays Post, Oct. 14, 2025](https://hayspost.com/posts/199257e6-fc97-4089-8a4c-67a87d3422f8).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l25
    sourceUrl: https://hayspost.com/posts/23c8a445-672d-44c2-be79-5d6dc47a2b3a
    sourceFile: memory/candidates/curt-vajnar/in-their-own-words.md:25
    confidence: likely
    useDecision: use
  - evidenceRowId: em-curt-vajnar-00014
    classification: documented-record
    text: 'On curriculum and assessment, his visible comments favor practical learning.
      Hays Post reported in 2024 that a graduation-policy revision was tabled because
      Vajnar wanted a list of electives that would meet a new STEM requirement. In
      2025, as board president, he said he hoped curriculum would focus on real-world
      math instead of teaching only to the test. Sources: [Hays Post, Mar. 5, 2024](https://hayspost.com/posts/4186bd0a-c7d1-4fe4-8622-6b0204fed740),
      [Hays Post, Nov. 14, 2025](https://hayspost.com/posts/a1ad62ca-72ac-46d4-a3c1-e2248ae736b3).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l27
    sourceUrl: https://hayspost.com/posts/4186bd0a-c7d1-4fe4-8622-6b0204fed740
    sourceFile: memory/candidates/curt-vajnar/in-their-own-words.md:27
    confidence: likely
    useDecision: use
  - evidenceRowId: em-curt-vajnar-00015
    classification: documented-record
    text: 'His reelection result reinforces the local profile. Hays Post reported
      that Vajnar, the current board president, was re-elected in 2025 with 2,531
      votes, the highest total in the USD 489 race, and that all three winning candidates
      focused on completing bond projects. Vajnar''s election-night comment was that
      he wanted to complete the bond work on budget. Source: [Hays Post, Nov. 5, 2025](https://hayspost.com/posts/ff929dc5-f4f5-433c-876e-59fc19df6a2d).'
    sourceIds:
    - mem-memory-candidates-curt-vajnar-in-their-own-words-md-l29
    sourceUrl: https://hayspost.com/posts/ff929dc5-f4f5-433c-876e-59fc19df6a2d
