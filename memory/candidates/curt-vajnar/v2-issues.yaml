      that honor at the time. He was also the only nationally board-certified agriculture
      teacher in the state. He had teaching endorsements in Agriculture Education,
      Biology, Drivers Education, and Administration. He chose never to pursue an
      administrator role despite holding the certificate. Retired around 2020.
