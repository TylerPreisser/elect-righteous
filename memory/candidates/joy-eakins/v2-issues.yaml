  - evidenceRowId: em-joy-eakins-00003
    classification: documented-record
    text: 'Across the accessible public set, Eakins'' message is built around a "Kansas
      Comeback" frame: Kansas should be the best place to live the American dream,
      but career politicians have let the state decline. Her campaign About page calls
      her a "strong conservative and America First patriot" and ties that identity
      to Cornerstone Data, Wichita school-board service, parents'' rights, fiscal
      responsibility, and education reform. ([source](https://www.kansascomeback.com/about))
      In the January 30, 2026 GOP debate, she opened by saying, "Kansas should be
      the best place to live the American dream, but it''s not, because for too long
      career politicians, have been stewarding our decline." ([source](https://freestatenews.net/local-issues/transcript-of-the-gop-governors-debate-january-30-2026-part-1/))'
    sourceIds:
    - mem-memory-candidates-joy-eakins-in-their-own-words-md-l5
    sourceUrl: https://www.kansascomeback.com/about
    sourceFile: memory/candidates/joy-eakins/in-their-own-words.md:5
    confidence: likely
    useDecision: use
  - evidenceRowId: em-joy-eakins-00004
    classification: documented-record
    text: Education is the dominant issue in her candidate-controlled material. Her
      Education page says Kansas students are average or below average on major NAEP
      assessments, that parents "know best what their child needs to succeed," and
      that every family should have educational choices. The platform calls for robust
      school choice, stronger civics education, reading and math outcomes, repeal
      of the law requiring districts to negotiate with teachers' unions, a new finance
      formula, school-board training, and teacher training focused on outcomes. ([source](https://www.kansascomeback.com/education))
      In the debate transcript, she said, "I put out an education plan in September.
      Nobody else has put a plan out with details," and promised to sign school choice
      in the first 90 days. ([source](https://freestatenews.net/local-issues/gop-governors-debate-transcript-part-2/))
    sourceIds:
    - mem-memory-candidates-joy-eakins-in-their-own-words-md-l7
    sourceUrl: https://www.kansascomeback.com/education
    sourceFile: memory/candidates/joy-eakins/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-joy-eakins-00005
    classification: documented-record
    text: Her education argument repeatedly uses her Wichita school-board record and
      her data-business identity. The campaign says she advanced parents' rights,
      advocated for school choice, opposed suing the state for more money, opposed
      longer school days that she said prioritized janitors over kids, and used her
      data analytics firm to show Kansas could return children to classrooms safely
      during COVID. ([source](https://www.kansascomeback.com/education)) In the debate
      transcript, she said she had done "a lot of data work in the state during COVID,"
      fought to get the state open, and testified that state data was wrong. ([source](https://freestatenews.net/local-issues/transcript-of-the-gop-governors-debate-january-30-2026-part-1/))
    sourceIds:
    - mem-memory-candidates-joy-eakins-in-their-own-words-md-l9
    sourceUrl: https://www.kansascomeback.com/education
    sourceFile: memory/candidates/joy-eakins/in-their-own-words.md:9
    confidence: likely
    useDecision: use
  - evidenceRowId: em-joy-eakins-00011
    classification: documented-record
    text: Several policy positions were visible mainly through debate coverage rather
      than the campaign site. On marijuana, Kansas Reflector quoted Eakins saying
      legalized marijuana creates service costs and cultural problems, and that she
      did not want high school students thinking about where to get marijuana instead
      of reading and math. ([source](https://kansasreflector.com/2026/01/30/six-kansas-gop-candidates-for-governor-toss-haymakers-in-first-debate-find-unity-on-key-issues/))
      On judicial selection, the Free State News transcript has her supporting a move
      away from the Missouri Plan and toward elected judges. On immigration/law enforcement,
      the same transcript has her criticizing Johnson County's Democratic sheriff
      for not cooperating with ICE and saying Republicans must stand by law enforcement.
      ([source](https://freestatenews.net/local-issues/gop-governors-debate-transcript-part-2/))
    sourceIds:
