    text: Her education argument repeatedly uses her Wichita school-board record and
      her data-business identity. The campaign says she advanced parents' rights,
      advocated for school choice, opposed suing the state for more money, opposed
      longer school days that she said prioritized janitors over kids, and used her
      data analytics firm to show Kansas could return children to classrooms safely
      during COVID. ([source](https://www.kansascomeback.com/education)) In the debate
      transcript, she said she had done "a lot of data work in the state during COVID,"
      fought to get the state open, and testified that state data was wrong. ([source](https://freestatenews.net/local-issues/transcript-of-the-gop-governors-debate-january-30-2026-part-1/))
