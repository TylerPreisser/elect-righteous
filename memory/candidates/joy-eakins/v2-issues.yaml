    text: Education is the dominant issue in her candidate-controlled material. Her
      Education page says Kansas students are average or below average on major NAEP
      assessments, that parents "know best what their child needs to succeed," and
      that every family should have educational choices. The platform calls for robust
      school choice, stronger civics education, reading and math outcomes, repeal
      of the law requiring districts to negotiate with teachers' unions, a new finance
      formula, school-board training, and teacher training focused on outcomes. ([source](https://www.kansascomeback.com/education))
      In the debate transcript, she said, "I put out an education plan in September.
      Nobody else has put a plan out with details," and promised to sign school choice
      in the first 90 days. ([source](https://freestatenews.net/local-issues/gop-governors-debate-transcript-part-2/))
