  - evidenceRowId: em-joy-eakins-00007
    classification: documented-record
    text: Business, entrepreneurship, and skepticism of targeted incentives are recurring
      signals. The campaign biography says she built Cornerstone Data into a successful
      Kansas data-analytics firm with nationwide reach. ([source](https://www.kansascomeback.com/about))
      At the debate, she said she spent 17 years building the most successful data
      consulting firm in Kansas, with customers in 160 cities and 27 states. On economic
      incentives, she said government involvement in business is "about picking winners
      and losers" and that it was her job to make her profit-and-loss statement work,
      not taxpayers' job. ([source](https://freestatenews.net/local-issues/transcript-of-the-gop-governors-debate-january-30-2026-part-1/))
