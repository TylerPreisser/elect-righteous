  - evidenceRowId: em-joy-eakins-00540
    classification: faith-community-record
    text: Eakins is a serious person with a serious resume -- Bell Labs, Lucent, Avaya,
      founding a successful data firm, chairing the Wichita Chamber. Her Theological
      Studies background and company name "Cornerstone" suggest a faith-rooted worldview
      without being heavy-handed. But her campaign is almost entirely self-funded
      ($1M personal loan out of $1.14M total), which raises questions about grassroots
      support. Her explicit Trump alignment ("golden age") may help in a Republican
      primary but could be a liability in the general. Her school board experience
      (won by just 46 votes, chose not to run for re-election) is thin public service
      experience. Her "medical freedom" messaging is coded anti-vaccine/anti-mandate
      language from the COVID era. At the debate, she positioned herself as an outsider
      alongside Sarnecki against the establishment candidates.
