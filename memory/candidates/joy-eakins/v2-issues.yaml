  - evidenceRowId: em-joy-eakins-00006
    classification: candidate-stated
    text: The second major theme is taxes, especially property taxes and appraisal
      growth. Her Property Tax Reform page says Kansas' taxes are "more like California's
      than our neighboring states," describes rising appraisals as a "backdoor tax
      increase," and proposes capping annual appraisal hikes at 3% or inflation, whichever
      is less. ([source](https://www.kansascomeback.com/propertytaxreform)) At the
      GOP debate, she said people such as the Riedels from Ellis were opening appraisal
      notices and getting "a total shock," and that appraisers should have to show
      their work while government bears the burden of proof. ([source](https://freestatenews.net/local-issues/transcript-of-the-gop-governors-debate-january-30-2026-part-1/))
      Hays Post reported that her April 2026 Ellis town hall focused on education
      reform and property tax relief. ([source](https://hayspost.com/posts/2c52043f-2180-461b-9a64-4fd75c…
    sourceIds:
