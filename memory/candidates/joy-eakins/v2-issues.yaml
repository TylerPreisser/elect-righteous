  - evidenceRowId: em-joy-eakins-00011
    classification: documented-record
    text: Several policy positions were visible mainly through debate coverage rather
      than the campaign site. On marijuana, Kansas Reflector quoted Eakins saying
      legalized marijuana creates service costs and cultural problems, and that she
      did not want high school students thinking about where to get marijuana instead
      of reading and math. ([source](https://kansasreflector.com/2026/01/30/six-kansas-gop-candidates-for-governor-toss-haymakers-in-first-debate-find-unity-on-key-issues/))
      On judicial selection, the Free State News transcript has her supporting a move
      away from the Missouri Plan and toward elected judges. On immigration/law enforcement,
      the same transcript has her criticizing Johnson County's Democratic sheriff
      for not cooperating with ICE and saying Republicans must stand by law enforcement.
      ([source](https://freestatenews.net/local-issues/gop-governors-debate-transcript-part-2/))
