          - s-hayspost-forum-2023
        mappedToIssueId: i-housing-growth-incentives

  - id: i-budget-taxes-city-services
    title: "Budget, taxes, and city services"
    stated:
      text: |
        Cunningham's public budget language is tradeoff-oriented. She supported a
        constrained, revenue-neutral 2026 city budget and has warned that removing
        funding sources can shift costs elsewhere. On local ordinances and services,
        her visible comments emphasize resident feedback and practical city operations.
      sourceIds:
        - s-hayspost-budget-2026
        - s-hayspost-property-tax-2025
        - s-hayspost-budget-prep-2026
        - s-hayspost-fireworks-2025
    actions:
      - id: a-2026-budget-revenue-neutral-2025-09-11
        date: "2025-09-11"
        body: |
          Cunningham voted aye on the amended 2026 City of Hays budget at the
          revenue-neutral rate of 24.382 mills. The official minutes state the
          city found a way to stay revenue-neutral without affecting operations
          or capital projects.
        sourceIds:
          - s-hays-agenda-09252025
          - s-hayspost-budget-2026
      - id: a-code-abatement-actions-2025-09-11
        date: "2025-09-11"
        body: |
          Cunningham moved Resolution No. 2025-017 for nuisance abatement at
          515 East 11th Street and seconded Resolution No. 2025-019 for nuisance
          and inoperable-vehicle abatement at 231 East 12th Street. Both actions
          passed with Cunningham voting aye.
        sourceIds:
          - s-hays-agenda-09252025
      - id: a-2025-audit-accepted-2026-04-09
        date: "2026-04-09"
        body: |
          Cunningham voted aye to accept the 2025 City of Hays audit as presented
          by Adams Brown.
        sourceIds:
          - s-hays-agenda-04232026
