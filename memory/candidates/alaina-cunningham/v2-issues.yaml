issues:
  - id: i-water-r9
    title: "Water and R9 long-term supply"
    stated:
      text: |
        Cunningham has consistently treated water supply as a long-term city issue.
        In her 2023 candidate Q&A she named securing a sustainable water source as
        a top challenge, connected that work to conservation and the R9 framework,
        and said the pipeline would give Hays a sustainable supply for years to come.
        In 2025 R9 coverage, she framed the project in survival terms.
      sourceIds:
        - s-hayspost-qa-2023
        - s-hayspost-r9-2025
    actions:
      - id: a-r9-implementation-question-2023-11-15
        date: "2023-11-15"
        body: |
          During coverage of a R9 wellfield and pipeline update, Cunningham asked
          how many property owners would need to be worked with along the proposed
          67-mile pipeline. The response estimated roughly 150 to 200 property
          owners. This is an implementation question, not a roll-call vote.
        sourceIds:
          - s-hayspost-r9-2023
      - id: a-r9-survival-statement-2025-08-29
        date: "2025-08-29"
        body: |
          At a Hays-Russell R9 update, Cunningham said the project was about
          sustainability and survival and said Hays does not survive without it.
          This is direct candidate-attributed issue evidence; no primary roll-call
          vote on this specific R9 item was located in this pass.
        sourceIds:
          - s-hayspost-r9-2025
    socialSignals:
      - id: ss-no-campaign-social-water
        platform: "Public web / social search"
        observation: "No candidate-controlled campaign social feed was verified, so water issue evidence comes from local candidate Q&A, local coverage, and official city records rather than social posts."
        observedAt: "2026-05-19"
        sourceIds:
          - s-hayspost-qa-2023
        mappedToIssueId: i-water-r9
    gap:
      summary: |
        The strongest Cunningham-specific water evidence is secondary-source
        candidate attribution. A primary roll-call vote or official R9 meeting
        minute with a Cunningham-specific action was not confirmed in this pass.
      sourceIds:
