  - id: i-housing-growth-incentives
    title: "Housing, workforce growth, and development incentives"
    stated:
      text: |
        Cunningham has linked housing availability, workforce retention, retirees,
        and business growth. Her 2023 Q&A called for diversified housing and
        incentives to make development feasible. Later public comments continued
        to describe incentives as a practical tool for getting projects built in Hays.
      sourceIds:
        - s-hayspost-qa-2023
        - s-tigermedia-profile-2023
        - s-hayspost-forum-2023
        - s-hayspost-development-2023
        - s-hayspost-agiliti-2025
        - s-hayspost-incentives-2025
    actions:
      - id: a-exit157-tif-cid-2026-04-09
        date: "2026-04-09"
        body: |
          Cunningham, attending by Zoom, voted aye on Ordinance No. 4097 adopting
          the Exit 157 24-7 TIF project plan and development agreement, and voted
          aye on Ordinance No. 4098 establishing the community improvement district
          and levying a 2.0 percent CID sales tax.
        sourceIds:
          - s-hays-agenda-04232026
      - id: a-pioneer-run-irb-2026-04-23
        date: "2026-04-23"
        body: |
          Cunningham voted aye on Resolution No. 2026-005, an intent to issue
          Industrial Revenue Bonds for the Pioneer Run affordable multifamily
          project. The packet says the resolution could help the developer's Low
          Income Housing Tax Credit application by granting up to 10 additional
          points.
        sourceIds:
          - s-hays-agenda-05142026
      - id: a-lihtc-fee-waiver-support-2026-04-23
        date: "2026-04-23"
        body: |
          Cunningham voted aye on the consent agenda that included letters of
          support to waive development fees for eligible 2026 LIHTC projects.
          The packet letters say the projects would fill a substantial housing
          need and cite a city housing study identifying 189 low-income units
          needed by 2030.
        sourceIds:
          - s-hays-agenda-05142026
    socialSignals:
      - id: ss-housing-local-media-only
        platform: "Hays Post / Tiger Media"
        observation: "Housing and growth signals are candidate-attributed through local media and official votes, not through a verified campaign social feed."
        observedAt: "2026-05-19"
        sourceIds:
