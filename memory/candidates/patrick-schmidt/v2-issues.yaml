    text: Across the captured period the feed contains no accessible campaign-controlled
      posts about Kansas water policy, the Ogallala Aquifer, wheat prices, Farm Bill
      details, Fort Riley, rural hospital closures by facility name, gun policy, immigration
      enforcement details, capital punishment, foster care, adoption, or religious
