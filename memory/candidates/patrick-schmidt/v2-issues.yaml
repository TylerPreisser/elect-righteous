issues:
  - id: i-property-tax-relief
    title: "Property Taxes / Tax Relief"
    stated:
      text: |
        Schmidt has made property tax relief one of the clearest themes in his public statehouse record. Kansas Reflector reported him saying he wanted "real property tax relief for Kansans," and his legislative record includes sponsorship of property-tax exemption bills and votes on constitutional-amendment proposals to limit valuation increases.
      sourceIds:
        - s-kansas-reflector-20250303
        - s-ks-leg-sb90
        - s-ks-leg-sb201
        - s-ks-leg-vote-record-2025
    actions:
      - id: a-sponsored-sb90
        date: "2025-01-28"
        body: |
          Sponsored SB 90, which would provide a property tax exemption from local government levies for the first $100,000 of appraised value for certain owner-occupied homes and authorize local governments to propose an opt-out ballot question. The bill died in committee.
        sourceIds:
          - s-ks-leg-sb90
      - id: a-sponsored-sb201
        date: "2025-02-06"
        body: |
          Sponsored SB 201, a homestead property tax exemption bill for certain veterans and former law enforcement officers with service-connected disabilities. The bill died.
        sourceIds:
          - s-ks-leg-sb201
      - id: a-scr1603-hcr5011-votes
        date: "2025-02-06"
        body: |
          Voted Yea on SCR 1603, a proposed constitutional amendment limiting property tax valuation increases. He later voted Yea on emergency final action for HCR 5011 on 2025-03-21, then Nay on later HCR 5011 conference committee report adoption attempts on 2025-03-26 and 2025-03-27.
        sourceIds:
          - s-ks-leg-vote-record-2025
          - s-kansas-reflector-20250303
    socialSignals: []
    gap:
      summary: |
        The record is concrete on property-tax relief, but proposals varied by mechanism and stage. Treat SB 90/SB 201 sponsorship, SCR 1603 support, and later HCR 5011 CCR Nay votes as separate actions rather than one uniform position.
      sourceIds:
        - s-ks-leg-vote-record-2025

  - id: i-healthcare-medicaid-prescription-drugs
    title: "Healthcare / Medicaid / Prescription Drugs"
    stated:
      text: |
        Schmidt's campaign says every American deserves access to affordable health care. The campaign says he would work to expand Medicaid in Kansas to extend care to 150,000 people statewide, lower prescription drug costs, support legislation like the Lower Drug Costs Now Act, and bring more federally qualified health centers to Kansas.
      sourceIds:
        - s-campaign-healthcare
    actions:
      - id: a-sb29-local-health-authority
        date: "2025-02-19"
        body: |
          Voted Nay on SB 29 final action substitute, concurrence, and veto override. SB 29 removed authority of local health officers or county/joint boards of health to prohibit public gatherings when necessary to control infectious or contagious disease.
        sourceIds:
          - s-ks-leg-vote-record-2025
    socialSignals: []
    gap:
      summary: |
        The campaign gives clear healthcare goals on Medicaid, prescription costs, and federally qualified health centers. The available legislative action evidence in this pass is strongest on local public-health authority rather than Medicaid expansion itself.
      sourceIds:
        - s-campaign-healthcare
        - s-ks-leg-vote-record-2025

  - id: i-labor-wages-trade-tax-policy
    title: "Labor / Wages / Trade / Tax Policy"
    stated:
      text: |
        Schmidt's campaign says strong unions built the middle class and says he would work to pass the PRO Act and protect collective bargaining rights. The campaign also says he would oppose trade deals and tax policies that do not put workers first in Kansas.
      sourceIds:
        - s-campaign-labor
    actions:
      - id: a-sponsored-paid-sick-time
        date: "2025-02-13"
        body: |
          Co-sponsored SB 216, establishing the Kansas paid sick time act and setting accrual, usage, and employer obligations for earned paid sick time. The bill died.
        sourceIds:
          - s-ks-leg-sb216
      - id: a-sponsored-minimum-wage
        date: "2025-02-13"
        body: |
          Co-sponsored SB 218, increasing the Kansas minimum wage of employees. The bill died.
        sourceIds:
          - s-ks-leg-sb218
      - id: a-sponsored-labor-constitutional-resolution
        date: "2025"
        body: |
          Sponsored SCR 1609, a proposed constitutional amendment to repeal the Kansas constitutional provision regarding membership and nonmembership in labor organizations.
        sourceIds:
          - s-ks-leg-sponsored-resolutions
    socialSignals: []
    gap:
      summary: |
        Candidate-controlled language is broad on trade and tax policy, while the state legislative record in this pass is more specific on paid sick time, minimum wage, and labor-organization constitutional language.
      sourceIds:
        - s-campaign-labor
        - s-ks-leg-sponsored-resolutions

  - id: i-abortion-pregnancy-family-policy
    title: "Abortion / Pregnancy / Family Policy"
    stated:
      text: |
        No detailed first-person abortion-policy page was found on Schmidt's accessible campaign website during this pass. Kansas City Star coverage described Schmidt as an abortion-rights supporter, but the stronger primary-source record here is legislative: he sponsored a paid prenatal leave bill, offered a floor amendment creating a Kansas tax exemption for unborn children, and then voted Nay on HB 2062 final action, conference report adoption, and veto override.
      sourceIds:
        - s-campaign-home
        - s-campaign-about
        - s-ks-leg-sb153
        - s-ks-leg-hb2062
        - s-ks-leg-hb2062-schmidt-amendment
        - s-ks-leg-vote-record-2025
        - s-kcstar-profile
    actions:
      - id: a-sponsored-paid-prenatal-leave
        date: "2025-02-05"
        body: |
          Sponsored SB 153, establishing the Kansas paid prenatal personal leave act and requiring employers to provide 20 hours of paid prenatal personal leave. The bill died.
        sourceIds:
          - s-ks-leg-sb153
      - id: a-hb2062-floor-amendment
        date: "2025-03-11"
        body: |
          Offered a floor amendment to HB 2062 that would add a $2,320 Kansas personal exemption for any unborn child as defined in K.S.A. 23-3001 and require applying to the Department of Revenue for a taxpayer identification number for the unborn child.
        sourceIds:
          - s-ks-leg-hb2062
          - s-ks-leg-hb2062-schmidt-amendment
      - id: a-hb2062-nay-votes
        date: "2025-03-12"
        body: |
          Voted Nay on HB 2062 final action amended on 2025-03-12, Nay on adoption of the conference committee report on 2025-03-26, and Nay on the veto override on 2025-04-10. The final law concerned child support orders for unborn children and income tax exemptions for unborn and stillborn children, among other child-support enforcement provisions.
        sourceIds:
          - s-ks-leg-vote-record-2025
          - s-ks-leg-hb2062
    socialSignals: []
    gap:
      summary: |
        The HB 2062 record is easy to overstate. The primary record supports saying Schmidt offered an unborn-child tax-exemption amendment, but it also supports saying he did not vote for the final bill. Do not summarize this as simple support for HB 2062.
      sourceIds:
        - s-ks-leg-hb2062-schmidt-amendment
        - s-ks-leg-vote-record-2025
        - s-kcstar-profile

  - id: i-democracy-elections-january-6
    title: "Democracy / Elections / January 6"
    stated:
      text: |
        Schmidt's public record connects his entry into politics with January 6, and he sponsored SR 1706 condemning pardons and commutations for individuals involved in the January 6 attack at the U.S. Capitol. His voting record also includes Nay votes on SB 4, which required advance voting ballots to be returned by 7:00 p.m. on election day.
      sourceIds:
        - s-kansas-reflector-20250303
        - s-ks-leg-sponsored-resolutions
        - s-ks-leg-vote-record-2025
    actions:
      - id: a-sponsored-sr1706
        date: "2025"
        body: |
          Sponsored SR 1706, condemning pardons and commutations of sentences for individuals involved in the January 6, 2021 attack at the United States Capitol.
        sourceIds:
          - s-ks-leg-sponsored-resolutions
      - id: a-sb4-advance-ballot-votes
        date: "2025-02-05"
        body: |
          Voted Nay on SB 4 final action, concurrence, and veto override. SB 4 required advance voting ballots to be returned by 7:00 p.m. on election day.
        sourceIds:
          - s-ks-leg-vote-record-2025
    socialSignals: []
    gap:
      summary: |
        January 6 evidence is supported by candidate-attributed news quotes and a sponsored resolution. Election-administration evidence is supported by SB 4 roll calls, but this pass did not find a detailed campaign voting-rights page.
      sourceIds:
        - s-kansas-reflector-20250303
        - s-ks-leg-sponsored-resolutions
        - s-ks-leg-vote-record-2025

  - id: i-immigration-employment-enforcement
    title: "Immigration / Employment Enforcement"
    stated:
      text: |
        No detailed immigration page was found on Schmidt's accessible campaign website during this pass. The clearest primary-source evidence is SCR 1614, which he sponsored; the resolution urges Congress to increase penalties for violations of federal immigration laws and urges ICE to prosecute employers who hire undocumented immigrants.
      sourceIds:
        - s-ks-leg-sponsored-resolutions
    actions:
