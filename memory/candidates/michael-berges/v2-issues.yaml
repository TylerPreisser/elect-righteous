issues:
  - id: i-budget-taxes-services
    title: "County budget, taxes, employee pay, and service levels"
    stated:
      text: |
        Berges's 2022 candidate answers treated the county sales-tax sunset
        as a long-range budget question rather than a fixed promise. He said
        future options could include cutting services, cutting employees,
        offsetting with mill-levy increases, asking voters for a 10-year
        extension, or considering a permanent sales tax. He also said the
        sales taxes had helped stabilize the county budget and that the path
        forward should be worked through with administrators, commissioners,
        and the community.
      sourceIds:
        - s-hayspost-berges-qa-2022
    actions:
      - id: a-mill-levy-discussion-2025
        date: "2025-07-08"
        body: |
          Presented the county's 2026 mill-levy discussion. The official
          agenda cover sheet says Berges asked commissioners to consider
          adding one to two mills to prepare for capital projects and preserve
          current service levels if state legislation limited local-government
          revenue tools.
        sourceIds:
          - s-agenda-07082025
      - id: a-budget-publication-2025
        date: "2025-08-19"
        body: |
          Moved to allow the County Clerk to publish the 2026 Ellis County
          General Fund and Fire District budgets for the September 9 budget
          hearings. The motion passed 3-0.
        sourceIds:
          - s-minutes-08192025
      - id: a-2026-budget-rnr-2025
        date: "2025-09-09"
        body: |
          Voted yes by named roll call on the 2026 General Fund and Fire
          District budgets exceeding the revenue-neutral rates and on
          Resolution 2025-14. The motion passed 3-0 after public comments
          from residents at the hearing.
        sourceIds:
          - s-minutes-09092025
          - s-hayspost-budget-approved-2025
      - id: a-salary-resolution-2026
        date: "2026-01-13"
        body: |
          Seconded and voted for Resolution 2026-04 setting 2026 salary step
          adjustments for Ellis County elected officials. The resolution
          listed County Commissioner District 1 at Pay Grade 35, Step 4,
          $20,746, and passed 3-0.
        sourceIds:
          - s-minutes-01132026
      - id: a-2025-budget-explanation
        date: "2024-10-01"
        body: |
          In coverage of the 2025 county budget, which reduced the mill levy
          while exceeding revenue neutral, Berges connected budget increases
          mainly to employee wages and benefits and criticized treating
          revenue neutral as a simple taxpayer protection.
        sourceIds:
          - s-hayspost-budget-2025
    socialSignals: []
    gap:
      summary: |
        Berges's fiscal record is best described as service-and-capital
        planning rather than a simple tax-cut or tax-increase frame. He has
        supported mill-levy and salary actions in office while publicly tying
        them to infrastructure, service levels, and employee retention. No
        donor evidence was found that would support a funding-influence claim.
      evidenceIds:
        - a-mill-levy-discussion-2025
        - a-2026-budget-rnr-2025
        - a-salary-resolution-2026

  - id: i-infrastructure-roads-land-use
    title: "Roads, bridges, subdivisions, and infrastructure growth"
    stated:
      text: |
        Berges said in 2022 that he supported continuing to earmark portions
        of the county sales tax for infrastructure upkeep, naming bridges,
        roads, and possibly railroad crossings. He also said Ellis County
        should build infrastructure reserves so it can address failures,
        pursue grants, and take care of multiple projects when needed.
      sourceIds:
        - s-hayspost-berges-qa-2022
    actions:
      - id: a-fairview-patch-yes-2025
        date: "2025-07-01"
        body: |
          Seconded and voted with the majority to approve the Fairview Patch
          final plat and Resolution 2025-12. The motion passed 2-1, with
          Leiker recorded as the no vote.
        sourceIds:
          - s-minutes-07012025
      - id: a-subdivision-road-discussion-2025
        date: "2025-08-19"
        body: |
          Opened the continued discussion on county-maintained subdivision
          roads, identified 21 subdivisions for which the county is
          responsible, and asked staff to return later with cost estimates for
          280th Ave after public input and right-of-way discussion.
        sourceIds:
          - s-minutes-08192025
      - id: a-ellis-road-support-letter-2025
        date: "2025-08-19"
        body: |
          Asked the commissioners to sign a support letter for the City of
          Ellis road project. The city was applying for a cost-share grant for
          West 2nd Street, and the minutes say all commissioners agreed to
          sign the letter.
        sourceIds:
          - s-minutes-08192025
      - id: a-right-of-way-update-2026
        date: "2026-02-17"
        body: |
          During road-tour discussion, asked for an update on the right-of-way
          project. Staff described a systematic process beginning in Township
          11 and projected a September update to the commission.
        sourceIds:
          - s-minutes-02172026
    socialSignals: []
    gap:
      summary: |
        The record aligns with Berges's 2022 infrastructure emphasis, but it
        also places him on the pro-approval side of at least one subdivision
        vote where Leiker dissented. That contrast is a land-use and
        comprehensive-planning difference between the two county commission
        incumbents, not evidence of motive.
      evidenceIds:
        - a-fairview-patch-yes-2025
        - a-subdivision-road-discussion-2025

  - id: i-public-safety-courts-recovery
    title: "Public safety, sheriff facilities, courts, and recovery services"
    stated:
      text: |
        In 2022, Berges identified sheriff's department facility needs as a
        major county issue. He discussed the possibility that a Hays police
        relocation could affect shared space, said he would be open to
        expansion or a new law/judicial/detention center in the direction
        favored by the sheriff, and noted county costs for housing inmates
        elsewhere.
      sourceIds:
        - s-hayspost-berges-qa-2022
    actions:
      - id: a-opioid-funds-training-2026
        date: "2026-02-17"
        body: |
          Seconded and voted for use of approximately $1,828.29 in opioid
          funds to send three sheriff's officers to the Kansas Narcotics
          Officers Association yearly conference. The motion passed 3-0.
        sourceIds:
          - s-minutes-02172026
      - id: a-recovery-court-grant-2026
        date: "2026-02-17"
        body: |
          Was present when the commission received information on a $25,211.50
          Specialty Court Funding award for recovery court. The minutes record
          that the award would help with training, a software app, fuel
          incentives, other incentives, gift cards, and behavior therapy.
        sourceIds:
          - s-minutes-02172026
      - id: a-retreat-sheriff-staffing-2026
        date: "2026-04-08"
        body: |
          Attended the county retreat where sheriff staffing was discussed.
          The minutes record an undersheriff proposal for three additional
          staff, with one position funded by fingerprint fees and two needing
          budget funding.
        sourceIds:
          - s-minutes-04082026
    socialSignals: []
    gap:
      summary: |
        Berges's public-safety record includes smaller concrete actions on
        opioid-fund training and recovery-court grant context, while the
        larger jail or law-enforcement facility question remains open in the
        reviewed record. No final vote on a jail expansion or new detention
        facility was confirmed in this pass.
      evidenceIds:
        - a-opioid-funds-training-2026
        - a-retreat-sheriff-staffing-2026

  - id: i-economic-development-housing-growth
    title: "Economic development, housing, and intergovernmental cooperation"
    stated:
      text: |
        Berges said in 2022 that the county commission should be more
        proactive in economic development, especially through stable funding
        for Grow Hays and related organizations. He also named tax incentives,
        zoning changes, infrastructure, and rural water access as tools that
        could affect business, housing, and growth. He described city-county
        cooperation as important because city residents are also county
        residents.
      sourceIds:
        - s-hayspost-berges-qa-2022
        - s-hayspost-berges-announcement-2022
    actions:
      - id: a-grow-hays-funding-2025
        date: "2025-08-14"
        body: |
          Hays Post reported that Berges said Grow Hays contacted the
          commission after a budget discussion and asked that $5,000 be
          reinstated. The commission later reinstated Grow Hays' $165,000
          request and maintained the Ellis County Historical Society
          allocation at $115,000.
        sourceIds:
          - s-hayspost-budget-draft-2025
      - id: a-ellis-road-cooperation-2025
        date: "2025-08-19"
        body: |
          Asked commissioners to sign a support letter for the City of Ellis
          road project cost-share grant, a concrete city-county cooperation
          action tied to road infrastructure.
        sourceIds:
          - s-minutes-08192025
      - id: a-professional-economic-development-role
        date: "2026-05-19"
        body: |
          Northwest Kansas Economic Innovation Center lists Berges as Business
          Services Director, describing work to support businesses across a
          26-county service area. This is professional background rather than
          an official county vote.
        sourceIds:
          - s-nwkeici-staff
    socialSignals: []
    gap:
      summary: |
        Berges's economic-development profile combines public office and
        professional work in regional business services. The reviewed record
        does not provide donor data or business-interest records that would
        support a conflict or influence claim. Keep the overlap descriptive
        unless later filings add specific evidence.
      evidenceIds:
        - a-grow-hays-funding-2025
        - a-professional-economic-development-role

  - id: i-public-communication-social-footprint
    title: "Public communication and limited campaign-controlled social footprint"
    stated:
      text: |
        Berges's accessible public message is preserved more through meeting
        records, candidate Q&A, and local news than through a verified current
        campaign-controlled social feed. His 2022 Q&A gave detailed answers on
        county operations, and a 2020 Hays city-commission article records him
        making a personal public-health plea while stopping short of asking
        for a city ordinance.
      sourceIds:
        - s-hayspost-berges-qa-2022
        - s-hayspost-city-mask-2020
    actions:
      - id: a-budget-hearing-public-response-2025
        date: "2025-09-09"
        body: |
          After the 2026 budget hearing, the official minutes say Berges
          thanked those who spoke, apologized for not being present in person,
          said he took their comments seriously, and invited the public to a
          September 23 work session.
        sourceIds:
          - s-minutes-09092025
      - id: a-city-mask-public-plea-2020
        date: "2020-07-10"
        body: |
          As a Hays city commissioner before his county term, Berges made a
          personal plea for mask-wearing during COVID-19 coverage while saying
          he was not at the point of asking fellow commissioners for a city
          ordinance.
        sourceIds:
          - s-hayspost-city-mask-2020
    socialSignals: []
    gap:
      summary: |
        No verified current candidate-controlled posts, comments, likes,
        follows, or engagement metrics were captured. A possible District 1
        Facebook page and a Hays Daily News Facebook reference remain leads,
        but they should not be used as evidence until content is directly
        captured.
      evidenceIds:
        - a-budget-hearing-public-response-2025

