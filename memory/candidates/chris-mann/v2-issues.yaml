  - evidenceRowId: em-chris-mann-00004
    classification: donor-organization-signal
    text: Mann's biography is not incidental to the campaign; it is the campaign's
      core credential. The "Meet Chris" page says he became a police officer at 21,
      was struck by a drunk driver during a 2002 traffic stop, later went to law school,
      became a Wyandotte County prosecutor, served on MADD's national board, worked
      at the Kansas Securities Commission, and opened Mann Law Firm in 2016 ([source](https://chrismannforkansas.com/meet-chris/)).
      The same page says he prosecuted cases "from DUI to murder" and later represented
      victims of drunk driving and their families ([source](https://chrismannforkansas.com/meet-chris/)).
      In a DAGA endorsement statement from 2022, Mann said, "I have spent my career
      serving Kansans and working to keep our families safe" ([source](https://dems.ag/daga-endorses-chris-mann-in-kansas-attorney-general-race/)).
