  - evidenceRowId: em-chris-mann-00003
    classification: documented-record
    text: Across the captured public record, Mann's dominant message is that the attorney
      general's office should be led by someone with law-enforcement and courtroom
      experience. His campaign homepage says he "dedicated his life to serving and
      protecting Kansas communities - first as a police officer and then as a prosecutor"
      and that he will "defend the Constitution, protect the rule of law and ensure
      Kansas families are safe" ([source](https://chrismannforkansas.com/)). His Facebook
      page describes him as a "Former police officer and prosecutor running for Kansas
      Attorney General to protect Kansans and keep our communities safe" ([harvest](social-harvest.md#facebook-and-instagram)).
      His Instagram bio uses the same frame, saying he is running "to serve our state,
      reduce violent crime, and protect our families" ([source](https://www.instagram.com/chrismannks/)).
    sourceIds:
    - mem-memory-candidates-chris-mann-in-their-own-words-md-l7
    sourceUrl: https://chrismannforkansas.com/
    sourceFile: memory/candidates/chris-mann/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-chris-mann-00006
    classification: documented-record
    text: Rule of law, constitutional rights, and family safety recur across platforms,
      but usually as part of the law-enforcement frame rather than as a long list
      of policy positions. His website says he will "defend the Constitution" and
      "protect the rule of law" ([source](https://chrismannforkansas.com/)). His indexed
      X campaign announcement said, "It's time for a law enforcement leader who puts
      people before politics. I'll protect your rights, keep families safe, and hold
      the powerful accountable" ([harvest](social-harvest.md#x--twitter-indexed-posts)).
      KCUR summarized his 2022 race as focused on state issues and his former police/prosecutor
      background, and reported Mann's argument that he would "bring some important
      stability" to the attorney general's office ([source](https://www.kcur.org/podcast/up-to-date/2022-10-21/kansas-attorney-general-candidate-chris-mann)).
