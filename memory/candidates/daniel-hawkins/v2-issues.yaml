candidateStatus:
  office: "Kansas Commissioner of Insurance"
  incumbent: false
  currentOffice: "Kansas House Speaker, District 100"
  party: "Republican"
  race: "Kansas Commissioner of Insurance, 2026"
  electionSlug: "kansas-insurance-2026"
  statusSummary: "Accessible official and government-adjacent sources support treating Hawkins as a Republican candidate for Kansas Commissioner of Insurance in 2026. Kansas SOS confirms the office is on the 2026 ballot and the June 1, 2026 filing deadline; KPDC lists Hawkins under Insurance Commissioner Candidates and his treasurer filing says office sought is Insurance Commissioner; a current Douglas County/state candidate filing PDF lists Daniel Hawkins (R) as filed on May 13, 2025 for the August 4, 2026 primary. The live SOS candidate-list endpoint was blocked in this environment."
  sourceIds:
    - s-sos-candidate-info-2026
    - s-kpdc-statewide-2026
    - s-kpdc-treasurer
    - s-county-candidate-filing
    - s-leg-profile

issueAreas:
  - id: i-insurance-affordability-regulation-pbm
    title: "Insurance Affordability / Regulation / Prescription Drug Costs"
    stated:
      text: "Hawkins' insurance campaign says he wants a fair and transparent insurance system, lower costs by increasing options, less red tape, a taxpayer-friendly Kansas Department of Insurance, and stronger action against insurance and securities fraud. The campaign also presents his 30 years in employee-benefits insurance as a core qualification."
      sourceIds:
        - s-campaign-insurance
        - s-leg-profile
    actions:
      - id: ae-insurance-1
        date: "2025-05-13"
        type: "candidate-filing"
        summary: "KPDC appointment-of-treasurer form lists Daniel Hawkins as a candidate for Insurance Commissioner with Mary Eisenhower as treasurer."
        sourceIds:
          - s-kpdc-treasurer
      - id: ae-insurance-2
        date: "2026-01-09"
        type: "campaign-finance-report"
        summary: "KPDC January 2026 report showed $417,305.07 in contributions/receipts, $33,295.22 in expenditures, $384,009.85 cash on hand, $565.68 in-kind, and a $10,000 candidate loan."
        sourceIds:
          - s-kpdc-jan2026
      - id: ae-insurance-3
        date: "2026-03-23"
        type: "legislation"
        summary: "SB 20, the Kansas consumer prescription protection and accountability act regulating pharmacy benefit managers, was signed by the governor; Kansas Legislature lists SB 360 as an associated bill."
        sourceIds:
          - s-leg-sb20
          - s-leg-sb360
      - id: ae-insurance-4
        date: "2026-03-26"
        type: "reported-legislative-process"
        summary: "KMUW/High Plains Public Radio reported SB 360 was the original PBM bill, that the PBM language was inserted into SB 20, and that the House passed the measure 104-17 after reporting that Hawkins had appeared set to keep SB 360 from moving."
        sourceIds:
          - s-kmuw-pbm
    socialSignals:
      - id: ss-insurance-1
        platform: "Campaign website"
        observation: "The active campaign site centers the insurance race around accessibility, affordability, more options, less regulation, a taxpayer-friendly department, and fraud/securities enforcement."
        observedAt: "2026-05-19"
        sourceIds:
          - s-campaign-insurance
        mappedToIssueId: i-insurance-affordability-regulation-pbm
      - id: ss-insurance-2
        platform: "Local prior social harvest"
        observation: "The May 11 logged-out harvest coded four of 27 public items as insurance affordability, consumer navigation, or anti-fraud, but direct platform engagement counts were limited."
        observedAt: "2026-05-11"
        sourceIds:
          - s-local-social-harvest
        mappedToIssueId: i-insurance-affordability-regulation-pbm
    gap:
      summary: "The campaign's lower-cost framing rests on deregulation/more options, while the public legislative record includes reported opposition to a PBM regulation bill that supporters framed as prescription-drug-cost relief. Present this as documented record contrast, not as motive."
      sourceIds:
        - s-campaign-insurance
        - s-leg-sb20
        - s-leg-sb360
        - s-kmuw-pbm
    blockers:
      - "Direct SOS statement-of-substantial-interest filing was not retrieved; secondary reporting says Hawkins received commissions from six insurance companies and was on payroll at Hawkins Group and Conrade Insurance Group."

  - id: i-campaign-finance-industry-funding
    title: "Campaign Finance / Industry Funding"
    stated:
      text: "Hawkins' campaign finance record shows a well-funded statewide campaign account for the insurance commissioner race. Issue-relevant contributors in the public KPDC report include insurance, health care, pharmaceutical/PBM, professional, business, labor, and public-affairs entities."
      sourceIds:
        - s-kpdc-statewide-2026
        - s-kpdc-jan2026
    actions:
      - id: ae-finance-1
        date: "2026-01-09"
        type: "finance-report"
        summary: "Filed the January 2026 receipts/expenditures report for the 2025 reporting period with $384,009.85 cash on hand."
        sourceIds:
          - s-kpdc-jan2026
      - id: ae-finance-2
        date: "2025-12-31"
        type: "donor-pattern"
        summary: "Public report includes contributions from NAIFA Kansas PAC, Shelter Insurance Kansas PAC, Pharmaceutical Care Management Association, UnitedHealth Group PAC, CVS Health, Blue Cross Blue Shield of Kansas City PAC, BlueCross BlueShield Kansas, Lockton Management, New Century Insurance Group, Kansas Pharmacists Association PAC, and other health/insurance-linked entities."
        sourceIds:
          - s-kpdc-jan2026
      - id: ae-finance-3
        date: "2025-05-13"
        type: "candidate-loan"
        summary: "Schedule D lists a $10,000 loan from Daniel Hawkins to the campaign."
        sourceIds:
          - s-kpdc-jan2026
    socialSignals: []
    gap:
      summary: "KPDC's page warns against copying contributor names for commercial use. This profile should cite totals and issue-relevant funding categories rather than reproduce bulk donor lists."
      sourceIds:
        - s-kpdc-statewide-2026
    blockers: []

  - id: i-taxes-budget-property-tax
    title: "Taxes / Budget / Property Tax"
    stated:
      text: "Hawkins' campaign lists tax-cut and budget-process accomplishments, including eliminating the food sales tax, eliminating state income tax on Social Security, lowering the state income tax, reducing the state portion of the property tax, and implementing a budgeting process the campaign says saved more than $210 million in the first year."
      sourceIds:
        - s-campaign-insurance
    actions:
      - id: ae-tax-1
        date: "2026-04"
        type: "legislation"
        summary: "Kansas Legislature page for HB 2043 describes a property-tax protest-petition bill and marks it vetoed by the governor."
        sourceIds:
          - s-leg-hb2043
      - id: ae-tax-2
        date: "2025-03-19"
        type: "vote"
        summary: "2025 vote record shows Hawkins voting yea on SB 35 emergency final action, a bill discontinuing state property tax levies for the Kansas educational building fund and state institutions building fund and financing them from the state general fund."
        sourceIds:
          - s-leg-vote-record-2025
      - id: ae-tax-3
        date: "2025-03-07"
        type: "vote"
        summary: "2025 vote record shows Hawkins voting yea on HB 2318 final action, a bill making future income and privilege tax rate decreases contingent on revenue triggers."
        sourceIds:
          - s-leg-vote-record-2025
    socialSignals:
      - id: ss-tax-1
        platform: "Local prior social harvest"
        observation: "The May 11 harvest coded six of 27 public items as taxes, budget, spending, or property-tax relief, including visible/publicly reported property-tax messaging."
        observedAt: "2026-05-11"
        sourceIds:
          - s-local-social-harvest
        mappedToIssueId: i-taxes-budget-property-tax
    gap:
      summary: "The campaign's specific $210 million budget-process savings claim was not independently audited in this pass."
      sourceIds:
        - s-campaign-insurance
    blockers: []

  - id: i-healthcare-medicaid-public-health
    title: "Healthcare / Medicaid / Public Health Authority"
    stated:
      text: "Hawkins' campaign says he has led the effort for more than a decade to prevent expansion of Obamacare in Kansas, and older local research captured his public opposition to Medicaid expansion."
      sourceIds:
        - s-campaign-insurance
        - s-local-raw-dump
    actions:
      - id: ae-health-1
        date: "2025-04-10"
        type: "vote"
        summary: "2025 vote record shows Hawkins voting yea on SB 29 veto consideration, a bill removing local health officers' authority to prohibit public gatherings for infectious or contagious disease control."
        sourceIds:
          - s-leg-vote-record-2025
      - id: ae-health-2
        date: "2026-03-23"
        type: "legislation"
        summary: "SB 20, signed by the governor, created the Kansas consumer prescription protection and accountability act regulating pharmacy benefit managers; this overlaps healthcare costs and insurance regulation."
        sourceIds:
          - s-leg-sb20
      - id: ae-health-3
        date: "2024-04-18"
        type: "reported-public-statement"
        summary: "Existing local raw dump captured Kansas Reflector coverage of Hawkins making the case against Medicaid expansion in Plainville; use as secondary context pending any official transcript."
        sourceIds:
          - s-local-raw-dump
    socialSignals:
      - id: ss-health-1
        platform: "Campaign website"
        observation: "The active campaign site includes anti-Medicaid/Obamacare-expansion language among legislative accomplishments rather than as a detailed insurance commissioner platform section."
        observedAt: "2026-05-19"
        sourceIds:
          - s-campaign-insurance
        mappedToIssueId: i-healthcare-medicaid-public-health
    gap:
      summary: "No current candidate-controlled detailed Medicaid, rural hospital, or insurance-market implementation plan was found beyond anti-expansion and lower-cost/more-options framing."
      sourceIds:
        - s-campaign-insurance
    blockers: []

  - id: i-abortion-family-gender-religious-liberty
    title: "Abortion / Family / Gender Policy / Religious Liberty"
    stated:
      text: "Hawkins' campaign describes him as pro-life and says legislative leadership helped override vetoes on pro-life bills, protect girls' sports, ban gender-transition surgeries on Kansas children, and pass religious-liberty/foster-care protections."
      sourceIds:
        - s-campaign-insurance
    actions:
      - id: ae-family-1
        date: "2025-04-10"
        type: "vote"
        summary: "2025 vote record shows Hawkins voting yea on HB 2062 veto consideration, a bill concerning child-support orders for unborn children and related tax/medical/pregnancy-expense provisions."
        sourceIds:
          - s-leg-vote-record-2025
      - id: ae-family-2
        date: "2025-02-18"
        type: "vote"
        summary: "2025 vote record shows Hawkins voting yea on SB 63 veto consideration, the Help Not Harm Act restricting gender-transition care for minors and related state funding, liability, and professional-discipline provisions."
        sourceIds:
          - s-leg-vote-record-2025
      - id: ae-family-3
        date: "2025-04-10"
        type: "vote"
        summary: "2025 vote record shows Hawkins voting yea on HB 2311 veto consideration, a foster-care placement/custody bill involving sincerely held religious or moral beliefs regarding sexual orientation or gender identity."
        sourceIds:
          - s-leg-vote-record-2025
      - id: ae-family-4
        date: "2026-01-28"
        type: "vote"
        summary: "Official SB 244 final-action roll call lists Hawkins in the yea column on a bill concerning biological sex, public multiple-occupancy private spaces, driver's licenses, birth certificates, and statutory gender definitions."
        sourceIds:
          - s-leg-sb244-final
    socialSignals:
      - id: ss-family-1
        platform: "Local prior social harvest"
        observation: "The May 11 harvest coded four of 27 public items as abortion, family, religious liberty, or gender policy, including campaign-site and prior embedded-feed observations."
        observedAt: "2026-05-11"
        sourceIds:
          - s-local-social-harvest
        mappedToIssueId: i-abortion-family-gender-religious-liberty
    gap:
      summary: "No current church affiliation was verified. Do not infer faith practice from policy positions or party label."
      sourceIds: []
    blockers: []

  - id: i-guns-election-immigration-covid
    title: "Guns / Election Integrity / Immigration / COVID Authority"
    stated:
      text: "Hawkins' campaign brands him as pro-gun and lists election-integrity veto overrides, a sanctuary-city ban, provisions supporting the Trump administration on illegal immigration, and ending COVID lockdowns as legislative accomplishments."
      sourceIds:
        - s-campaign-insurance
    actions:
      - id: ae-geic-1
        date: "2025-03-24"
        type: "vote"
        summary: "2025 vote record shows Hawkins voting yea on HB 2052 concurrence, a bill updating concealed-handgun licensing provisions and rules for off-duty law enforcement entering buildings while armed."
        sourceIds:
          - s-leg-vote-record-2025
      - id: ae-geic-2
        date: "2025-03-20"
        type: "vote"
        summary: "2025 vote record shows Hawkins voting yea on HB 2016 concurrence, a voter-roll/election administration bill involving deceased-voter removal, poll-worker citizenship/residency, and advance-voting application provisions."
        sourceIds:
          - s-leg-vote-record-2025
      - id: ae-geic-3
        date: "2025-03-20"
        type: "vote"
        summary: "2025 vote record shows Hawkins voting yea on HB 2020 concurrence, requiring quarterly reports on certain noncitizens issued driver's licenses."
        sourceIds:
          - s-leg-vote-record-2025
      - id: ae-geic-4
        date: "2025-04-10"
        type: "vote"
        summary: "2025 vote record shows Hawkins voting yea on SB 29 veto consideration, removing local health officer authority to prohibit gatherings for infectious or contagious disease control."
        sourceIds:
          - s-leg-vote-record-2025
    socialSignals:
      - id: ss-geic-1
        platform: "Campaign website"
        observation: "The campaign site presents guns, election integrity, immigration, and COVID authority as accomplishments in the same campaign identity frame as pro-Trump positioning."
        observedAt: "2026-05-19"
        sourceIds:
          - s-campaign-insurance
        mappedToIssueId: i-guns-election-immigration-covid
    gap:
      summary: "This pass did not independently verify every campaign-listed immigration/election/COVID accomplishment against final enacted bills; selected 2025 vote-record anchors are included."
      sourceIds:
        - s-campaign-insurance
        - s-leg-vote-record-2025
    blockers: []

  - id: i-governance-redistricting-legislative-leadership
    title: "Governance / Redistricting / Legislative Leadership"
    stated:
      text: "Hawkins is not running as an outsider; the official Legislature profile lists him as Speaker of the House and in multiple leadership roles. His campaign presents legislative leadership as proof he can run the insurance department."
      sourceIds:
        - s-leg-profile
        - s-campaign-insurance
    actions:
      - id: ae-governance-1
        date: "2026-01-06"
        type: "reported-leadership-position"
        summary: "KCUR/The Beacon reported Hawkins said congressional redistricting was a priority but that House Republicans were about 20 votes short of overriding a veto."
        sourceIds:
          - s-kcur-redistricting
      - id: ae-governance-2
        date: "2025-11-07"
        type: "reported-committee-assignments"
        summary: "Kansas Reflector/News From The States reported Hawkins stripped three Republican colleagues of committee chairmanships after they refused to sign a special-session petition for congressional redistricting."
        sourceIds:
          - s-kr-redistricting
    socialSignals:
      - id: ss-governance-1
        platform: "Local prior social harvest"
        observation: "Prior logged-out capture included a public X mirror/snippet saying 'Sharice Davids does not represent Kansas values. Time to redraw our maps! #ksleg'; direct X verification remains limited."
        observedAt: "2026-05-11"
        sourceIds:
          - s-local-social-harvest
        mappedToIssueId: i-governance-redistricting-legislative-leadership
    gap:
      summary: "Redistricting evidence is mostly secondary reporting and public social snippets, not a candidate issue page. Present as leadership/governance behavior, not insurance-policy substance."
      sourceIds:
        - s-kcur-redistricting
        - s-kr-redistricting
        - s-local-social-harvest
    blockers:
      - "Direct Kansas Reflector redistricting page returned 403 in this environment; search snippet and syndicated references were visible."

