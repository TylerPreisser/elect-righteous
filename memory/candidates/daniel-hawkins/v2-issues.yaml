    text: Recurring topics are taxes, budget restraint, anti-Kelly contrast, Trump
      alignment, abortion, gun rights, family/gender policy, election integrity, immigration
      enforcement, and insurance affordability through deregulation. In April 2026,
      his public messaging leaned heavily into property taxes. After Kelly vetoed
      HB 2043, [WIBW quoted him](https://www.wibw.com/2026/04/27/gov-kelly-vetoes-property-tax-protest-bill-kansas-house-speaker-responds/)
