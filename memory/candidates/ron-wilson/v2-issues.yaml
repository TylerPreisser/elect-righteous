    title: "Bond facilities and capital projects"
    stated:
      text: |
        Wilson has consistently framed facility investment as a student/community investment and has described modern buildings, capacity, maintenance, career/technical spaces, auditorium space, and long-range capital needs as central district priorities.
      sourceIds:
