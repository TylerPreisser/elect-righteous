  - evidenceRowId: em-ron-wilson-00003
    classification: documented-record
    text: 'Wilson''s public message is overwhelmingly administrative: student needs,
      facilities, bond execution, mental-health supports, public-school funding, and
      day-to-day district operations. The official USD 489 staff directory lists him
      as Superintendent and Administrator, and the USD 489 public board portal lists
      him as Superintendent in meeting categories. ([USD 489 staff](https://www.usd489.com/staff?org=usd-489&page_no=2),
      [USD 489 board portal](https://usd489.community.highbond.com/portal/members.aspx?id=18))'
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l5
    sourceUrl: https://www.usd489.com/staff?org=usd-489&page_no=2
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:5
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-ron-wilson-00007
    classification: documented-record
    text: 'By February 2022, Wilson''s bond message had become more specific: space,
      career and technical education, an auditorium, maintenance, school choice, local
      contractors, and long-term investment. He told the board the proposal was about
      district space needs, said the high school career-tech environment could be
      better, argued the community needed an auditorium students could be proud of,
      and described the bond as an investment that could carry for 50 to 100 years.
      ([USD 489 / Hays Post](https://www.usd489.com/article/651221))'
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l13
    sourceUrl: https://www.usd489.com/article/651221
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:13
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-ron-wilson-00008
    classification: documented-record
    text: His public mental-health message is strongest in official testimony to the
      Kansas Legislature. Wilson described how Herington and then Hays participated
      in the Mental Health Intervention Team program, said 155 Hays High and Hays
      Middle School students used the program in the 2020-21 school year, and listed
      goals around academic performance, attendance, internalizing symptoms, and externalizing
      symptoms. He urged better outside referrals, summer therapy and case-management
      availability, mentoring for new districts, telemedicine access, pediatric integration,
      workforce solutions, and treating youth mental health as urgent. ([Kansas Legislature
      testimony](https://www.kslegislature.gov/li/b2021_22/committees/ctte_spc_2021_ks_mental_health_modern_1/documents/testimony/20211028_14.pdf))
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l15
    sourceUrl: https://www.kslegislature.gov/li/b2021_22/committees/ctte_spc_2021_ks_mental_health_modern_1/documents/testimony/20211028_14.pdf
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:15
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-ron-wilson-00010
    classification: documented-record
    text: After the bond passed, Wilson's public message shifted to implementation
      and defense of the project structure. In March 2025, when board members pushed
      for an additional project manager, Wilson argued that Nabholz already served
      as construction manager at risk, that the district administration team was acting
      as owner representatives, and that third-party inspections added oversight.
      He rejected claims that he did not know what he was doing and pointed to low
      change orders on the high school project. ([Hays Post](https://hayspost.com/posts/e4ec7011-734d-4c18-ab28-c5b38d236126))
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l19
    sourceUrl: https://hayspost.com/posts/e4ec7011-734d-4c18-ab28-c5b38d236126
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:19
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ron-wilson-00016
    classification: documented-record
    text: On state policy, the accessible March 2026 local summary shows Wilson defending
      public-school funding channels. Citizen Journal reported that he warned the
      Kansas Senate budget removed funding from the mental-health intervention program,
      said inadequate special-education funding forces districts to pull from general
      funds, and flagged HB 2468 private-school tax credits as a concern because they
      could divert public tax dollars away from public schools. ([Citizen Journal](https://www.citizenjournal.us/takeaways-from-hays-usd-489-education-board-meeting/))
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l31
    sourceUrl: https://www.citizenjournal.us/takeaways-from-hays-usd-489-education-board-meeting/
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:31
    confidence: likely
    useDecision: use
