      - id: a-summer-projects-2026
        date: "2026-03-23"
        body: |
          Wilson outlined 2026 summer construction and capital projects beyond the bond work, including Felten, O'Loughlin, ADA access, parking, HVAC, playground equipment, and technology rotation.
