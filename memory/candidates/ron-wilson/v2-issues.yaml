        - s-usd489-bond-to-voters-2022
        - s-hayspost-opinion-2025
    actions:
      - id: a-bond-survey-2021
        date: "2021-04-12"
        body: |
          Wilson publicly discussed survey results as an early step toward a renewed bond conversation and tied facilities to student pride and community investment.
        sourceIds:
          - s-usd489-bond-survey-2021
      - id: a-bond-to-voters-2022
        date: "2022-02-07"
        body: |
          Wilson presented the $143.5 million bond proposal around district capacity, career/technical education, auditorium needs, and maintenance backlogs as the board sent it to voters.
        sourceIds:
          - s-usd489-bond-to-voters-2022
      - id: a-project-manager-motion-failed-2025
        date: "2025-03-24"
        body: |
          A motion to explore hiring a separate bond project manager failed 3-4; Wilson defended the existing Nabholz/administration/third-party-inspection oversight structure in related coverage.
        sourceIds:
          - s-highbond-mar24-2025-minutes
          - s-hayspost-project-manager-2025
      - id: a-wilson-opinion-bond-defense-2025
        date: "2025-03-28"
        body: |
          Wilson published an attributed opinion defending the bond projects and arguing that the district should keep building the facilities students, staff, and community deserve.
