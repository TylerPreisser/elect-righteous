  evidenceItems:
  - evidenceRowId: em-ron-wilson-00004
    classification: candidate-stated
    text: His earliest located Hays superintendent profile, from February 2019, framed
      his approach around students and consensus. Wilson said he centered his work
      on what was best for kids, described himself as a consensus builder on a possible
      bond, supported long-range facilities planning, emphasized teacher relationships
      and teacher pay, and said he wanted a positive culture where staff, students,
      and parents brought their best every day. ([Hays Post archive](https://archive.hayspost.com/2019/02/page/67/))
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l7
    sourceUrl: https://archive.hayspost.com/2019/02/page/67/
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ron-wilson-00006
    classification: candidate-stated
    text: Facilities are the dominant thread in his public record. In April 2021,
      Wilson said a facilities survey could show whether residents were ready to look
      at another bond attempt. He argued that facilities affect first impressions
      of the community and that investing in buildings helps students feel valued.
      He also said the community needed to think about building for the future and
      the next generation. ([USD 489 / Hays Post](https://www.usd489.com/article/437110))
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l11
    sourceUrl: https://www.usd489.com/article/437110
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:11
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-ron-wilson-00011
    classification: candidate-stated
    text: Wilson's signed March 2025 Hays Post opinion response is one of the clearest
      first-person statements in the set. He said people sometimes focus so hard on
      problems that they miss good things, defended the bond projects as creating
      a better future for students, staff, and the community, and said his district
      leadership responsibility was to give them what they deserved. He repeated the
      idea that USD 489 had to stop settling for the schools and facilities it had.
      ([Hays Post](https://hayspost.com/posts/18d3a237-b1c0-45a5-886e-980bb0c81483))
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l21
    sourceUrl: https://hayspost.com/posts/18d3a237-b1c0-45a5-886e-980bb0c81483
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:21
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ron-wilson-00012
    classification: candidate-stated
    text: The same facilities frame continued at the August 2025 ribbon cutting for
      the new Hays High School. Wilson said his goal was to give students, staff,
      and community a modern, safe, inspiring 5A school and said the Hays monument
      represented community investment in kids. ([Hays Post](https://hayspost.com/posts/b20dc400-848a-4e10-bda4-36f5dad6d626))
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l23
    sourceUrl: https://hayspost.com/posts/b20dc400-848a-4e10-bda4-36f5dad6d626
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:23
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ron-wilson-00013
    classification: candidate-stated
    text: On capital spending, Wilson tends to argue from schedule, readiness, and
      operational need. In February 2025, he said the district had planned for expenses
      created by students and staff moving into new buildings and had enough capital-outlay
      funds with contingency built in. In October 2025, he said Hays Middle School
      furniture needed to be purchased promptly so the school could open to students
      on time. In December 2025, Tiger Media Network reported that he called Felten
      asbestos abatement timing an emergency because delay would disrupt the renovation
      schedule. ([Hays Post, Feb. 2025](https://hayspost.com/posts/4c6383bb-a3d5-40fe-9d6e-f35e54674e93),
      [Hays Post, Oct. 2025](https://hayspost.com/posts/42a7f866-c127-423f-80ac-8b3e620f80f4),
      [Tiger Media Network](https://tigermedianet.com/?p=93176))
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l25
    sourceUrl: https://hayspost.com/posts/4c6383bb-a3d5-40fe-9d6e-f35e54674e93
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:25
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ron-wilson-00014
    classification: candidate-stated
    text: On fees and classroom materials, Wilson opposed another school-fee reduction
      in April 2025. Hays Post reported that he said earlier fee reductions had lowered
      the money available for textbooks and classroom materials, with a new English
      curriculum adoption planned and a much smaller carryover expected. ([Hays Post](https://hayspost.com/posts/b76e200e-de44-4b35-a99c-791e79ca07be))
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l27
    sourceUrl: https://hayspost.com/posts/b76e200e-de44-4b35-a99c-791e79ca07be
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:27
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ron-wilson-00015
    classification: candidate-stated
    text: On bathrooms, vandalism, and social-media claims, Wilson's public stance
      is managerial and skeptical of online escalation. Hays Post reported that he
      said all schools deal with bathroom vandalism, that students lose privileges
      when they misuse spaces, and that the high school would clean bathrooms twice
      daily. Tiger Media Network reported that he said monitoring bathrooms for eight
      hours a day was nearly impossible and warned that Facebook claims exaggerated
      the scope. ([Hays Post](https://hayspost.com/posts/7b63aeb8-e2d2-40a4-af96-5e92884d3ede),
      [Tiger Media Network](https://tigermedianet.com/?p=96863))
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l29
    sourceUrl: https://hayspost.com/posts/7b63aeb8-e2d2-40a4-af96-5e92884d3ede
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:29
    confidence: likely
    useDecision: use
  - evidenceRowId: em-ron-wilson-01119
    classification: candidate-stated
    text: 'USD 489 / Hays Post article on Westside and mental-health/behavior supports,
      April 28, 2021. Source: https://www.usd489.com/article/448824'
    sourceIds:
    - mem-memory-candidates-ron-wilson-social-harvest-md-l75
    sourceUrl: https://www.usd489.com/article/448824
    sourceFile: memory/candidates/ron-wilson/social-harvest.md:75
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-ron-wilson-00003
    classification: documented-record
    text: 'Wilson''s public message is overwhelmingly administrative: student needs,
      facilities, bond execution, mental-health supports, public-school funding, and
      day-to-day district operations. The official USD 489 staff directory lists him
      as Superintendent and Administrator, and the USD 489 public board portal lists
      him as Superintendent in meeting categories. ([USD 489 staff](https://www.usd489.com/staff?org=usd-489&page_no=2),
      [USD 489 board portal](https://usd489.community.highbond.com/portal/members.aspx?id=18))'
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l5
    sourceUrl: https://www.usd489.com/staff?org=usd-489&page_no=2
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:5
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-ron-wilson-00007
    classification: documented-record
    text: 'By February 2022, Wilson''s bond message had become more specific: space,
      career and technical education, an auditorium, maintenance, school choice, local
      contractors, and long-term investment. He told the board the proposal was about
      district space needs, said the high school career-tech environment could be
      better, argued the community needed an auditorium students could be proud of,
      and described the bond as an investment that could carry for 50 to 100 years.
      ([USD 489 / Hays Post](https://www.usd489.com/article/651221))'
    sourceIds:
    - mem-memory-candidates-ron-wilson-in-their-own-words-md-l13
    sourceUrl: https://www.usd489.com/article/651221
    sourceFile: memory/candidates/ron-wilson/in-their-own-words.md:13
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-ron-wilson-00008
    classification: documented-record
    text: His public mental-health message is strongest in official testimony to the
      Kansas Legislature. Wilson described how Herington and then Hays participated
      in the Mental Health Intervention Team program, said 155 Hays High and Hays
      Middle School students used the program in the 2020-21 school year, and listed
      goals around academic performance, attendance, internalizing symptoms, and externalizing
      symptoms. He urged better outside referrals, summer therapy and case-management
      availability, mentoring for new districts, telemedicine access, pediatric integration,
      workforce solutions, and treating youth mental health as urgent. ([Kansas Legislature
      testimony](https://www.kslegislature.gov/li/b2021_22/committees/ctte_spc_2021_ks_mental_health_modern_1/documents/testimony/20211028_14.pdf))
