issues:
  - id: i-administrative-role-board-governance
    title: "Administrative role, board governance, and accountability"
    stated:
      text: |
        Wilson's own and district-controlled public record presents him as superintendent: an appointed administrator who recommends, reports, manages, and communicates through an elected board. The district's official goal language emphasizes student achievement, effective staff, positive communications, and effective resource management.
      sourceIds:
        - s-usd489-staff
        - s-usd489-highbond-members
        - s-highbond-jan19-2026-minutes
    actions:
      - id: a-hired-superintendent-2019
        date: "2019-02-11"
        body: |
          USD 489 board approval made Wilson the incoming superintendent effective July 1, 2019, after a search process.
        sourceIds:
          - s-guidon-hiring-2019
          - s-hayspost-2019-profile
      - id: a-current-superintendent-listed-2026
        date: "2026-05-19"
        body: |
          Official USD 489 staff and meeting-roster sources list Wilson as Superintendent, confirming his current administrative role.
        sourceIds:
          - s-usd489-staff
          - s-usd489-highbond-members
      - id: a-personnel-nepotism-debate-2023
        date: "2023-04-24"
        body: |
          The board debated hiring Wilson's wife as a teacher; Hays Post reported the nepotism policy required disclosure and did not specifically prohibit administrators' relatives from district employment.
        sourceIds:
          - s-highbond-apr24-2023-agenda
          - s-hayspost-nepotism-2023
      - id: a-admin-contracts-defended-2026
        date: "2026-03-10"
        body: |
          During administrator-contract discussion, Wilson defended the administrative team and opposed voting on each administrator individually; the board extended administrator contracts in a contested vote.
        sourceIds:
          - s-tiger-admin-contracts-2026
          - s-citizenjournal-march-2026
    socialSignals:
      - id: ss-official-live-feed-not-campaign
        platform: "USD 489 official live feed"
        observation: |
          District live-feed posts attributed to Wilson show official operational communications, not campaign activity or personal social engagement.
        observedAt: "2026-05-19"
        sourceIds:
          - s-usd489-live-feed-2020
        mappedToIssueId: i-administrative-role-board-governance
    gap:
      summary: |
        The profile must avoid a candidate-campaign frame: Wilson's public status is appointed superintendent, and board members are the elected actors.
      evidenceIds:
        - a-current-superintendent-listed-2026

