  - evidenceRowId: em-bobbi-dreiling-00003
    classification: documented-record
    text: Dreiling's public voice is administrative rather than ideological. The official
      Ellis County clerk and election pages present her as the county clerk and election
      official responsible for elections, voter registration, tax-roll work, commission
      minutes, licenses, passports, accounts payable, levies, and other county paperwork.
      That official footprint is the clearest current public presence; no verified
      campaign website or active public social feed surfaced in the logged-out capture.
      ([clerk page](https://www.ellisco.net/93/Clerk), [election page](https://www.ellisco.net/425/Election))
    sourceIds:
    - mem-memory-candidates-bobbi-dreiling-in-their-own-words-md-l5
    sourceUrl: https://www.ellisco.net/93/Clerk
