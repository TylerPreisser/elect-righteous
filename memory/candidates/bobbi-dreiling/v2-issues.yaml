  - evidenceRowId: em-bobbi-dreiling-01929
    classification: public-controversy
    text: Dreiling is an election administrator in an era when election administration
      is intensely politicized. Her refusal to place a polling location at FHSU --
      despite formal petitions from students, the ACLU, university administration,
      and campus police -- is her most controversial decision. The "69 registered
      voters on campus" defense ignores the broader population of students who live
      off-campus but near FHSU. Her election security camera installation and township
      consolidation show competent administration. The 3,800 misprinted ballots occurred
      on her watch as deputy clerk -- not directly her fault, but she was in the office
      when it happened. Her 77-23% re-election margin in 2024 shows the controversy
      hasn't cost her Republican voter support.
    sourceIds:
