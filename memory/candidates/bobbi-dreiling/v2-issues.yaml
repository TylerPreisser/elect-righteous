  - evidenceRowId: em-bobbi-dreiling-02983
    classification: documented-record
    text: 'narrative: "_A summary of what Bobbi Dreiling has publicly said, published,
      linked, or been directly quoted saying across official Ellis County pages, public
      candidate/forum coverage, professional directories, county commission packets,
      and accessible references to her candidate Facebook page. Drawn from public
      captures and indexed sources from September 29, 2020 through May 11, 2026. We
      report patterns; we do not interpret intent._\n\nDreiling''s public voice is
      administrative rather than ideological. The official Ellis County clerk and
      election pages present her as the county clerk and election official responsible
      for elections, voter registration, tax-roll work, commission minutes, licenses,
      passports, accounts payable, levies, and other county paperwork. That official
      footprint is the clearest current public presence; no verified campaign website
      or active public social feed surface…'
