  evidenceItems:
  - evidenceRowId: em-bobbi-dreiling-00005
    classification: candidate-stated
    text: The most repeated claim in her reelection messaging is that the office is
      accurate and secure. Dreiling told Hays Post she had run eight elections with
      "perfect counts, audits and recounts." At an October 2024 forum covered by Tiger
      Media Network, she said Ellis County elections had been free, fair, and secure,
      and that her tax and value-setting work had been done with 100 percent accuracy.
      ([Hays Post](https://hayspost.com/posts/64efa3e4-3296-4e5c-897f-8417a78e7fc3),
      [Tiger Media Network](https://tigermedianet.com/?p=82423))
    sourceIds:
    - mem-memory-candidates-bobbi-dreiling-in-their-own-words-md-l9
    sourceUrl: https://hayspost.com/posts/64efa3e4-3296-4e5c-897f-8417a78e7fc3
    sourceFile: memory/candidates/bobbi-dreiling/in-their-own-words.md:9
    confidence: likely
    useDecision: use
  - evidenceRowId: em-bobbi-dreiling-00009
    classification: candidate-stated
    text: Her voting-access message is narrower than her critics' framing. Dreiling
      says her office provides advance voting, mail ballots, Saturday early voting,
      student voter information, and voter notifications. In Hays Post, she said she
      would work with students to let them know how easy it is to vote in Ellis County,
      but she also said she did not think there was anything she could do to increase
      turnout. ([source](https://hayspost.com/posts/64efa3e4-3296-4e5c-897f-8417a78e7fc3))
    sourceIds:
    - mem-memory-candidates-bobbi-dreiling-in-their-own-words-md-l17
    sourceUrl: https://hayspost.com/posts/64efa3e4-3296-4e5c-897f-8417a78e7fc3
    sourceFile: memory/candidates/bobbi-dreiling/in-their-own-words.md:17
    confidence: likely
    useDecision: use
  - evidenceRowId: em-bobbi-dreiling-00008
    classification: candidate-stated
    text: The FHSU polling-location dispute is the most visible conflict around her
      office. Dreiling's own rationale focuses on turnout numbers, cost, ADA compliance,
      parking/navigation, and service to the full precinct rather than students alone.
      She told Kansas Reflector, "I also have a whole community that I have to look
      at," and told Hays Post that the numbers did not support spending taxpayer dollars
      on a polling place exactly on campus. She also said she would always relook
      at things after reviewing polling numbers. ([Kansas Reflector](https://kansasreflector.com/2023/11/06/students-county-clerk-embroiled-in-monthslong-clash-over-fort-hays-polling-location/),
      [Hays Post](https://hayspost.com/posts/64efa3e4-3296-4e5c-897f-8417a78e7fc3))
    sourceIds:
    - mem-memory-candidates-bobbi-dreiling-in-their-own-words-md-l15
    sourceUrl: https://kansasreflector.com/2023/11/06/students-county-clerk-embroiled-in-monthslong-clash-over-fort-hays-polling-location/
    sourceFile: memory/candidates/bobbi-dreiling/in-their-own-words.md:15
    confidence: likely
    useDecision: use-with-caveat
    caveat: Usable with explicit caveat because the raw evidence notes a source limitation,
      preliminary status, or verification gap.
