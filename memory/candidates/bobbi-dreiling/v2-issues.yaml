  - evidenceRowId: em-bobbi-dreiling-00004
    classification: documented-record
    text: Her recurring self-description is experience. In her 2020 Hays Post candidate
      profile, Dreiling said she was running because she knew the office, believed
      the clerk job required experience, enjoyed serving the public, and had worked
      underneath the prior clerk since 2013. In 2024, she again emphasized the same
      institutional argument, saying she had learned the July and November abstracts,
      mill levies, and revenue-neutral-rate work before becoming clerk. ([2020 profile](https://hayspost.com/posts/3d32625b-57dc-4a18-9152-1013ddb13531),
      [2024 profile](https://hayspost.com/posts/64efa3e4-3296-4e5c-897f-8417a78e7fc3))
    sourceIds:
    - mem-memory-candidates-bobbi-dreiling-in-their-own-words-md-l7
    sourceUrl: https://hayspost.com/posts/3d32625b-57dc-4a18-9152-1013ddb13531
    sourceFile: memory/candidates/bobbi-dreiling/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-bobbi-dreiling-00006
    classification: documented-record
    text: Her election-security argument is procedural and concrete. She points to
      paper ballots, post-election audits, matching poll-pad data with ballots and
      result media, training poll workers, checking election equipment before and
      after elections, counting ballots before they leave the clerk's office, and
      using cameras at the ballot drop box, ballot-counting room, and equipment room.
      In 2020, she also said she was a member of Election Infrastructure Information
      Sharing through the Department of Homeland Security. ([2020 profile](https://hayspost.com/posts/3d32625b-57dc-4a18-9152-1013ddb13531),
      [2024 profile](https://hayspost.com/posts/64efa3e4-3296-4e5c-897f-8417a78e7fc3))
    sourceIds:
    - mem-memory-candidates-bobbi-dreiling-in-their-own-words-md-l11
    sourceUrl: https://hayspost.com/posts/3d32625b-57dc-4a18-9152-1013ddb13531
    sourceFile: memory/candidates/bobbi-dreiling/in-their-own-words.md:11
    confidence: likely
    useDecision: use
  - evidenceRowId: em-bobbi-dreiling-00007
    classification: documented-record
    text: Dreiling's public remarks on election fraud are direct. At the 2024 forum,
      she said she had no reason to believe there was election fraud because she had
      no proof. She then invited people to come talk with her so she could show them
