  - evidenceRowId: em-bobbi-dreiling-01424
    classification: faith-community-record
    text: Hart is the most unconventional candidate in the Democratic primary. A career
      federal prosecutor who switched parties twice in one month, running on a blunt
      "electability" argument centered on his identity as a straight white Christian
      male in Kansas. His wife's quip has become his most quoted line. His lack of
      political experience or campaign infrastructure is either refreshingly authentic
      or dangerously unprepared -- depends on the voter. His 21-year record prosecuting
      child predators is his strongest credential.
