      consolidation as a taxpayer savings and described the offsite drop boxes in
      Ellis and Victoria as too costly to keep open under the required security procedures
      when they were not being used. ([source](https://hayspost.com/posts/64efa3e4-3296-4e5c-897f-8417a78e7fc3))
