- issueNumber: 10
  title: Election integrity / voting / courts
  summary: 'Election integrity / voting / courts: 39 selected evidence items from
    623 mapped rows. Public URL-backed rows: 108.'
  evidenceItems:
  - evidenceRowId: em-bobbi-dreiling-00009
    classification: candidate-stated
    text: Her voting-access message is narrower than her critics' framing. Dreiling
      says her office provides advance voting, mail ballots, Saturday early voting,
      student voter information, and voter notifications. In Hays Post, she said she
      would work with students to let them know how easy it is to vote in Ellis County,
      but she also said she did not think there was anything she could do to increase
      turnout. ([source](https://hayspost.com/posts/64efa3e4-3296-4e5c-897f-8417a78e7fc3))
    sourceIds:
    - mem-memory-candidates-bobbi-dreiling-in-their-own-words-md-l17
    sourceUrl: https://hayspost.com/posts/64efa3e4-3296-4e5c-897f-8417a78e7fc3
    sourceFile: memory/candidates/bobbi-dreiling/in-their-own-words.md:17
    confidence: likely
    useDecision: use
  - evidenceRowId: em-bobbi-dreiling-00118
    classification: candidate-stated
    text: 'Do not overuse social: Facebook references should be mapped only where
      they illuminate a documented issue, such as the public dispute over voting eligibility
      information. Do not infer beliefs from platform absence.'
    sourceIds:
    - mem-memory-candidates-bobbi-dreiling-raw-dump-v2-md-l179
    sourceUrl:
    sourceFile: memory/candidates/bobbi-dreiling/raw-dump-v2.md:179
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-bobbi-dreiling-02427
    classification: candidate-stated
    text: '"text": "Dreiling says her office offers advance voting, mail ballots,
      Saturday early voting, voter notifications, voter information for students,
      and VoterView tools. On the FHSU polling-location dispute, she has cited turnout,
      cost, ADA compliance, parking/navigation, and the need to serve the whole precinct.",'
    sourceIds:
    - mem-memory-candidates-bobbi-dreiling-v2-issues-yaml-l273
    - mem-ui-src-data-v2-bobbi-dreiling-ts-l95
    sourceUrl:
    sourceFile: ui/src/data/v2/bobbi-dreiling.ts:95
    confidence: unknown
    useDecision: background-only
  - evidenceRowId: em-bobbi-dreiling-00003
    classification: documented-record
    text: Dreiling's public voice is administrative rather than ideological. The official
      Ellis County clerk and election pages present her as the county clerk and election
      official responsible for elections, voter registration, tax-roll work, commission
      minutes, licenses, passports, accounts payable, levies, and other county paperwork.
      That official footprint is the clearest current public presence; no verified
      campaign website or active public social feed surfaced in the logged-out capture.
      ([clerk page](https://www.ellisco.net/93/Clerk), [election page](https://www.ellisco.net/425/Election))
    sourceIds:
    - mem-memory-candidates-bobbi-dreiling-in-their-own-words-md-l5
    sourceUrl: https://www.ellisco.net/93/Clerk
    sourceFile: memory/candidates/bobbi-dreiling/in-their-own-words.md:5
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-bobbi-dreiling-00004
    classification: documented-record
    text: Her recurring self-description is experience. In her 2020 Hays Post candidate
      profile, Dreiling said she was running because she knew the office, believed
      the clerk job required experience, enjoyed serving the public, and had worked
      underneath the prior clerk since 2013. In 2024, she again emphasized the same
      institutional argument, saying she had learned the July and November abstracts,
      mill levies, and revenue-neutral-rate work before becoming clerk. ([2020 profile](https://hayspost.com/posts/3d32625b-57dc-4a18-9152-1013ddb13531),
      [2024 profile](https://hayspost.com/posts/64efa3e4-3296-4e5c-897f-8417a78e7fc3))
    sourceIds:
    - mem-memory-candidates-bobbi-dreiling-in-their-own-words-md-l7
    sourceUrl: https://hayspost.com/posts/3d32625b-57dc-4a18-9152-1013ddb13531
    sourceFile: memory/candidates/bobbi-dreiling/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-bobbi-dreiling-00006
    classification: documented-record
    text: Her election-security argument is procedural and concrete. She points to
      paper ballots, post-election audits, matching poll-pad data with ballots and
      result media, training poll workers, checking election equipment before and
      after elections, counting ballots before they leave the clerk's office, and
      using cameras at the ballot drop box, ballot-counting room, and equipment room.
