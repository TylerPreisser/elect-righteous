    title: "Role of the County Attorney and Law Enforcement"
    stated:
      text: "Cunningham frames the county attorney's role as enforcing Kansas law as written rather than deciding which laws should exist. In his clearest public interview, he said the Legislature decides what is criminal and that he does not choose which laws matter."
      sourceIds:
        - "s-hayspost-2025-profile"
    actions:
      - id: "ae-official-priority-list"
        date: "2025-2026"
        summary: "The official county attorney page sets the office priority order around deaths, child victims including CINC cases, sex crimes, violent person crimes, property crimes, and drug distribution crimes, with goals of prosecuting as many cases as possible and maximizing efficiency."
        sourceIds:
          - "s-ellis-attorney-page"
          - "s-ellis-2025-budget-book"
        importance: "Shows the office's governing priority list in official county text."
      - id: "ae-harwick-sentencing"
        date: "2026-03-26"
        summary: "In a criminal-threat/aggravated-assault sentencing case, Cunningham opposed probation and argued that private retaliation should not replace established investigative and court systems."
