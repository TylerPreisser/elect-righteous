    classification: documented-record
    text: 'Cunningham''s accessible public message is not built around a campaign
      website or a campaign social feed. The official Ellis County Attorney page is
      the clearest current source: it lists Aaron J. Cunningham as county attorney
      from 2025 to present and frames the office around enforcing Kansas law, public
      safety, truth-seeking, fair and impartial justice, and efficient use of taxpayer
      resources. Its stated priorities start with deaths, child victims, child-in-need-of-care
      cases, sex crimes, violent person crimes, property crimes, and drug distribution
      crimes. ([Ellis County](https://www.ellisco.net/92/Attorney))'
    sourceIds:
    - mem-memory-candidates-aaron-cunningham-in-their-own-words-md-l5
    sourceUrl: https://www.ellisco.net/92/Attorney
