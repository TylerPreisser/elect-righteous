  - evidenceRowId: em-aaron-cunningham-00009
    classification: donor-organization-signal
    text: Rural legal capacity is a recurring professional theme. Kansas Courts lists
      Cunningham, attorney, Hays, on the Kansas Rural Justice Initiative Committee
      roster, and the final report search result identifies him as a newer-attorney
      panelist during a Dodge City listening session. In the Hays Post profile, he
      connected the shortage of rural attorneys and qualified defense counsel to slower
      cases, longer jail waits, and pressure on courts across western Kansas. ([Kansas
      Courts](https://kscourts.gov/About-the-Courts/Court-Administration/Committees/Kansas-Rural-Justice-Initiative-Committee),
      [report PDF](https://www.kscourts.gov/KSCourts/media/KsCourts/court%20administration/Rural-Justice-Initiative/Kansas-Rural-Justice-Initiative-Committee-Final-Report.pdf),
      [Hays Post](https://hayspost.com/posts/7ccb3a8f-a8c6-4baa-9767-cf155c00f4a1))
    sourceIds:
