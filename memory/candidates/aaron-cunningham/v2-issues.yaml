- issueNumber: 10
  title: Election integrity / voting / courts
  summary: 'Election integrity / voting / courts: 31 selected evidence items from
    562 mapped rows. Public URL-backed rows: 72.'
  evidenceItems:
  - evidenceRowId: em-aaron-cunningham-00003
    classification: documented-record
    text: 'Cunningham''s accessible public message is not built around a campaign
      website or a campaign social feed. The official Ellis County Attorney page is
      the clearest current source: it lists Aaron J. Cunningham as county attorney
      from 2025 to present and frames the office around enforcing Kansas law, public
      safety, truth-seeking, fair and impartial justice, and efficient use of taxpayer
      resources. Its stated priorities start with deaths, child victims, child-in-need-of-care
      cases, sex crimes, violent person crimes, property crimes, and drug distribution
      crimes. ([Ellis County](https://www.ellisco.net/92/Attorney))'
    sourceIds:
    - mem-memory-candidates-aaron-cunningham-in-their-own-words-md-l5
    sourceUrl: https://www.ellisco.net/92/Attorney
    sourceFile: memory/candidates/aaron-cunningham/in-their-own-words.md:5
    confidence: confirmed
    useDecision: use
  - evidenceRowId: em-aaron-cunningham-00004
    classification: documented-record
    text: The 2024 campaign footprint is sparse. Hays Post listed "Aaron J Cunningham"
      as the Republican candidate for Ellis County Attorney, and IKE Lab's 2024 results
      show him receiving 11,379 votes against 146 write-ins. ([Hays Post](https://hayspost.com/posts/71fc45b0-c8c1-41af-87da-6b86c8a8170b),
      [IKE Lab](https://www.ike-lab.com/complete_elex_2024_gen_cotwp_Ellis.html))
      No candidate-controlled campaign website surfaced. The current project data
      points his campaign website to mann.house.gov/about, which is unrelated and
      was not used.
    sourceIds:
    - mem-memory-candidates-aaron-cunningham-in-their-own-words-md-l7
    sourceUrl: https://hayspost.com/posts/71fc45b0-c8c1-41af-87da-6b86c8a8170b
    sourceFile: memory/candidates/aaron-cunningham/in-their-own-words.md:7
    confidence: likely
    useDecision: use
  - evidenceRowId: em-aaron-cunningham-00005
    classification: documented-record
    text: His most direct issue messaging came after he took office. In a February
      2025 Hays Post profile, Cunningham described the job as a return to his hometown
      and said he inherited likely hundreds of backlogged cases. He emphasized that
      Kansas law, not his personal preference, decides what is criminal, and he announced
      that the office would resume marijuana and hemp-derived THC enforcement that
      had been paused or handled unevenly. ([Hays Post](https://hayspost.com/posts/7ccb3a8f-a8c6-4baa-9767-cf155c00f4a1))
    sourceIds:
    - mem-memory-candidates-aaron-cunningham-in-their-own-words-md-l9
    sourceUrl: https://hayspost.com/posts/7ccb3a8f-a8c6-4baa-9767-cf155c00f4a1
    sourceFile: memory/candidates/aaron-cunningham/in-their-own-words.md:9
    confidence: likely
    useDecision: use
  - evidenceRowId: em-aaron-cunningham-00007
    classification: documented-record
    text: He pairs that enforcement posture with victim-services and treatment language.
      Cunningham praised the county's victim/witness coordinator as a major help with
      victim communication, restitution, impact statements, and court expectations.
      He also said Recovery Court, treatment, and mental-health care have value and
      that daily exposure to defendants has shown him the need for a more holistic
      approach. ([Hays Post](https://hayspost.com/posts/7ccb3a8f-a8c6-4baa-9767-cf155c00f4a1))
    sourceIds:
    - mem-memory-candidates-aaron-cunningham-in-their-own-words-md-l13
    sourceUrl: https://hayspost.com/posts/7ccb3a8f-a8c6-4baa-9767-cf155c00f4a1
    sourceFile: memory/candidates/aaron-cunningham/in-their-own-words.md:13
    confidence: likely
    useDecision: use
  - evidenceRowId: em-aaron-cunningham-00010
    classification: documented-record
    text: Public case coverage reinforces his emphasis on formal systems over private
      retaliation. In a March 2026 sentencing story, Hays Post reported that Cunningham
      opposed probation for a defendant convicted after threats and an armed confrontation,
      arguing that letting the defendant justify the conduct would signal people could
      bypass established investigative and court systems. ([Hays Post](https://hayspost.com/posts/a5f579fa-6c33-44fd-921e-5a8435208d58))
    sourceIds:
    - mem-memory-candidates-aaron-cunningham-in-their-own-words-md-l19
    sourceUrl: https://hayspost.com/posts/a5f579fa-6c33-44fd-921e-5a8435208d58
    sourceFile: memory/candidates/aaron-cunningham/in-their-own-words.md:19
    confidence: likely
    useDecision: use
  - evidenceRowId: em-aaron-cunningham-00011
    classification: documented-record
    text: His visible public safety activity also includes community and media settings.
      HaysMed listed him as part of a June 2025 human-trafficking awareness panel
      with medical, law-enforcement, and KBI participants. ([HaysMed](https://www.haysmed.com/haysmed-panel-sheds-light-on-human-trafficking-at-chamber-luncheon/))
      KWCH reported in February 2026 that he confirmed a second-degree murder conviction
      in a Hays infant methamphetamine-overdose case. ([KWCH](https://www.kwch.com/2026/02/11/father-convicted-murder-approaching-2-years-after-hays-infants-fatal-meth-overdose/))
      CBS/48 Hours used him as an attributed professional voice in its Kristen Trickle
      murder-case coverage. ([CBS News](https://www.cbsnews.com/news/kristen-trickle-colby-trickle-kansas-psychological-autopsy-criminal-case-to-determine-mindset-of-fatal-shooting-victim-48-hours/))
    sourceIds:
    - mem-memory-candidates-aaron-cunningham-in-their-own-words-md-l21
    sourceUrl: https://www.haysmed.com/haysmed-panel-sheds-light-on-human-trafficking-at-chamber-luncheon/
    sourceFile: memory/candidates/aaron-cunningham/in-their-own-words.md:21
    confidence: likely
    useDecision: use
  - evidenceRowId: em-aaron-cunningham-00406
    classification: documented-record
