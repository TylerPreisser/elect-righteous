  evidenceItems:
  - evidenceRowId: em-aaron-cunningham-00006
    classification: candidate-stated
    text: That same interview also shows his limits-and-triage message. Cunningham
      said the office receives about 1,500 reports a year from seven law-enforcement
      agencies and does not have enough attorneys to prosecute everything. He described
      prioritizing deaths, crimes against children, sex crimes, violent crimes, property
      crimes, and drug distribution, while noting that a minor marijuana-pipe stop
      involving a nonlocal traveler might not be worth prosecution if the person is
      not an imminent threat. ([Hays Post](https://hayspost.com/posts/7ccb3a8f-a8c6-4baa-9767-cf155c00f4a1))
    sourceIds:
    - mem-memory-candidates-aaron-cunningham-in-their-own-words-md-l11
    sourceUrl: https://hayspost.com/posts/7ccb3a8f-a8c6-4baa-9767-cf155c00f4a1
    sourceFile: memory/candidates/aaron-cunningham/in-their-own-words.md:11
    confidence: likely
    useDecision: use
  - evidenceRowId: em-aaron-cunningham-00008
    classification: candidate-stated
    text: His older public biography fits the same prosecutor-service frame. In a
      2019 Hays High Guidon story, he told students he was drawn to law through writing,
      advocacy, and a strong sense of justice. He said practicing a servant's heart
      was useful and described the job's goal as correcting poor behavior and helping
      victims. ([The Guidon](https://hayshighguidon.com/news/2019/10/26/assistant-ellis-county-attorney-aaron-cunningham-speaks-to-students-about-career-in-law/))
    sourceIds:
